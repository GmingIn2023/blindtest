<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Configuration · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .config-group {
      background: #1e2329;
      border-radius: 1.5rem;
      padding: 1.2rem;
      margin-bottom: 1.5rem;
      border: 1px solid #2a3139;
    }
    .config-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 1rem;
      color: #d4e2f2;
    }
    .radio-group {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .radio-label {
      background: #0f1419;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #2f3b48;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }
    .checkbox-label {
      background: #0f1419;
      padding: 0.7rem 1.2rem;
      border-radius: 60px;
      border: 1px solid #2f3b48;
      display: flex;
      align-items: center;
      gap: 0.8rem;
      cursor: pointer;
    }
    input[type="number"] {
      width: 100%;
      background: #0f1317;
      border: 1px solid #2f3b48;
      border-radius: 60px;
      padding: 0.8rem 1.2rem;
      color: white;
    }
    .error-message {
      color: #ff9999;
      margin-top: 0.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>⚙️ Configuration</h1>
    <form id="config-form">
      <!-- Mode de jeu -->
      <div class="config-group">
        <div class="config-title">🎮 Mode de jeu</div>
        <div class="radio-group">
          <label class="radio-label"><input type="radio" name="gameMode" value="classic" checked> 🎵 Normal</label>
          <label class="radio-label"><input type="radio" name="gameMode" value="instrumental"> 🎸 Instrumental (deviner sans les voix)</label>
          <label class="radio-label"><input type="radio" name="gameMode" value="playlist"> 🎧 Playlist (deviner à qui appartient la chanson)</label>
          <label class="radio-label"><input type="radio" name="gameMode" value="lyrics"> 🎤 Paroles (deviner d'où viennent les paroles)</label>
        </div>
        <div id="playlistModeNote" class="hint-text hidden" style="color:#f5a623; margin-top:0.5rem;">
          ⚠️ Minimum 3 joueurs (hors hôte). Chaque joueur construit sa propre playlist — l'hôte n'en choisit pas.
        </div>
        <div id="playlistSongsPerPlayerGroup" class="hidden" style="margin-top:0.8rem;">
          <label>🎵 Chansons par joueur (mode Playlist)</label>
          <input type="number" id="playlistSongsPerPlayer" min="2" max="5" value="5">
        </div>
        <div id="lyricsModeGroup" class="hidden" style="margin-top:0.8rem;">
          <label>⏱️ Vitesse d'apparition des paroles</label>
          <div class="radio-group">
            <label class="radio-label"><input type="radio" name="lyricsSpeed" value="slow" checked> 🐢 Lent</label>
            <label class="radio-label"><input type="radio" name="lyricsSpeed" value="medium"> 🚶 Moyen</label>
            <label class="radio-label"><input type="radio" name="lyricsSpeed" value="fast"> ⚡ Rapide</label>
          </div>
          <label class="checkbox-label" style="margin-top:0.8rem;">
            <input type="checkbox" id="lyricsSkipWordsCheck"> 🕳️ Certains mots restent cachés (plus difficile)
          </label>
        </div>
      </div>

      <!-- Options communes -->
      <div class="config-group">
        <div class="config-title">🎚️ Paramètres</div>
        <div style="margin-bottom:1rem;">
          <label>Nombre d'essais max par joueur (0 = illimité)</label>
          <input type="number" id="maxAttempts" min="0" max="10" value="3">
        </div>
        <label class="checkbox-label">
          <input type="checkbox" id="blurCheck"> 🎨 Flouter la cover progressivement
        </label>
        <label class="checkbox-label" style="margin-top:0.8rem;">
          <input type="checkbox" id="lockOthersCheck" checked> 🔒 Verrouiller les autres joueurs pendant qu'un joueur répond
        </label>
        <label class="checkbox-label" style="margin-top:0.8rem;">
          <input type="checkbox" id="multipleCorrectCheck"> 🏁 Accepter plusieurs bonnes réponses par manche
        </label>
        <label class="checkbox-label" style="margin-top:0.8rem;">
          <input type="checkbox" id="allowDuplicatesCheck"> 🎭 Accepter les doublons
        </label>
        <p class="hint-text" id="duplicatesHint" style="margin-top:0.3rem; color:#8aaec0;"></p>
        <label class="checkbox-label" style="margin-top:0.8rem;">
          <input type="checkbox" id="advancedSettingsCheck"> 🛠️ Paramètres avancés pour les joueurs (pitch, filtre de fréquences)
        </label>
      </div>

      <!-- Nombre de joueurs (hors hôte) -->
      <div class="config-group">
        <div class="config-title">👥 Joueurs (hors hôte)</div>
        <input type="number" id="playerCount" min="1" max="8" value="2">
      </div>

      <!-- Nombre total de chansons (ajouté) -->
      <div class="config-group" id="totalSongsGroup">
        <div class="config-title">🎵 Nombre total de chansons</div>
        <input type="number" id="totalSongs" min="2" max="20" value="5">
        <p style="color:#8aaec0; margin-top:0.5rem;">Chaque joueur choisira 1 chanson, l'hôte choisira le reste.</p>
      </div>

      <!-- Bouton de création -->
      <button type="submit" class="primary" style="width:100%; padding:1.2rem;">🚀 Créer la partie</button>
      <div id="configError" class="error-message"></div>
    </form>
    <p style="text-align:center; margin-top:1.5rem;">
      <a href="index.html" style="color:#8aaec0;">← Retour à l'accueil</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script>
    (function() {
      const form = document.getElementById('config-form');
      const errorDiv = document.getElementById('configError');
      const isEditMode = new URLSearchParams(window.location.search).get('edit') === '1';
      const submitBtn = form.querySelector('button[type="submit"], button:not([type])') || document.querySelector('#config-form button');

      // Affiche/masque les champs selon le mode choisi
      const totalSongsGroup = document.getElementById('totalSongsGroup');
      const playlistModeNote = document.getElementById('playlistModeNote');
      const playlistSongsPerPlayerGroup = document.getElementById('playlistSongsPerPlayerGroup');
      function updateModeUI() {
        const mode = document.querySelector('input[name="gameMode"]:checked')?.value;
        if (mode === 'playlist') {
          totalSongsGroup.classList.add('hidden');
          playlistModeNote.classList.remove('hidden');
          playlistSongsPerPlayerGroup.classList.remove('hidden');
        } else {
          totalSongsGroup.classList.remove('hidden');
          playlistModeNote.classList.add('hidden');
          playlistSongsPerPlayerGroup.classList.add('hidden');
        }
        document.getElementById('lyricsModeGroup').classList.toggle('hidden', mode !== 'lyrics');
      }
      document.querySelectorAll('input[name="gameMode"]').forEach(r => r.addEventListener('change', updateModeUI));
      updateModeUI();

      // Texte d'explication intelligent : change selon l'état de la case
      const allowDuplicatesCheck = document.getElementById('allowDuplicatesCheck');
      const duplicatesHint = document.getElementById('duplicatesHint');
      function updateDuplicatesHint() {
        duplicatesHint.textContent = allowDuplicatesCheck.checked
          ? 'La chanson n\'apparaîtra qu\'une fois dans la partie.'
          : 'La 2e personne à choisir une chanson déjà prise devra en changer.';
      }
      allowDuplicatesCheck.addEventListener('change', updateDuplicatesHint);
      updateDuplicatesHint();

      // En mode édition (icône ⚙️ depuis la sélection), on pré-remplit le
      // formulaire avec les réglages actuels de la room au lieu d'un
      // formulaire vierge.
      if (isEditMode && AppState.roomCode) {
        db.ref('rooms/' + AppState.roomCode + '/config').once('value', (snap) => {
          const cfg = snap.val();
          if (!cfg) return;
          const modeRadio = document.querySelector(`input[name="gameMode"][value="${cfg.mode}"]`);
          if (modeRadio) modeRadio.checked = true;
          document.getElementById('maxAttempts').value = cfg.maxAttempts;
          document.getElementById('blurCheck').checked = !!cfg.blurEnabled;
          document.getElementById('lockOthersCheck').checked = !!cfg.lockOthersOnBuzz;
          document.getElementById('multipleCorrectCheck').checked = !!cfg.multipleCorrectAllowed;
          document.getElementById('allowDuplicatesCheck').checked = !!cfg.allowDuplicates;
          document.getElementById('advancedSettingsCheck').checked = !!cfg.advancedSettings;
          document.getElementById('playerCount').value = cfg.expectedPlayerCount;
          document.getElementById('totalSongs').value = cfg.totalSongs;
          document.getElementById('playlistSongsPerPlayer').value = cfg.playlistSongsPerPlayer || 5;
          const speedRadio = document.querySelector(`input[name="lyricsSpeed"][value="${cfg.lyricsSpeed || 'slow'}"]`);
          if (speedRadio) speedRadio.checked = true;
          document.getElementById('lyricsSkipWordsCheck').checked = !!cfg.lyricsSkipWords;
          updateModeUI();
          updateDuplicatesHint();
        });
        if (submitBtn) submitBtn.textContent = '💾 Enregistrer les réglages';
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorDiv.textContent = '';

        const mode = document.querySelector('input[name="gameMode"]:checked')?.value;
        if (!mode) {
          errorDiv.textContent = 'Veuillez choisir un mode.';
          return;
        }
        const maxAttempts = parseInt(document.getElementById('maxAttempts').value, 10) || 0;
        const blurEnabled = document.getElementById('blurCheck').checked;
        const lockOthersOnBuzz = document.getElementById('lockOthersCheck').checked;
        const multipleCorrectAllowed = document.getElementById('multipleCorrectCheck').checked;
        const lyricsSpeed = document.querySelector('input[name="lyricsSpeed"]:checked')?.value || 'slow';
        const lyricsSkipWords = document.getElementById('lyricsSkipWordsCheck').checked;
        const allowDuplicates = document.getElementById('allowDuplicatesCheck').checked;
        const advancedSettings = document.getElementById('advancedSettingsCheck').checked;
        const playerCount = parseInt(document.getElementById('playerCount').value, 10);

        if (isNaN(playerCount) || playerCount < 1) {
          errorDiv.textContent = 'Le nombre de joueurs doit être au moins 1.';
          return;
        }
        if (mode === 'playlist' && playerCount < 3) {
          errorDiv.textContent = 'Le mode Playlist demande au moins 3 joueurs (hors hôte).';
          return;
        }

        let totalSongs, hostSongsCount, playlistSongsPerPlayer = 5;
        if (mode === 'playlist') {
          playlistSongsPerPlayer = parseInt(document.getElementById('playlistSongsPerPlayer').value, 10) || 5;
          if (playlistSongsPerPlayer < 2 || playlistSongsPerPlayer > 5) {
            errorDiv.textContent = 'Le nombre de chansons par joueur doit être entre 2 et 5.';
            return;
          }
          // Pas de quota "hôte" en mode Playlist : chaque joueur construit
          // sa propre playlist, l'hôte n'en choisit aucune.
          totalSongs = playerCount * playlistSongsPerPlayer;
          hostSongsCount = 0;
        } else {
          totalSongs = parseInt(document.getElementById('totalSongs').value, 10);
          if (isNaN(totalSongs) || totalSongs < playerCount) {
            errorDiv.textContent = 'Le nombre de chansons doit être au moins égal au nombre de joueurs.';
            return;
          }
          hostSongsCount = totalSongs - playerCount;
        }

        const newConfig = {
          mode: mode,
          maxAttempts: maxAttempts,
          blurEnabled: blurEnabled,
          lockOthersOnBuzz: lockOthersOnBuzz,
          multipleCorrectAllowed: multipleCorrectAllowed,
          allowDuplicates: allowDuplicates,
          advancedSettings: advancedSettings,
          expectedPlayerCount: playerCount,
          totalSongs: totalSongs,
          hostSongsCount: hostSongsCount,
          playlistSongsPerPlayer: playlistSongsPerPlayer,
          lyricsSpeed: lyricsSpeed,
          lyricsSkipWords: lyricsSkipWords
        };

        // ===== Mode édition : on met juste à jour la room existante =====
        if (isEditMode && AppState.roomCode) {
          try {
            await db.ref('rooms/' + AppState.roomCode + '/config').set(newConfig);
            const returnTo = new URLSearchParams(window.location.search).get('return') || 'selection.html';
            window.location.href = returnTo;
          } catch (error) {
            errorDiv.textContent = 'Erreur: ' + error.message;
          }
          return;
        }

        // ===== Mode normal : création d'une toute nouvelle room =====
        const roomCode = generateRoomCode();
        console.log('Création partie code:', roomCode);

        AppState.roomCode = roomCode;
        AppState.isHost = true;
        AppState.clientId = 'host';

        try {
          const roomRef = db.ref('rooms/' + roomCode);
          await roomRef.set({
            config: newConfig,
            players: {},
            selections: {},
            gameState: {
              currentSongIndex: 0,
              songs: [],
              scores: {},
              playerAttempts: {},
              buzzer: null,
              buzzerLocked: false,
              reopenAt: 0,
              roundStartTime: 0,
              roundActive: false,
              lockOthersOnBuzz: lockOthersOnBuzz
            },
            status: 'lobby',
            createdAt: Date.now()
          });
          console.log('Room créée');
          window.location.href = 'host-lobby.html';
        } catch (error) {
          console.error('Erreur création:', error);
          errorDiv.textContent = 'Erreur: ' + error.message;
        }
      });
    })();
  </script>
</body>
</html>
