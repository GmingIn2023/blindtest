<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Partie · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Disposition Générale */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #1c2127;
      padding: 0.8rem 1.2rem;
      border-radius: 1.2rem;
      margin-bottom: 1.2rem;
    }
    .game-round-info { font-weight: 700; color: #5e9eff; font-size: 1.1rem; }
    .game-score-pill { background: #2b3544; padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.9rem; }

    /* Zone Host / Écran Principal */
    .host-screen { text-align: center; margin-bottom: 1.5rem; }
    .vinyl-container {
      width: 140px;
      height: 140px;
      margin: 1rem auto;
      position: relative;
      border-radius: 50%;
      background: #111;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid #2d353e;
    }
    .vinyl-container.spinning { animation: spin 3s linear infinite; }
    .vinyl-cover { width: 60px; height: 60px; border-radius: 50%; object-fit: cover; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Commandes Audio Host */
    .audio-controls { display: flex; justify-content: center; gap: 0.8rem; margin: 1rem 0; }
    .audio-controls button { padding: 0.8rem 1.4rem; border-radius: 1rem; border: none; font-weight: 600; cursor: pointer; }
    #playBtn { background: #3b6eff; color: #fff; }
    #revealBtn { background: #2f7740; color: #fff; }
    #nextBtn { background: #e0a100; color: #fff; }

    /* Écran Joueur & Saisie */
    .player-screen { background: #1c2127; padding: 1.2rem; border-radius: 1.4rem; margin-top: 1rem; }
    .answer-inputs { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1rem; }
    .answer-inputs input {
      background-color: #0f1a24 !important;
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      border: 2px solid #2d353e;
      padding: 0.8rem 1rem;
      border-radius: 0.8rem;
      font-size: 1rem;
    }
    .answer-inputs input:focus { border-color: #5e9eff; outline: none; }
    
    /* Buzzers & Micro */
    .buzz-btn {
      width: 100%;
      padding: 1.5rem;
      border-radius: 1.5rem;
      background: linear-gradient(135deg, #e53e3e 0%, #9b2c2c 100%);
      color: white;
      font-size: 1.5rem;
      font-weight: 800;
      border: none;
      box-shadow: 0 6px 0 #742a2a;
      cursor: pointer;
      margin: 1rem 0;
      transition: transform 0.1s;
    }
    .buzz-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #742a2a; }
    .buzz-btn:disabled { background: #4a5568; box-shadow: none; opacity: 0.5; cursor: not-allowed; }

    /* Révélation de la Chanson */
    .reveal-card {
      background: #1e2631;
      border: 2px solid #5e9eff;
      border-radius: 1.2rem;
      padding: 1.2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1.2rem 0;
      text-align: left;
    }
    .reveal-card img { width: 80px; height: 80px; border-radius: 12px; object-fit: cover; }
    .reveal-title { font-size: 1.2rem; font-weight: 700; color: #fff; }
    .reveal-artist { color: #8aaec0; font-size: 1rem; margin-top: 0.2rem; }

    /* Tableau des scores / Feed */
    .live-feed { background: #12161b; border-radius: 1rem; padding: 0.8rem; max-height: 180px; overflow-y: auto; margin-top: 1rem; font-size: 0.88rem; }
    .feed-item { padding: 0.4rem 0; border-bottom: 1px solid #1c222b; display: flex; justify-content: space-between; }
    .feed-item:last-child { border-bottom: none; }
    .feed-correct { color: #4fd97f; }
    .feed-wrong { color: #ff6b6b; }

    /* Modale / Écran Final */
    .podium-container { display: flex; flex-direction: column; gap: 0.8rem; margin-top: 1.5rem; }
    .podium-item { display: flex; justify-content: space-between; align-items: center; background: #1a202c; padding: 1rem; border-radius: 1rem; }
    .podium-rank { font-size: 1.4rem; font-weight: 800; width: 35px; }
    .rank-1 { border: 2px solid #ecc94b; background: #2c2411; }
    .rank-2 { border: 2px solid #a0aec0; background: #1a202c; }
    .rank-3 { border: 2px solid #ed8936; background: #271a12; }

    /* Spécifique Karaoke / Lyrics */
    .lyrics-display-box { background: #101418; border: 1px solid #2d353e; padding: 1.2rem; border-radius: 1rem; font-size: 1.2rem; font-weight: 600; text-align: center; color: #fff; margin: 1rem 0; white-space: pre-line; }
  </style>
</head>
<body>
  <div id="app">
    <!-- En-tête de jeu -->
    <div class="game-header">
      <div class="game-round-info" id="roundDisplay">Manche 1 / ?</div>
      <div class="game-score-pill" id="myScoreDisplay">Score : 0 pts</div>
    </div>

    <!-- VUE HOST (S'affiche si Host ou Écran Global) -->
    <div id="hostArea" class="host-screen hidden">
      <div class="vinyl-container" id="vinyl">
        <img src="assets/vinyl-placeholder.png" id="vinylCover" class="vinyl-cover" alt="vinyl">
      </div>
      
      <!-- Zone d'affichage Paroles (Mode Lyrics) -->
      <div id="lyricsDisplay" class="lyrics-display-box hidden"></div>

      <!-- Contrôles Host -->
      <div class="audio-controls">
        <button id="playBtn">▶️ Lancer l'extrait</button>
        <button id="revealBtn" class="hidden">👁️ Révéler</button>
        <button id="nextBtn" class="hidden">➡️ Chanson Suivante</button>
      </div>
    </div>

    <!-- CARTE DE RÉVÉLATION (Découverte de la musique) -->
    <div id="revealCard" class="reveal-card hidden">
      <img id="revealArtwork" src="" alt="cover">
      <div>
        <div id="revealTitle" class="reveal-title">?</div>
        <div id="revealArtist" class="reveal-artist">?</div>
        <div id="revealOwner" style="font-size:0.8rem; color:#5e9eff; margin-top:0.3rem;"></div>
      </div>
    </div>

    <!-- VUE JOUEUR (Saisie des réponses / Buzzer) -->
    <div id="playerArea" class="player-screen">
      <!-- Mode Standard / QCM / Playlist -->
      <div id="standardInputs" class="answer-inputs">
        <label style="font-size:0.85rem; color:#8aaec0;">🎵 Titre de la chanson :</label>
        <input type="text" id="inputTitle" placeholder="Ex: Bohemian Rhapsody" autocomplete="off" spellcheck="false">
        
        <label style="font-size:0.85rem; color:#8aaec0;">👤 Artiste / Groupe :</label>
        <input type="text" id="inputArtist" placeholder="Ex: Queen" autocomplete="off" spellcheck="false">

        <button id="submitAnswerBtn" style="background:#3b6eff; color:#fff; padding:0.9rem; border:none; border-radius:0.8rem; font-weight:700; margin-top:0.5rem; cursor:pointer;">
          🚀 Valider mes réponses
        </button>
      </div>

      <!-- Mode Buzzer -->
      <div id="buzzerArea" class="hidden">
        <button id="buzzBtn" class="buzz-btn">🔔 BUZZER !</button>
        <div id="buzzerStatus" style="text-align:center; font-weight:600; color:#8aaec0;"></div>
      </div>
    </div>

    <!-- FEED TEMPS RÉEL DES RÉPONSES & SCORES -->
    <div style="margin-top: 1.5rem;">
      <div style="font-size:0.9rem; font-weight:700; color:#8aaec0; margin-bottom:0.4rem;">📊 Activité de la manche :</div>
      <div id="liveFeed" class="live-feed">
        <div style="color:#5c6b73; text-align:center;">En attente des réponses...</div>
      </div>
    </div>

    <!-- ÉCRAN DE FIN DE PARTIE (PODIUM) -->
    <div id="finalScreen" class="hidden" style="text-align:center; margin-top:1rem;">
      <h2>🏆 Fin de la Partie !</h2>
      <p style="color:#8aaec0;">Voici le classement final :</p>
      <div id="podiumList" class="podium-container"></div>
      
      <button id="backToLobbyBtn" style="background:#3b6eff; color:#fff; border:none; padding:1rem 2rem; border-radius:1rem; font-size:1rem; font-weight:700; margin-top:2rem; cursor:pointer;">
        🏠 Retourner au Salon
      </button>
    </div>
  </div>

  <!-- FIREBASE & APPS SCRIPTS -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio-effects.js"></script>

  <script>
    (function() {
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost;
      const clientId = AppState.clientId;
      const playerName = AppState.playerName || 'Joueur';

      if (!roomCode) { window.location.href = 'index.html'; return; }

      const roomRef = db.ref('rooms/' + roomCode);
      const gameStateRef = roomRef.child('gameState');
      const configRef = roomRef.child('config');

      // Éléments DOM
      const roundDisplay = document.getElementById('roundDisplay');
      const myScoreDisplay = document.getElementById('myScoreDisplay');
      const hostArea = document.getElementById('hostArea');
      const playerArea = document.getElementById('playerArea');
      const vinyl = document.getElementById('vinyl');
      const vinylCover = document.getElementById('vinylCover');
      const playBtn = document.getElementById('playBtn');
      const revealBtn = document.getElementById('revealBtn');
      const nextBtn = document.getElementById('nextBtn');
      const revealCard = document.getElementById('revealCard');
      const revealArtwork = document.getElementById('revealArtwork');
      const revealTitle = document.getElementById('revealTitle');
      const revealArtist = document.getElementById('revealArtist');
      const revealOwner = document.getElementById('revealOwner');
      const inputTitle = document.getElementById('inputTitle');
      const inputArtist = document.getElementById('inputArtist');
      const submitAnswerBtn = document.getElementById('submitAnswerBtn');
      const liveFeed = document.getElementById('liveFeed');
      const lyricsDisplay = document.getElementById('lyricsDisplay');
      const finalScreen = document.getElementById('finalScreen');
      const podiumList = document.getElementById('podiumList');
      const backToLobbyBtn = document.getElementById('backToLobbyBtn');

      let currentSongsList = [];
      let currentIndex = 0;
      let gameConfig = {};
      let hasSubmitted = false;

      // Affichage de la zone Host si on est l'hôte
      if (isHost) {
        hostArea.classList.remove('hidden');
      }

      // 1. Démarrage et écoute de la configuration & de l'état
      configRef.once('value', (snap) => {
        gameConfig = snap.val() || {};
        if (gameConfig.mode === 'lyrics') {
          document.getElementById('standardInputs').classList.add('hidden');
          // Adapter pour le mode paroles
        }
      });

      // Synchronisation de l'état du jeu
      gameStateRef.on('value', (snap) => {
        const state = snap.val();
        if (!state) return;

        currentSongsList = state.songs || [];
        currentIndex = state.currentIndex || 0;

        // Mettre à jour la manche
        roundDisplay.textContent = `Manche ${currentIndex + 1} / ${currentSongsList.length}`;

        // Si la partie est terminée
        if (state.status === 'finished') {
          showFinalPodium(state.scores || {});
          return;
        }

        const currentSong = currentSongsList[currentIndex];
        if (!currentSong) return;

        // Mise à jour si la musique est révélée
        if (state.revealed) {
          showSongReveal(currentSong);
        } else {
          hideSongReveal();
        }

        // Mettre à jour mes scores personnels
        if (state.scores && state.scores[clientId] !== undefined) {
          myScoreDisplay.textContent = `Score : ${state.scores[clientId]} pts`;
        }

        // Mettre à jour le feed en direct des réponses
        updateLiveFeed(state.answers || {}, state.players || {});
      });

      // 2. Actions Host : Lecture, Révélation, Suivant
      if (isHost) {
        playBtn.onclick = () => {
          const currentSong = currentSongsList[currentIndex];
          if (!currentSong) return;

          vinyl.classList.add('spinning');
          playAudioClip(currentSong);
          
          if (gameConfig.mode === 'lyrics') {
            lyricsDisplay.textContent = currentSong.lyricsSnippet || "Pas de paroles disponibles.";
            lyricsDisplay.classList.remove('hidden');
          }

          playBtn.classList.add('hidden');
          revealBtn.classList.remove('hidden');
        };

        revealBtn.onclick = () => {
          stopAudio();
          vinyl.classList.remove('spinning');
          gameStateRef.update({ revealed: true });
          
          revealBtn.classList.add('hidden');
          nextBtn.classList.remove('hidden');

          // Calcul et attribution automatique des points
          calculateScoresForCurrentRound();
        };

        nextBtn.onclick = () => {
          const nextIndex = currentIndex + 1;
          if (nextIndex >= currentSongsList.length) {
            gameStateRef.update({ status: 'finished' });
          } else {
            hasSubmitted = false;
            resetPlayerInputs();
            gameStateRef.update({
              currentIndex: nextIndex,
              revealed: false,
              answers: {}
            });
            nextBtn.classList.add('hidden');
            playBtn.classList.remove('hidden');
          }
        };
      }

      // 3. Soumission de la réponse par le Joueur
      submitAnswerBtn.onclick = () => {
        if (hasSubmitted) return;

        const titleAns = inputTitle.value.trim();
        const artistAns = inputArtist.value.trim();

        if (!titleAns && !artistAns) return;

        gameStateRef.child('answers').child(clientId).set({
          title: titleAns,
          artist: artistAns,
          playerName: playerName,
          timestamp: Date.now()
        });

        hasSubmitted = true;
        submitAnswerBtn.disabled = true;
        submitAnswerBtn.textContent = '✅ Réponse envoyée !';
        submitAnswerBtn.style.background = '#2f7740';
      };

      // 4. Fonctions Utilitaires & Calculs
      function calculateScoresForCurrentRound() {
        const currentSong = currentSongsList[currentIndex];
        if (!currentSong) return;

        gameStateRef.once('value', (snap) => {
          const state = snap.val();
          const answers = state.answers || {};
          const currentScores = state.scores || {};

          Object.keys(answers).forEach((pId) => {
            const ans = answers[pId];
            let pointsEarned = 0;

            // Verification Titre (Distance Levenshtein / Fuzzy match basique)
            if (ans.title && isSimilar(ans.title, currentSong.title)) {
              pointsEarned += 1;
            }
            // Verification Artiste
            if (ans.artist && isSimilar(ans.artist, currentSong.artist)) {
              pointsEarned += 1;
            }

            currentScores[pId] = (currentScores[pId] || 0) + pointsEarned;
          });

          gameStateRef.child('scores').set(currentScores);
        });
      }

      function isSimilar(input, target) {
        if (!input || !target) return false;
        const cleanInput = input.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        const cleanTarget = target.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim();
        return cleanTarget.includes(cleanInput) || cleanInput.includes(cleanTarget);
      }

      function showSongReveal(song) {
        revealArtwork.src = song.artwork || 'assets/vinyl-placeholder.png';
        revealTitle.textContent = song.title;
        revealArtist.textContent = song.artist;
        revealOwner.textContent = song.ownerName ? `Proposé par : ${song.ownerName}` : '';
        revealCard.classList.remove('hidden');
        vinylCover.src = song.artwork || 'assets/vinyl-placeholder.png';
      }

      function hideSongReveal() {
        revealCard.classList.add('hidden');
        vinylCover.src = 'assets/vinyl-placeholder.png';
      }

      function resetPlayerInputs() {
        inputTitle.value = '';
        inputArtist.value = '';
        submitAnswerBtn.disabled = false;
        submitAnswerBtn.textContent = '🚀 Valider mes réponses';
        submitAnswerBtn.style.background = '#3b6eff';
      }

      function updateLiveFeed(answers, players) {
        liveFeed.innerHTML = '';
        const entries = Object.entries(answers);

        if (entries.length === 0) {
          liveFeed.innerHTML = '<div style="color:#5c6b73; text-align:center;">En attente des réponses...</div>';
          return;
        }

        entries.forEach(([pId, ans]) => {
          const item = document.createElement('div');
          item.className = 'feed-item';
          item.innerHTML = `<span><strong>${escapeHTML(ans.playerName)}</strong> a répondu.</span><span style="color:#4fd97f;">✓ Transmis</span>`;
          liveFeed.appendChild(item);
        });
      }

      function showFinalPodium(scores) {
        hostArea.classList.add('hidden');
        playerArea.classList.add('hidden');
        revealCard.classList.add('hidden');
        finalScreen.classList.remove('hidden');

        podiumList.innerHTML = '';
        const sorted = Object.entries(scores).sort((a, b) => b[1] - a[1]);

        sorted.forEach(([pId, score], idx) => {
          const item = document.createElement('div');
          item.className = `podium-item ${idx === 0 ? 'rank-1' : idx === 1 ? 'rank-2' : idx === 2 ? 'rank-3' : ''}`;
          item.innerHTML = `
            <div style="display:flex; align-items:center; gap:0.8rem;">
              <span class="podium-rank">#${idx + 1}</span>
              <span style="font-weight:700;">Joueur (${pId.substring(0, 5)})</span>
            </div>
            <div style="font-weight:800; font-size:1.2rem; color:#5e9eff;">${score} pts</div>
          `;
          podiumList.appendChild(item);
        });
      }

      backToLobbyBtn.onclick = () => {
        if (isHost) {
          roomRef.update({ status: 'lobby' });
          window.location.href = 'host-lobby.html';
        } else {
          window.location.href = 'waiting.html';
        }
      };

      function escapeHTML(str) {
        return String(str).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c] || c));
      }
    })();
  </script>
</body>
</html>
