<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3ECE0">
  <title>En attente · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { max-width: 520px; }
    .waiting-room { text-align: center; }
    .waiting-room .vinyl { width: 132px; height: 132px; margin: 0.25rem auto 1.25rem; }
    .waiting-room h1 { margin-bottom: 0.5rem; }
    #waitingMessage { margin: 0 auto; }
    .wait-count {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 1.3125rem;
      font-variant-numeric: tabular-nums lining-nums;
      margin: 1.5rem 0 0.75rem;
    }
    .wait-count:empty { display: none; }

    .progress-list {
      text-align: left;
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0.15rem 1rem;
      margin-top: 1rem;
    }
    .wait-count + .progress-list { margin-top: 0; }
    .progress-list:empty { display: none; }
    .progress-item {
      display: flex; align-items: center; justify-content: space-between; gap: 0.75rem;
      padding: 0.75rem 0;
      border-bottom: 1px solid var(--line);
      animation: rise-in .25s var(--ease) both;
    }
    .progress-item:last-child { border-bottom: none; }
    .progress-item > span:first-child { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
    .ready-badge, .not-ready-badge {
      display: inline-flex; align-items: center; gap: 0.3rem; flex: none;
      padding: 0.2rem 0.7rem;
      border: 1px solid transparent; border-radius: 999px;
      font-size: 0.875rem; font-weight: 600; line-height: 1.4;
      white-space: nowrap;
    }
    .ready-badge { background: var(--pine-soft); color: var(--pine); border-color: #A9CFC0; }
    .not-ready-badge { background: var(--sunk); color: var(--ink-2); border-color: var(--line); }

    .wait-actions { margin-top: 1.5rem; }
    #forceBtn { width: auto; min-width: 240px; margin: 0 auto; }
    .auto-hint { font-size: 0.875rem; color: var(--ink-2); margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="app">
    <div class="waiting-room">
      <svg class="vinyl is-playing" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <circle class="v-disc" cx="100" cy="100" r="98"/>
        <g class="v-grooves">
          <circle cx="100" cy="100" r="89"/><circle cx="100" cy="100" r="81"/><circle cx="100" cy="100" r="73"/>
          <circle cx="100" cy="100" r="65"/><circle cx="100" cy="100" r="57"/><circle cx="100" cy="100" r="49"/>
        </g>
        <path class="v-shine" d="M100 17a83 83 0 0 1 63 29"/>
        <path class="v-shine" d="M100 183a83 83 0 0 1-63-29"/>
        <g class="v-label">
          <circle class="v-label-bg" cx="100" cy="100" r="37"/>
          <path id="vlWait" d="M100 76a24 24 0 1 1 0 48a24 24 0 1 1 0-48" fill="none"/>
          <text class="v-label-text"><textPath href="#vlWait">BLIND TEST · FACE A ·</textPath></text>
          <circle class="v-hole" cx="100" cy="100" r="4"/>
        </g>
      </svg>
      <h1>On attend tout le monde</h1>
      <p id="waitingMessage" class="lede" role="status" aria-live="polite">Certains choisissent encore leurs chansons…</p>
      <p id="waitingCount" class="wait-count"></p>
      <div id="waitingProgress" class="progress-list"></div>
      <div class="wait-actions">
        <button id="forceBtn" class="hidden">Lancer sans attendre</button>
        <p class="auto-hint">La page se met à jour toute seule.</p>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script>
    (function() {
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost;

      if (!roomCode) { window.location.href = 'index.html'; return; }

      const roomRef = db.ref('rooms/' + roomCode);
      const selectionsRef = roomRef.child('selections');
      const playersRef = roomRef.child('players');

      const waitingProgress = document.getElementById('waitingProgress');
      const waitingMessage = document.getElementById('waitingMessage');
      const waitingCount = document.getElementById('waitingCount');
      let alreadyMerged = false;
      let redirecting = false;

      function dedupeSongs(allSongs) {
        const byKey = new Map();
        const result = [];
        allSongs.forEach((song) => {
          const key = (song.title + '|' + song.artist).toLowerCase().replace(/[^a-z0-9|]/g, '');
          if (byKey.has(key)) {
            const existing = byKey.get(key);
            const existingIds = existing.ownerIds || (existing.ownerId ? [existing.ownerId] : []);
            const existingNames = existing.ownerNames || (existing.ownerName ? [existing.ownerName] : []);
            if (song.ownerId && !existingIds.includes(song.ownerId)) {
              existing.ownerIds = existingIds.concat([song.ownerId]);
              existing.ownerNames = existingNames.concat([song.ownerName]);
              delete existing.ownerId; delete existing.ownerName;
            }
          } else {
            byKey.set(key, song); result.push(song);
          }
        });
        return result;
      }

      async function mergeSelectionsIntoGameState(selections, playerList, force) {
        if (alreadyMerged || !isHost) return;
        alreadyMerged = true;
        try {
        // Garde-fou : si la partie est déjà lancée, on ne la réinitialise surtout pas (scores, manche…)
        const [stSnap, gsSnap] = await Promise.all([roomRef.child('status').once('value'), roomRef.child('gameState').once('value')]);
        const curGs = gsSnap.val() || {};
        if (stSnap.val() === 'game' && Array.isArray(curGs.songs) && curGs.songs.length) return;

        const configSnap = await roomRef.child('config').once('value');
        const config = configSnap.val() || {};

        let allSongs = [];
        if (selections.host && Array.isArray(selections.host.songs)) {
          allSongs = allSongs.concat(selections.host.songs);
        }
        playerList.forEach(p => {
          const sel = selections[p.id];
          if (sel && Array.isArray(sel.songs)) allSongs = allSongs.concat(sel.songs);
        });

        if (!allSongs.length) {
          alreadyMerged = false;
          if (force) alert('Aucune chanson choisie pour le moment.');
          return false;
        }
        if (config.allowDuplicates) allSongs = dedupeSongs(allSongs);

        // Fisher-Yates Shuffle
        for (let i = allSongs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allSongs[i], allSongs[j]] = [allSongs[j], allSongs[i]];
        }

        const scores = {};
        playerList.forEach(p => { scores[p.id] = 0; });

        await roomRef.child('gameState').set({
          songs: allSongs,
          currentSongIndex: 0,
          phase: 'idle',
          finished: false,
          scores: scores,
          buzzer: null,
          solved: false,
          roundStartTime: 0,
          mode: config.mode || 'classic',
          maxAttempts: config.maxAttempts !== undefined ? config.maxAttempts : 3,
          blurEnabled: !!config.blurEnabled,
          revealSpeed: config.revealSpeed || 'normal',
          lockOthersOnBuzz: config.lockOthersOnBuzz !== undefined ? config.lockOthersOnBuzz : true,
          multipleCorrectAllowed: !!config.multipleCorrectAllowed,
          lyricsSpeed: config.lyricsSpeed || 'slow',
          lyricsSkipWords: !!config.lyricsSkipWords
        });
        await roomRef.child('status').set('game');
        } catch (e) {
          // réseau coupé pendant la fusion : on autorise une nouvelle tentative au prochain passage
          alreadyMerged = false;
          waitingMessage.textContent = 'Connexion perdue, nouvelle tentative…';
          return false;
        }
      }

      async function waitForSongsThenRedirect() {
        if (redirecting) return;
        redirecting = true;
        waitingMessage.textContent = 'Tout le monde est prêt ! On lance la partie…';
        for (let i = 0; i < 15; i++) {
          try {
            const g = (await roomRef.child('gameState').once('value')).val() || {};
            if (g.finished) { window.location.href = 'podium.html'; return; }
            if (Array.isArray(g.songs) && g.songs.length > 0) { window.location.href = 'game.html'; return; }
          } catch (e) {}
          await new Promise(r => setTimeout(r, 400));
        }
        window.location.href = 'game.html';
      }

      function updateProgress() {
        playersRef.once('value').then(playersSnap => {
          const players = playersSnap.val() || {};
          const playerList = Object.entries(players).map(([id, data]) => ({ id, ...data }));

          selectionsRef.once('value').then(async selectionsSnap => {
            const selections = selectionsSnap.val() || {};
            const configSnap = await roomRef.child('config').once('value');
            const config = configSnap.val() || {};
            const songsPerPlayer = config.songsPerPlayer !== undefined ? config.songsPerPlayer : 1;

            const hostDone = selections.host && selections.host.done === true;
            let allReady = hostDone;
            let readyCount = hostDone ? 1 : 0;
            let html = '';

            const badge = done => done
              ? '<span class="ready-badge">✅ Prêt</span>'
              : '<span class="not-ready-badge">⏳ En cours</span>';

            html += `<div class="progress-item"><span>🎤 L'hôte</span>${badge(hostDone)}</div>`;

            playerList.forEach(player => {
              // Si le quota pour le joueur est réglé à 0, il est immédiatement considéré prêt
              const playerDone = songsPerPlayer === 0 || (selections[player.id] && selections[player.id].done === true);
              if (!playerDone) allReady = false;
              else readyCount++;

              html += `<div class="progress-item"><span>${escapeHTML(player.avatar)} ${escapeHTML(player.name)}</span>${badge(playerDone)}</div>`;
            });

            // On ne réécrit la liste que si elle a changé (pas de clignotement toutes les 2,5 s)
            if (waitingProgress.dataset.html !== html) {
              waitingProgress.innerHTML = html;
              waitingProgress.dataset.html = html;
            }
            const total = playerList.length + 1;
            waitingCount.textContent = readyCount + ' sur ' + total + (readyCount > 1 ? ' sont prêts' : ' est prêt');

            if (allReady) {
              if ((await mergeSelectionsIntoGameState(selections, playerList)) !== false) waitForSongsThenRedirect();
            }
          });
        });
      }

      roomRef.child('status').once('value', async (statusSnap) => {
        if (statusSnap.val() === 'lobby') {
          waitingMessage.textContent = 'En attente que l\'hôte relance une partie…';
          waitingProgress.innerHTML = '';
          roomRef.child('status').on('value', snap => {
            if (snap.val() === 'selection') window.location.href = 'selection.html';
          });
          return;
        }
        if (statusSnap.val() === 'game') { waitForSongsThenRedirect(); return; }   // partie déjà lancée
        // Arrivé ici alors que SA sélection n'est pas terminée : on le renvoie la finir
        if (statusSnap.val() === 'selection') {
          const me = isHost ? 'host' : AppState.clientId;
          let mine = null;
          try { mine = me ? (await selectionsRef.child(me).once('value')).val() : null; } catch (e) {}
          if (!mine || mine.done !== true) {
            window.location.href = isHost ? 'selection.html?role=host' : 'selection.html';
            return;
          }
        }
        updateProgress();
        setInterval(updateProgress, 2500);
      });

      const forceBtn = document.getElementById('forceBtn');
      if (isHost) {
        forceBtn.classList.remove('hidden');
        forceBtn.onclick = async () => {
          if (!confirm('Lancer avec les chansons déjà choisies ?')) return;
          const [ps, ss] = await Promise.all([playersRef.once('value'), selectionsRef.once('value')]);
          const pl = Object.entries(ps.val() || {}).map(([id, d]) => ({ id, ...d }));
          if ((await mergeSelectionsIntoGameState(ss.val() || {}, pl, true)) !== false) waitForSongsThenRedirect();
        };
      }
      roomRef.child('status').on('value', s => { if (s.val() === 'game' && !isHost) waitForSongsThenRedirect(); });
    })();
  </script>
</body>
</html>
