<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Partie · Blind Test</title>
<link rel="stylesheet" href="css/style.css">
<style>
  /* ===== Écran de jeu — « Pochette de vinyle » (tokens : css/style.css, voir DESIGN.md) ===== */
  body { padding: 12px 16px 28px; }
  #app { max-width: 620px; margin-top: 0; padding: 16px 16px 22px; }
  ::selection { background: var(--mustard); color: var(--ink); }
  input { caret-color: var(--tomato); }

  /* --- Barre du haut --- */
  .g-top { display: flex; justify-content: space-between; align-items: center; gap: .75rem; min-height: 44px; margin-bottom: 10px; }
  .g-round { font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; line-height: 1.15;
             color: var(--ink); font-variant-numeric: tabular-nums; }
  .g-top-end { display: flex; align-items: center; gap: .4rem; flex: none; }
  .g-pill { font-family: var(--font-display); font-weight: 700; font-size: 1.05rem; line-height: 1;
            font-variant-numeric: tabular-nums; white-space: nowrap; color: var(--ink);
            background: var(--mustard-soft); border: 1.5px solid var(--ink); border-radius: 999px; padding: .5rem .85rem .45rem; }
  .g-exit { width: 44px; height: 44px; min-height: 44px; flex: none; margin: 0; padding: 0;
            background: transparent; border: 1px solid transparent; border-radius: var(--r-sm); color: var(--ink-2); }
  .g-exit:hover:not(:disabled) { background: var(--sunk); color: var(--ink); }
  .g-exit svg { width: 22px; height: 22px; display: block; }

  /* --- Platine : vinyle noir, pochette au centre --- */
  .deck { --disc: 184px; position: relative; width: var(--disc); height: var(--disc); margin: 4px auto 0; border-radius: 50%;
          box-shadow: 0 2px 0 var(--line), 0 18px 26px -14px rgba(30, 26, 22, .55); }
  .deck::after {               /* reflet fixe : le disque tourne dessous, la lumière ne bouge pas */
    content: ''; position: absolute; inset: 0; z-index: 3; border-radius: 50%; pointer-events: none;
    background: conic-gradient(from 215deg, transparent 0deg, rgba(243, 236, 224, .16) 24deg, transparent 50deg,
                               transparent 180deg, rgba(243, 236, 224, .10) 204deg, transparent 230deg);
    -webkit-mask: radial-gradient(circle closest-side, transparent 0 59%, #000 60.5%);
            mask: radial-gradient(circle closest-side, transparent 0 59%, #000 60.5%);
  }
  .cover-wrap { position: absolute; inset: 0; border-radius: 50%; }
  .vinyl-disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: var(--ink);
    background:
      radial-gradient(circle closest-side, transparent 0 64%, rgba(243, 236, 224, .08) 64.6% 65.3%, transparent 66% 81%,
                      rgba(243, 236, 224, .07) 81.6% 82.2%, transparent 82.8% 96.5%, rgba(243, 236, 224, .14) 97.5% 99.2%, transparent 100%),
      repeating-radial-gradient(circle at 50% 50%, rgba(243, 236, 224, 0) 0 2px, rgba(243, 236, 224, .05) 2px 3px),
      var(--ink);
  }
  .cover-wrap::after {         /* trou central */
    content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; z-index: 2; border-radius: 50%;
    background: var(--paper); transform: translate(-50%, -50%);
    box-shadow: 0 0 0 1.5px var(--ink), inset 0 1px 2px rgba(30, 26, 22, .45);
  }
  .cover-label {
    position: absolute; left: 50%; top: 50%; width: 58%; height: 58%; transform: translate(-50%, -50%);
    border-radius: 50%; overflow: hidden; background: var(--mustard); z-index: 1;
    box-shadow: 0 0 0 2px var(--ink), 0 0 0 4px rgba(243, 236, 224, .12);
  }
  .cover-label > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .cover-sectors { position: absolute; inset: 0; display: none; }
  .cover-sectors.on { display: block; }
  .cover-sectors .base { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; filter: blur(22px); transform: scale(1.18); }
  .cover-sectors canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cover-wrap.spin { animation: slowspin 22s linear infinite; will-change: transform; }
  @keyframes slowspin { to { transform: rotate(360deg); } }

  .timer-big { font-size: 2.5rem; line-height: 1; margin: 16px 0 4px; }

  /* --- Paroles --- */
  .lyrics-box { background: var(--sunk); border-radius: var(--r-md); padding: 1rem 1.1rem; margin: 12px 0; min-height: 5rem;
                font-family: var(--font-display); font-size: 1.3rem; font-weight: 600; line-height: 1.6;
                text-align: center; text-wrap: balance; color: var(--ink); }
  .lyrics-box .w { opacity: .2; transition: opacity .18s var(--ease); }
  .lyrics-box .w.on { opacity: 1; }

  /* --- Buzz : bandeau tomate doux + flash court --- */
  .buzz-banner { background: var(--tomato-soft); border: 1.5px solid var(--tomato); border-radius: var(--r-md);
                 padding: .7rem 1rem; margin: 12px 0 4px; text-align: center; text-wrap: balance;
                 font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.2; color: var(--ink);
                 animation: g-rise .18s var(--ease) both; }

  .flash { position: fixed; inset: 0; z-index: 2000; pointer-events: none;
           display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center;
           background: rgba(246, 217, 204, .86);             /* --tomato-soft, translucide */
           border: 10px solid var(--tomato);
           font-family: var(--font-display); font-weight: 800; font-size: clamp(2.25rem, 10vw, 5rem); line-height: 1.1; color: var(--ink);
           animation: g-flash .7s var(--ease) forwards; }
  @keyframes g-flash { 0% { opacity: 0; } 14% { opacity: 1; } 58% { opacity: 1; } 100% { opacity: 0; } }

  /* --- Révélation : vert sapin doux --- */
  .reveal-card { display: flex; gap: .9rem; align-items: center; text-align: left;
                 background: var(--pine-soft); border: 1.5px solid var(--pine); border-radius: var(--r-md);
                 padding: .75rem; margin: 12px 0 4px; animation: g-rise .2s var(--ease) both; }
  .reveal-card > div { min-width: 0; }
  .reveal-card img { width: 72px; height: 72px; flex: none; border-radius: var(--r-sm); object-fit: cover;
                     background: var(--sunk); box-shadow: 0 0 0 1px rgba(30, 26, 22, .18); }
  .reveal-card .t { font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; line-height: 1.15; color: var(--ink); overflow-wrap: anywhere; }
  .reveal-card .a { color: var(--ink-2); font-size: 1rem; line-height: 1.3; margin-top: 2px; }
  .reveal-card .o { color: var(--pine); font-size: .9rem; font-weight: 600; margin-top: 5px; }

  @keyframes g-rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* --- Hôte --- */
  .btn-row { display: flex; gap: .6rem; }
  .btn-row button { flex: 1 1 0; margin: .5rem 0; }
  #hostZone button { min-height: 54px; font-size: 1.05rem; }
  #hostZone button.primary { margin-bottom: .5rem; }
  #btnReveal.armed { background: var(--pine); color: #fff; border-color: var(--ink); box-shadow: var(--shadow-key); }
  #btnReveal.armed:hover:not(:disabled) { background: var(--pine); filter: brightness(.92); }
  #btnReveal.armed:active:not(:disabled) { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
  .note { color: var(--ink-2); font-size: .95rem; text-align: center; text-wrap: pretty; margin: .5rem 0; }

  /* --- Joueur --- */
  #playerZone { display: flex; flex-direction: column; }
  .buzzer-btn { width: min(74vw, 276px); height: min(74vw, 276px); flex: none; margin: 18px auto 12px; font-size: 3.2rem; }
  .buzzer-btn:disabled { color: var(--ink-2); }
  #playerStatus { color: var(--ink); font-size: 1.05rem; font-weight: 600; margin-top: .4rem; }

  /* Pendant la réponse : le champ passe en haut, le BUZZ reste enfoncé, en petit */
  #playerZone:has(#answerZone:not(.hidden)) #answerZone { order: -2; margin-top: 12px; }
  #playerZone:has(#answerZone:not(.hidden)) #playerStatus { order: -1; }
  #playerZone:has(#answerZone:not(.hidden)) .buzzer-btn,
  #playerZone:has(#answerZone:not(.hidden)) .buzzer-btn:disabled {
    width: 96px; height: 96px; margin: 10px auto 0; font-size: 1.3rem; letter-spacing: .04em;
    background: var(--tomato); color: #fff; border-color: var(--ink);
    box-shadow: 0 1px 0 var(--ink); transform: translateY(4px); }

  .answer-row { display: flex; gap: .5rem; align-items: stretch; }
  .answer-row input { flex: 1 1 auto; min-width: 0; margin: 0; min-height: 56px; font-size: 18px; border-radius: var(--r-sm); }
  #answerInput::placeholder { color: var(--ink-2); opacity: 1; }
  .answer-row button.primary { width: auto; min-width: 76px; min-height: 56px; margin: 0; padding: 0 1.2rem;
                               font-size: 1.1rem; font-weight: 700; white-space: nowrap; }

  .vote-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: .6rem; margin: .75rem 0; }
  .vote-grid button { margin: 0; padding: .9rem .6rem; min-height: 56px; font-size: 1.05rem; }
  .vote-grid button.picked, .vote-grid button.picked:disabled {
    background: var(--mustard); color: var(--ink); border-color: var(--ink); opacity: 1; box-shadow: var(--shadow-key); }

  /* --- Réponses & classement : sobres, filets --line --- */
  .g-sec { margin-top: 22px; }
  .g-h { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; line-height: 1.2; color: var(--ink); margin-bottom: 6px; }
  .feed { max-height: 9.6rem; overflow-y: auto; border-top: 1px solid var(--line); font-size: .94rem; line-height: 1.35;
          scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .feed div { padding: .5rem 0; border-bottom: 1px solid var(--line); }
  .feed div:last-child { border-bottom: none; }
  .ok { color: var(--pine); } .ko { color: var(--berry); } .mut { color: var(--ink-2); }

  .board { border-top: 1px solid var(--line); }
  .board .row { display: flex; justify-content: space-between; align-items: center; gap: .75rem;
                padding: .55rem .6rem; border-bottom: 1px solid var(--line); font-weight: 500; }
  .board .row:last-child { border-bottom: none; }
  .board .row > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .board .row.me { background: var(--mustard-soft); border-radius: var(--r-sm); font-weight: 700; }
  .board .pts { font-family: var(--font-display); font-weight: 700; font-size: 1.15rem; font-variant-numeric: tabular-nums; color: var(--ink); flex: none; }
  .board > .mut { padding: .55rem 0; }

  /* --- Grand écran (hôte sur ordi / télé) : lisible de loin --- */
  @media (min-width: 900px) {
    body { padding: 20px 32px 28px; }
    #app { max-width: 1180px; padding: 18px 36px 28px; }
    .g-round { font-size: 1.75rem; }
    .g-pill { font-size: 1.3rem; }
    .g-main { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(320px, 1fr); gap: 0 44px; align-items: start; }
    .g-side { align-self: stretch; display: flex; flex-direction: column; border-left: 1px solid var(--line); padding-left: 40px; }
    .g-sec-board { order: -1; margin-top: 6px; }
    .g-h { font-size: 1.5rem; margin-bottom: 8px; }
    .deck { --disc: clamp(240px, 42vh, 420px); margin-top: 6px; }
    .timer-big { font-size: 4.5rem; margin: 20px 0 8px; }
    .board .row { padding: .8rem .8rem; font-size: 1.35rem; }
    .board .pts { font-size: 2rem; }
    .feed { max-height: 15rem; font-size: 1.12rem; }
    .lyrics-box { font-size: 1.9rem; }
    .buzz-banner { font-size: 2rem; padding: .9rem 1.25rem; }
    .reveal-card { padding: 1rem; gap: 1.25rem; }
    .reveal-card img { width: 104px; height: 104px; }
    .reveal-card .t { font-size: 2rem; }
    .reveal-card .a { font-size: 1.3rem; }
    .reveal-card .o { font-size: 1.05rem; }
    #hostZone, #playerZone { max-width: 560px; margin-left: auto; margin-right: auto; width: 100%; }
    #hostZone button { min-height: 62px; font-size: 1.25rem; }
    .note { font-size: 1.15rem; }
    .flash { border-width: 14px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .cover-wrap.spin, .buzz-banner, .reveal-card { animation: none; }
  }
</style>
</head>
<body>
<div id="app">

  <header class="g-top">
    <span class="g-round" id="roundInfo">Manche –</span>
    <div class="g-top-end">
      <span class="g-pill hidden" id="scorePill">0 pts</span>
      <button class="g-exit" id="btnExit" title="Quitter" aria-label="Quitter la partie"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </header>

  <div class="g-main">
    <section class="g-stage">
      <div class="deck">
        <div class="cover-wrap" id="coverWrap"><div class="vinyl-disc"></div><div class="cover-label" id="coverLabel"><img id="cover" alt="Pochette" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"><div class="cover-sectors" id="coverSectors"></div></div></div>
      </div>
      <div class="timer-big" id="timer">00:00.0</div>

      <div class="lyrics-box hidden" id="lyricsBox"></div>

      <div class="buzz-banner hidden" id="buzzBanner" role="status"></div>
      <div class="reveal-card hidden" id="revealCard">
        <img id="rvArt" alt="Pochette de la chanson" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
        <div>
          <div class="t" id="rvTitle"></div>
          <div class="a" id="rvArtist"></div>
          <div class="o" id="rvOwner"></div>
        </div>
      </div>

      <!-- ===== HÔTE ===== -->
      <div id="hostZone" class="hidden">
        <div class="btn-row">
          <button class="primary" id="btnPlay">▶️ Lancer l'extrait</button>
          <button id="btnReveal">👁️ Révéler</button>
          <button id="btnReplay" class="hidden">🔁 Recommencer</button>
        </div>
        <button id="btnNext" class="primary hidden">➡️ Chanson suivante</button>
        <p class="note" id="hostHint" aria-live="polite"></p>
      </div>

      <!-- ===== JOUEUR ===== -->
      <div id="playerZone" class="hidden">
        <button class="buzzer-btn" id="btnBuzz">BUZZ</button>

        <div id="answerZone" class="hidden">
          <div class="answer-row">
            <input type="text" id="answerInput" placeholder="Titre de la chanson…" autocomplete="off" spellcheck="false" enterkeyhint="send" aria-label="Titre de la chanson">
            <button class="primary" id="btnAnswer">OK</button>
          </div>
        </div>

        <div id="voteZone" class="hidden">
          <p class="note">À qui appartient cette chanson ?</p>
          <div class="vote-grid" id="voteGrid"></div>
        </div>

        <p class="note" id="playerStatus" aria-live="polite"></p>
      </div>
    </section>

    <aside class="g-side">
      <section class="g-sec g-sec-feed">
        <h2 class="g-h">Réponses</h2>
        <div class="feed" id="feed"><div class="mut">La partie commence…</div></div>
      </section>
      <section class="g-sec g-sec-board">
        <h2 class="g-h">Classement</h2>
        <div class="board" id="board"></div>
      </section>
    </aside>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/audio-engine.js"></script>
<script>
(function () {
  const roomCode = AppState.roomCode;
  const isHost   = AppState.isHost === true;
  const clientId = AppState.clientId;
  const myName   = AppState.playerName || 'Joueur';
  if (!roomCode || !clientId) { location.href = 'index.html'; return; }

  const roomRef = db.ref('rooms/' + roomCode);
  const gsRef   = roomRef.child('gameState');

  const $ = id => document.getElementById(id);
  const el = {
    roundInfo:$('roundInfo'), scorePill:$('scorePill'), btnExit:$('btnExit'),
    coverWrap:$('coverWrap'), cover:$('cover'), coverSectors:$('coverSectors'), timer:$('timer'), lyricsBox:$('lyricsBox'),
    buzzBanner:$('buzzBanner'), revealCard:$('revealCard'), rvArt:$('rvArt'), rvTitle:$('rvTitle'),
    rvArtist:$('rvArtist'), rvOwner:$('rvOwner'),
    hostZone:$('hostZone'), btnPlay:$('btnPlay'), btnReveal:$('btnReveal'), btnReplay:$('btnReplay'),
    btnNext:$('btnNext'), hostHint:$('hostHint'),
    playerZone:$('playerZone'), btnBuzz:$('btnBuzz'), answerZone:$('answerZone'), answerInput:$('answerInput'),
    btnAnswer:$('btnAnswer'), voteZone:$('voteZone'), voteGrid:$('voteGrid'), playerStatus:$('playerStatus'),
    feed:$('feed'), board:$('board')
  };

  const LYRICS_MS  = { slow:1400, medium:900, fast:550 };
  const BLANK = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200"><rect width="200" height="200" fill="#E7B03A"/><circle cx="100" cy="100" r="86" fill="none" stroke="#1E1A16" stroke-opacity=".22" stroke-width="1.5"/><circle cx="100" cy="100" r="24" fill="none" stroke="#1E1A16" stroke-opacity=".22" stroke-width="1.5"/><text x="100" y="62" font-family="Georgia,serif" font-size="17" font-weight="700" letter-spacing="2.5" text-anchor="middle" fill="#1E1A16">BLIND TEST</text><text x="100" y="152" font-family="Georgia,serif" font-size="14" font-style="italic" text-anchor="middle" fill="#1E1A16" fill-opacity=".7">face A</text></svg>');

  let gs = {}, players = {}, songs = [], song = null, idx = -1;
  let phase = 'idle', mode = 'classic';
  let timerInt = null, blurRaf = null, lyricsInt = null, playedIndex = -1;
  let lastFlashAt = 0, lastPhase = null, lastRoundStart = 0;
  let audioNote = '', gestureRetryArmed = false, revealing = false, answering = false, buzzPending = null;

  el.cover.src = BLANK;
  el.btnBuzz.classList.add('hidden');          // affiché seulement quand la manche est chargée et lancée
  (isHost ? el.hostZone : el.playerZone).classList.remove('hidden');
  if (!isHost) el.scorePill.classList.remove('hidden');

  /* ------------------------------------------------------------------ */
  /*  Écoute temps réel                                                  */
  /* ------------------------------------------------------------------ */
  roomRef.child('players').on('value', s => { players = s.val() || {}; render(); });

  gsRef.on('value', s => {
    gs = s.val() || {};
    if (gs.finished) { AudioEngine.stopAudio(); location.href = 'podium.html'; return; }

    songs = gs.songs || [];
    mode  = gs.mode || 'classic';
    const newIdx = gs.currentSongIndex || 0;
    if (newIdx !== idx) { idx = newIdx; songs = gs.songs || []; onNewSong(); }
    song  = songs[idx] || null;
    phase = gs.phase || 'idle';

    // L'hôte a relancé l'extrait (🔁) : les joueurs resynchronisent la pochette sur le nouveau départ
    const rs = gs.roundStartTime || 0;
    if (phase === 'playing' && lastPhase === 'playing' && rs && lastRoundStart && rs !== lastRoundStart && !isHost && mode !== 'lyrics') {
      if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
      startBlur();
    }
    lastRoundStart = rs;

    render();
  });

  function onNewSong() {
    stopAllTimers();
    AudioEngine.stopAudio();
    playedIndex = -1;
    audioNote = ''; revealing = false;
    el.answerInput.value = '';
    el.lyricsBox.innerHTML = '';
    el.lyricsBox.classList.add('hidden');
    el.revealCard.classList.add('hidden');
    // L'hôte prépare (télécharge + rend) l'extrait en avance : le son part sans attente
    if (isHost && songs[idx]) AudioEngine.preloadSong(songs[idx]);
    if (isHost && songs[idx + 1]) AudioEngine.preloadSong(songs[idx + 1]);
  }

  function stopAllTimers() {
    [timerInt, lyricsInt].forEach(t => t && clearInterval(t));
    timerInt = lyricsInt = null;
    if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
    el.coverWrap.classList.remove('spin');
  }

  /* ------------------------------------------------------------------ */
  /*  Rendu                                                              */
  /* ------------------------------------------------------------------ */
  function isMySong(s) {
    if (!s) return false;
    if (s.ownerIds) return s.ownerIds.includes(clientId);
    return s.ownerId === clientId;
  }

  function ownerNames(s) {
    if (!s) return '';
    if (s.ownerNames) return s.ownerNames.join(' & ');
    return s.ownerName || "l'hôte";
  }

  function render() {
    if (!songs.length) {
      el.roundInfo.textContent = 'Chargement…';
      el.btnBuzz.classList.add('hidden'); el.answerZone.classList.add('hidden'); el.voteZone.classList.add('hidden');
      return;
    }
    el.roundInfo.textContent = `Manche ${idx + 1} / ${songs.length}`;
    el.scorePill.textContent = ((gs.scores || {})[clientId] || 0) + ' pts';

    // Pochette
    const revealed = phase === 'revealed';
    if (revealed) {
      if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
      showSectors(false);
      el.cover.src = song && song.artwork ? song.artwork : BLANK;
    } else if (phase === 'idle') {
      showSectors(false);
      el.cover.src = BLANK;
    }

    // Phase changée ?
    if (phase !== lastPhase) { lastPhase = phase; onPhaseChange(); }

    renderTimer();
    renderBuzz();
    renderReveal();
    renderFeed();
    renderBoard();
    if (isHost) renderHost(); else renderPlayer();
  }

  function onPhaseChange() {
    stopAllTimers();
    if (phase === 'playing') {
      el.coverWrap.classList.add('spin');
      if (mode !== 'lyrics') startBlur();
      if (mode === 'lyrics') startLyrics();
      timerInt = setInterval(renderTimer, 100);
    } else {
      AudioEngine.stopAudio();
      if (phase === 'revealed' && mode === 'lyrics') showAllLyrics();
    }
  }

  function renderTimer() {
    if (phase === 'playing' && gs.roundStartTime) {
      el.timer.textContent = formatTimer(serverNow() - gs.roundStartTime);
    } else if (phase === 'idle') {
      el.timer.textContent = '00:00.0';
    }
  }

  /* --- Dévoilement de la pochette : des taches douces et irrégulières (sans bords nets) apparaissent
         un peu partout sur la pochette floutée et grossissent jusqu'à tout recouvrir. --- */
  // Vitesse : "normal" = ancien rythme + 5 % plus lent ; lent / rapide = ±12,5 % autour de normal
  const REVEAL_FACTOR = { slow: 1.125, normal: 1, fast: 0.875 };
  function revealDuration() {
    const base = (mode === 'lyrics' ? 16000 : 11000) * 1.05;
    return base * (REVEAL_FACTOR[gs.revealSpeed] || 1);
  }

  function showSectors(on) {
    el.coverSectors.classList.toggle('on', on);
    el.cover.style.visibility = on ? 'hidden' : 'visible';
    if (!on) el.coverSectors.innerHTML = '';
  }

  function seededRandom(seed) {       // même "hasard" sur tous les appareils pour une même manche
    let a = seed >>> 0;
    return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }

  function makeSpots(rnd, size) {
    const G = 6, cell = size / G, spots = [];
    for (let gy = 0; gy < G; gy++) for (let gx = 0; gx < G; gx++) {
      const x = (gx + 0.2 + rnd() * 0.6) * cell, y = (gy + 0.2 + rnd() * 0.6) * cell;
      const r = cell * (1.05 + rnd() * 0.45);
      const lobes = [];
      for (let k = 0; k < 3; k++) {      // 3 lobes décalés : la tache n'est pas un rond parfait
        const ang = rnd() * Math.PI * 2, dist = r * (0.1 + rnd() * 0.35);
        lobes.push({ dx: Math.cos(ang) * dist, dy: Math.sin(ang) * dist, k: 0.62 + rnd() * 0.38 });
      }
      spots.push({ x, y, r, lobes, start: rnd() * 0.7, dur: 0.24 + rnd() * 0.06 });   // les dernières taches finissent pile à la fin
    }
    return spots;
  }

  function startBlur() {
    if (!gs.blurEnabled || !song || !song.artwork) { showSectors(false); el.cover.src = BLANK; return; }
    const totalMs = revealDuration();
    const rnd = seededRandom(idx * 7919 + 13);
    const SIZE = 320;

    const img = new Image();
    img.onload = () => {
      if (phase !== 'playing') return;              // la manche a déjà changé entre-temps
      if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
      showSectors(true);

      const base = document.createElement('img');   // fond : pochette très floutée (fixe, donc léger)
      base.className = 'base'; base.alt = ''; base.src = song.artwork;
      const cv = document.createElement('canvas'); cv.width = cv.height = SIZE;
      el.coverSectors.appendChild(base); el.coverSectors.appendChild(cv);
      const ctx = cv.getContext('2d');
      const mask = document.createElement('canvas'); mask.width = mask.height = SIZE;
      const mctx = mask.getContext('2d');
      const spots = makeSpots(rnd, SIZE);

      // pochette nette, recadrée "cover" dans le carré
      const iw = img.naturalWidth || SIZE, ih = img.naturalHeight || SIZE, sc = Math.max(SIZE / iw, SIZE / ih);
      const dw = iw * sc, dh = ih * sc, dx = (SIZE - dw) / 2, dy = (SIZE - dh) / 2;

      const draw = (t) => {
        mctx.clearRect(0, 0, SIZE, SIZE);
        for (const s of spots) {
          const u = Math.max(0, Math.min(1, (t - s.start) / s.dur));
          if (u <= 0) continue;
          const e = u * u * (3 - 2 * u);                                       // croissance douce (smoothstep)
          for (const l of s.lobes) {
            const r = s.r * l.k * e, cx = s.x + l.dx, cy = s.y + l.dy;
            if (r < 0.5) continue;
            const g = mctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            g.addColorStop(0, 'rgba(0,0,0,1)');
            g.addColorStop(0.5, 'rgba(0,0,0,0.92)');
            g.addColorStop(1, 'rgba(0,0,0,0)');                               // bord très doux : aucune ligne visible
            mctx.fillStyle = g; mctx.beginPath(); mctx.arc(cx, cy, r, 0, Math.PI * 2); mctx.fill();
          }
        }
        if (t > 0.92) { mctx.fillStyle = `rgba(0,0,0,${Math.min(1, (t - 0.92) / 0.08).toFixed(3)})`; mctx.fillRect(0, 0, SIZE, SIZE); }
        ctx.globalCompositeOperation = 'source-over';
        ctx.clearRect(0, 0, SIZE, SIZE);
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.globalCompositeOperation = 'destination-in';
        ctx.drawImage(mask, 0, 0);
      };

      // synchronisé sur l'heure de départ de la manche (un joueur qui arrive en retard voit le bon état)
      const already = gs.roundStartTime ? Math.max(0, serverNow() - gs.roundStartTime) : 0;
      const t0 = performance.now() - already;
      const tick = (now) => {
        if (phase !== 'playing') { blurRaf = null; return; }
        const t = Math.min(1, (now - t0) / totalMs);
        draw(t);
        blurRaf = t < 1 ? requestAnimationFrame(tick) : null;
      };
      blurRaf = requestAnimationFrame(tick);
    };
    img.src = song.artwork;
  }

  /* --- Mode Paroles : révélation mot à mot --- */
  function startLyrics() {
    if (!song || !song.lyricsSnippet) return;
    el.lyricsBox.classList.remove('hidden');
    const words = song.lyricsSnippet.split(/\s+/).filter(Boolean);
    el.lyricsBox.innerHTML = words.map(w => {
      const shown = gs.lyricsSkipWords && w.length > 3
        ? w[0] + '•'.repeat(w.length - 2) + w[w.length - 1] : w;
      return `<span class="w">${escapeHTML(shown)}</span>`;
    }).join(' ');
    const spans = el.lyricsBox.querySelectorAll('.w');
    let i = 0;
    const tick = () => {
      if (i >= spans.length) { clearInterval(lyricsInt); lyricsInt = null; return; }
      spans[i].classList.add('on');
      if (isHost) AudioEngine.playBeep(380 + i * 12);
      i++;
    };
    tick();
    lyricsInt = setInterval(tick, LYRICS_MS[gs.lyricsSpeed] || 1400);
  }

  function showAllLyrics() {
    if (mode !== 'lyrics') return;
    el.lyricsBox.querySelectorAll('.w').forEach(s => s.classList.add('on'));
  }

  /* --- Bandeau de buzz --- */
  function renderBuzz() {
    const b = gs.buzzer;
    if (b && phase === 'playing') {
      el.buzzBanner.classList.remove('hidden');
      el.buzzBanner.textContent = `🔔 ${b.name} a buzzé !`;
      if (b.at && b.at > lastFlashAt) { lastFlashAt = b.at; flash(`🔔 ${b.name}`); }
    } else {
      el.buzzBanner.classList.add('hidden');
    }
  }

  function flash(text) {
    const d = document.createElement('div');
    d.className = 'flash';
    d.textContent = text;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1100);
  }

  function renderReveal() {
    if (phase !== 'revealed' || !song) { el.revealCard.classList.add('hidden'); return; }
    el.revealCard.classList.remove('hidden');
    el.rvArt.src = song.artwork || BLANK;
    el.rvTitle.textContent  = song.title || '';
    el.rvArtist.textContent = song.artist || '';
    el.rvOwner.textContent  = '🎧 Proposée par ' + ownerNames(song);
  }

  function renderFeed() {
    const items = Object.values(gs.feed || {}).sort((a, b) => a.at - b.at).slice(-8).reverse();
    if (!items.length) { el.feed.innerHTML = '<div class="mut">En attente…</div>'; return; }
    el.feed.innerHTML = items.map(f =>
      `<div class="${f.ok ? 'ok' : f.ok === false ? 'ko' : 'mut'}">${escapeHTML(f.text)}</div>`).join('');
  }

  function renderBoard() {
    const scores = gs.scores || {};
    const rows = Object.entries(players)
      .map(([id, p]) => ({ id, name: p.name, avatar: p.avatar || '🎧', pts: scores[id] || 0 }))
      .sort((a, b) => b.pts - a.pts);
    el.board.innerHTML = rows.map((r, i) =>
      `<div class="row ${r.id === clientId ? 'me' : ''}"><span>${i + 1}. ${r.avatar} ${escapeHTML(r.name)}</span><span class="pts">${r.pts}</span></div>`
    ).join('') || '<div class="mut">Aucun joueur</div>';
  }

  /* ------------------------------------------------------------------ */
  /*  Vue HÔTE                                                           */
  /* ------------------------------------------------------------------ */
  function renderHost() {
    el.btnPlay.classList.toggle('hidden', phase !== 'idle');
    el.btnReveal.classList.toggle('hidden', phase !== 'playing');
    el.btnReplay.classList.toggle('hidden', phase !== 'playing' || mode === 'lyrics');
    el.btnNext.classList.toggle('hidden', phase !== 'revealed');
    el.btnReveal.classList.toggle('armed', !!gs.solved);

    // L'extrait s'arrête dès qu'un joueur buzze
    if (phase === 'playing' && gs.buzzer && mode !== 'lyrics') {
      AudioEngine.stopAudio();
      playedIndex = -1;                     // l'extrait reprendra si la réponse est fausse
      audioNote = '';
    }

    let hint = '';
    if (phase === 'idle')      hint = "Appuie sur ▶️ quand tout le monde est prêt.";
    else if (phase === 'playing') hint = mode === 'playlist'
        ? `Votes : ${Object.keys(gs.votes || {}).length} / ${votersFor(song).length}`
        : (gs.solved ? '✅ Bonne réponse trouvée — tu peux révéler.' : 'Manche en cours…');
    else hint = idx + 1 >= songs.length ? 'Dernière chanson — passe au podium !' : '';
    if (phase === 'playing' && audioNote) hint += (hint ? ' ' : '') + audioNote;
    el.hostHint.textContent = hint;

    if (phase === 'revealed' && idx + 1 >= songs.length) el.btnNext.textContent = '🏆 Voir le podium';
    else el.btnNext.textContent = '➡️ Chanson suivante';

    // Lecture du son (hôte uniquement)
    const roundOver = gs.solved && !gs.multipleCorrectAllowed;
    if (phase === 'playing' && !gs.buzzer && !roundOver && playedIndex !== idx && mode !== 'lyrics') {
      playedIndex = idx;
      startClip();
    }
    if (phase !== 'playing') audioNote = '';
  }

  // Lance l'extrait (hôte). Si le navigateur refuse (pas encore de geste), on invite à toucher l'écran puis on relance.
  function startClip() {
    if (!song) return;
    const myIdx = idx;
    audioNote = '⏳ Chargement du son…';
    // Fin naturelle de l'extrait alors que la manche continue : on le dit à l'hôte
    const onEnd = () => {
      if (myIdx !== idx || phase !== 'playing') return;
      audioNote = '⏹ Extrait terminé — 🔁 pour réécouter ou 👁️ pour révéler.';
      renderHost();
    };
    AudioEngine.playAudioClip(song, onEnd).then(ok => {
      if (myIdx !== idx) return;
      if (ok) audioNote = '';
      else if (AudioEngine.lastError === 'blocked') { audioNote = '👆 Touche l\'écran pour activer le son.'; armGestureRetry(); }
      else audioNote = '⚠️ Audio indisponible pour cette chanson (🔁 pour réessayer).';
      if (phase === 'playing') renderHost();
    });
  }

  function armGestureRetry() {
    if (gestureRetryArmed) return;
    gestureRetryArmed = true;
    const evs = ['click', 'touchend', 'keydown'];
    const h = () => {
      evs.forEach(e => document.removeEventListener(e, h, true));
      gestureRetryArmed = false;
      if (phase === 'playing' && !gs.buzzer && mode !== 'lyrics') startClip();
    };
    evs.forEach(e => document.addEventListener(e, h, true));
  }

  el.btnPlay.onclick = async () => {
    if (!song) return;
    AudioEngine.unlockAudio();
    try {
      await gsRef.update({
        phase: 'playing', roundStartTime: serverNow(),
        buzzer: null, votes: null, solved: false, solvedBy: null, attempts: null, feed: null
      });
    } catch (e) { el.hostHint.textContent = '⚠️ Connexion perdue, réessaie.'; }
  };

  el.btnReveal.onclick = async () => {
    if (revealing) return;                  // évite le double clic (double attribution des points en Playlist)
    revealing = true;
    AudioEngine.stopAudio();
    try {
      if (mode === 'playlist') await scorePlaylistVotes();
      else await gsRef.update({ phase: 'revealed', buzzer: null });
    } catch (e) {
      revealing = false;
      el.hostHint.textContent = '⚠️ Connexion perdue, réessaie.';
    }
  };

  // Rejoue l'extrait depuis le début, sans toucher au buzzer ni aux scores
  el.btnReplay.onclick = async () => {
    if (!song) return;
    AudioEngine.stopAudio();
    playedIndex = idx;
    startClip();
    if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
    gs.roundStartTime = serverNow();
    lastRoundStart = gs.roundStartTime;
    if (mode !== 'lyrics') startBlur();
    try { await gsRef.update({ roundStartTime: gs.roundStartTime }); } catch (e) {}
  };

  el.btnNext.onclick = async () => {
    if (el.btnNext.dataset.busy) return;
    el.btnNext.dataset.busy = '1';
    try {
      if (idx + 1 >= songs.length) { await gsRef.update({ finished: true }); return; }
      await gsRef.update({
        currentSongIndex: idx + 1, phase: 'idle', buzzer: null,
        votes: null, solved: false, solvedBy: null, attempts: null, feed: null, roundStartTime: 0
      });
    } catch (e) {
      el.hostHint.textContent = '⚠️ Connexion perdue, réessaie.';
    } finally { delete el.btnNext.dataset.busy; }
  };

  // Attribution des points du mode Playlist + passage à "révélé" en UNE seule écriture (atomique)
  async function scorePlaylistVotes() {
    const fresh = (await gsRef.once('value')).val() || {};   // lecture fraîche : tous les votes
    if (fresh.phase !== 'playing') return;                    // déjà révélé : on ne compte jamais deux fois
    const votes = fresh.votes || {};
    const owners = song.ownerIds || (song.ownerId ? [song.ownerId] : []);
    const updates = {};
    const scores = Object.assign({}, fresh.scores || {});
    Object.entries(votes).forEach(([voter, v]) => {
      const good = owners.includes(v.guess);
      if (good) scores[voter] = (scores[voter] || 0) + points(v.at - (fresh.roundStartTime || v.at));
      pushFeed(`${good ? '✅' : '❌'} ${nameOf(voter)} → ${nameOf(v.guess)}`, good, updates);
    });
    updates['scores'] = scores;
    updates['phase'] = 'revealed';
    updates['buzzer'] = null;
    await gsRef.update(updates);
  }

  /* ------------------------------------------------------------------ */
  /*  Vue JOUEUR                                                         */
  /* ------------------------------------------------------------------ */
  function votersFor(s) {
    const owners = s ? (s.ownerIds || (s.ownerId ? [s.ownerId] : [])) : [];
    return Object.keys(players).filter(id => !owners.includes(id));
  }

  function renderPlayer() {
    const mine   = isMySong(song);
    const isVote = mode === 'playlist';
    const buzzer = gs.buzzer;
    const iHold  = buzzer && buzzer.id === clientId;
    const maxA   = gs.maxAttempts === undefined ? 3 : gs.maxAttempts;
    const used   = ((gs.attempts || {})[clientId]) || 0;
    const out    = maxA > 0 && used >= maxA;
    const solvedByMe = !!(gs.solvedBy || {})[clientId];

    el.btnBuzz.classList.toggle('hidden', isVote || phase !== 'playing' || !!iHold);   // quand c'est à moi de répondre : seulement le champ
    el.voteZone.classList.toggle('hidden', !isVote || phase !== 'playing' || mine);
    el.answerZone.classList.toggle('hidden', !iHold || phase !== 'playing');

    if (phase === 'idle') {
      el.playerStatus.textContent = mine ? "🤫 C'est ta chanson — laisse deviner !" : '⏳ En attente du lancement…';
      return;
    }
    if (phase === 'revealed') {
      el.playerStatus.textContent = '👀 Réponse révélée.';
      return;
    }

    // phase playing
    if (isVote) {
      if (mine) { el.playerStatus.textContent = "🤫 C'est ta chanson — tu ne votes pas."; return; }
      renderVoteGrid();
      const v = (gs.votes || {})[clientId];
      el.playerStatus.textContent = v ? `✅ Vote enregistré : ${nameOf(v.guess)}` : 'Choisis un joueur !';
      return;
    }

    let disabled = false, msg = '';
    if (mine)                    { disabled = true; msg = "🤫 C'est ta chanson — laisse deviner !"; }
    else if (solvedByMe)         { disabled = true; msg = '✅ Tu as déjà trouvé !'; }
    else if (out)                { disabled = true; msg = '🚫 Plus de tentatives pour cette manche.'; }
    else if (iHold)              { disabled = true; msg = '🎤 À toi ! Tape le titre (20 s max).'; }
    else if (buzzer)             { disabled = !!gs.lockOthersOnBuzz; msg = `🔔 ${buzzer.name} répond…`; }
    else if (gs.solved && !gs.multipleCorrectAllowed) { disabled = true; msg = '✅ Déjà trouvé par quelqu\'un.'; }
    else                         { msg = maxA > 0 ? `${maxA - used} tentative(s) restante(s)` : 'Buzze dès que tu sais !'; }

    el.btnBuzz.disabled = disabled;
    el.playerStatus.textContent = msg;
    if (iHold && document.activeElement !== el.answerInput) el.answerInput.focus();
  }

  function renderVoteGrid() {
    const v = (gs.votes || {})[clientId];
    el.voteGrid.innerHTML = Object.keys(players).map(id =>
      `<button data-id="${id}" class="${v && v.guess === id ? 'picked' : ''}" ${v ? 'disabled' : ''}>${players[id].avatar || '🎧'} ${escapeHTML(players[id].name)}</button>`
    ).join('');
    el.voteGrid.querySelectorAll('button').forEach(b => {
      b.onclick = () => gsRef.child('votes/' + clientId).set({ guess: b.dataset.id, at: serverNow() });
    });
  }

  /* --- Buzzer : transaction, premier arrivé premier servi --- */
  el.btnBuzz.onclick = () => {
    if (el.btnBuzz.disabled || phase !== 'playing' || !song) return;   // jamais de buzz avant le chargement de la manche
    el.btnBuzz.disabled = true;
    // Sur iPhone le clavier ne s'ouvre que dans le geste du doigt : on affiche et on cible le champ tout de suite.
    // Si quelqu'un d'autre a buzzé avant nous, render() remet tout en ordre.
    el.answerZone.classList.remove('hidden');
    el.btnBuzz.classList.add('hidden');
    try { el.answerInput.focus(); } catch (e) {}
    const tx = gsRef.child('buzzer')
      .transaction(cur => (cur === null ? { id: clientId, name: myName, at: serverNow() } : undefined));
    buzzPending = tx.then(r => r, () => null);
    tx.then(r => { if (!r.committed) render(); }, () => render())
      .then(() => { buzzPending = null; });
  };

  /* --- Réponse --- */
  el.answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') el.btnAnswer.click(); });
  el.btnAnswer.onclick = async () => {
    const raw = el.answerInput.value.trim();
    if (!raw || !song || answering) return;
    answering = true;
    try {
      // Réponse tapée très vite (ou réseau lent) : on attend que le buzz soit confirmé avant de la traiter
      if (buzzPending) await buzzPending;
      const good = matches(raw, song.title);
      const fresh = (await gsRef.once('value')).val() || {};   // lecture fraîche : scores à jour
      const elapsed = serverNow() - (fresh.roundStartTime || serverNow());
      const used = (((fresh.attempts || {})[clientId]) || 0) + 1;

      if (fresh.phase !== 'playing' || !fresh.buzzer || fresh.buzzer.id !== clientId) {
        el.playerStatus.textContent = '⏱️ Trop tard : ta réponse n\'a pas été prise en compte.';
        return;
      }
      el.answerInput.value = '';
      const updates = { buzzer: null };
      let delta;
      if (good) {
        let pts = points(elapsed);
        if (mode === 'instrumental') pts = Math.round(pts * 1.5);
        delta = pts;
        updates['solved'] = true;
        updates['solvedBy/' + clientId] = true;
        pushFeed(`✅ ${myName} : "${raw}" (+${pts})`, true, updates);
      } else {
        const penalty = used <= 1 ? 10 : 20;
        delta = -penalty;
        updates['attempts/' + clientId] = used;
        pushFeed(`❌ ${myName} : "${raw}" (−${penalty})`, false, updates);
      }
      await addScore(clientId, delta);
      await gsRef.update(updates);
    } catch (e) {
      el.playerStatus.textContent = '⚠️ Connexion perdue, réessaie.';
    } finally { answering = false; }
  };

  /* ------------------------------------------------------------------ */
  /*  Helpers                                                            */
  /* ------------------------------------------------------------------ */
  function addScore(id, d) {
    return gsRef.child('scores/' + id).transaction(v => Math.max(0, (v || 0) + d));
  }

  // L'hôte libère le buzzer si le joueur ne répond pas à temps (20 s)
  if (isHost) setInterval(async () => {
    const b = gs.buzzer;
    if (phase !== 'playing' || !b || !b.at) return;
    if (serverNow() - b.at < (gs.answerTimeLimit || 20) * 1000) return;
    const r = await gsRef.child('buzzer').transaction(c => (c && c.id === b.id && c.at === b.at) ? null : undefined);
    if (!r.committed) return;
    const u = {};
    u['attempts/' + b.id] = (((gs.attempts || {})[b.id]) || 0) + 1;
    pushFeed(`⏱️ ${b.name} n'a pas répondu à temps (−10)`, false, u);
    await addScore(b.id, -10);
    await gsRef.update(u);
  }, 1000);

  function points(elapsedMs) {
    const s = Math.max(0, elapsedMs) / 1000;
    let p;
    if (s <= 3) p = 100;
    else if (s <= 5) p = 100 - (s - 3) * 10;
    else p = 80 - (s - 5) * 5;
    return Math.max(20, Math.round(p));
  }

  function cleanTitle(t) {
    return normalize(String(t || '').replace(/\(.*?\)|\[.*?\]|(-|–)\s*(remaster|live|radio|single|version|feat).*$/gi, ''));
  }

  function matches(input, target) {
    const a = normalize(input), b = cleanTitle(target), full = normalize(target);
    if (!a) return false;
    if (a === b || a === full) return true;
    if (a.length >= 4 && (b.includes(a) || full.includes(a)) && a.length >= b.length * 0.6) return true;
    if (b.length >= 4 && a.includes(b)) return true;
    return false;
  }

  function nameOf(id) { return players[id] ? players[id].name : (id === 'host' ? "l'hôte" : '?'); }

  function pushFeed(text, ok, updates) {
    updates['feed/' + serverNow() + Math.floor(Math.random() * 999)] = { text, ok, at: serverNow() };
  }

  /* --- Sortie --- */
  el.btnExit.onclick = async () => {
    if (isHost) {
      if (!confirm('Terminer la partie et revenir au salon ?')) return;
      AudioEngine.stopAudio();
      try {
        // Remise à zéro complète (sélections, scores, manche) : la prochaine partie repart d'une page blanche
        await roomRef.update({
          status: 'lobby',
          selections: null,
          gameState: { currentSongIndex: 0, songs: [], scores: {}, buzzer: null, solved: false, phase: 'idle', finished: false, roundStartTime: 0 }
        });
      } catch (e) { alert('Connexion perdue : réessaie dans un instant.'); return; }
      location.href = 'host-lobby.html';
    } else {
      if (!confirm('Quitter la partie ?')) return;
      try { await roomRef.child('players/' + clientId).remove(); } catch (e) {}
      AppState.clear();
      location.href = 'index.html';
    }
  };

  // Si l'hôte ferme la partie, les joueurs reviennent au salon d'attente
  roomRef.child('status').on('value', s => {
    if (s.val() === 'lobby' && !isHost) location.href = 'waiting.html';
  });
})();
</script>
