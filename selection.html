<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Sélection · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .selection-header {
      background: linear-gradient(135deg, #2d3748 0%, #1e2530 100%);
      border-left: 6px solid #5e9eff;
      padding: 1.2rem 1.6rem;
      border-radius: 1.5rem;
      margin-bottom: 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-container { background: #1c2127; border-radius: 1.8rem; padding: 1.6rem; }
    .search-box { display: flex; gap: 0.6rem; align-items: center; }
    .search-box button { width: auto; flex: 0 0 auto; margin: 0; white-space: nowrap; padding: 0.85rem 1.1rem; }
    /* Saisie bien visible, texte centré, indication en gris foncé */
    .search-box input[type="text"] {
      flex: 1 1 auto;
      min-width: 0;
      width: auto;
      margin: 0;
      text-align: center;
      font-size: 16px; /* évite le zoom automatique de Safari iOS */
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
      background: #0f1a24 !important;
      caret-color: #ffffff;
    }
    .search-box input[type="text"]:focus { outline: none; border-color: #5e9eff; box-shadow: 0 0 0 3px rgba(94,158,255,.25); }
    .search-box input[type="text"]::placeholder {
      color: #5d6b79 !important;
      -webkit-text-fill-color: #5d6b79 !important;
      opacity: 1;
    }
    @media (max-width: 560px) {
      body { padding: 0.8rem; }
      #app { padding: 1.4rem 1rem; border-radius: 2rem; }
      #app h1 { font-size: 1.8rem; margin-bottom: 1.2rem; }
      .selection-header { padding: 0.9rem 1.1rem; margin-bottom: 1.2rem; }
      .search-container { padding: 1rem; border-radius: 1.4rem; }
    }
    .loud-hint { font-size: 0.82rem; margin-top: 0.4rem; padding: 0.5rem 0.7rem; border-radius: 0.7rem; display: none; }
    .loud-hint.show { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; }
    .loud-hint.ok   { background: #12321f; color: #7fe0a0; }
    .loud-hint.warn { background: #2e2510; color: #ffcf7f; }
    .loud-hint button { width: auto; margin: 0; padding: 0.35rem 0.8rem; font-size: 0.78rem; background: #3b6eff; }
    .results-grid { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.5rem; max-height: 400px; overflow-y: auto; }
    .song-card { display: flex; align-items: center; background: #1a1f25; padding: 1rem; border-radius: 1.2rem; border: 2px solid #2d353e; cursor: pointer; transition: 0.2s; }
    .song-card:hover:not(.selected) { border-color: #5e9eff; transform: translateX(5px); }
    .song-card img { width: 64px; height: 64px; border-radius: 12px; margin-right: 1.2rem; object-fit: cover; }
    .song-card.selected { border-color: #2f7740; background: #1a2420; opacity: 0.6; pointer-events: none; }
    .song-info { flex: 1; }
    .song-title { font-weight: 600; margin-bottom: 0.3rem; }
    .song-artist { color: #8aaec0; font-size: 0.9rem; }
    .counter { background: #3b6eff; padding: 0.5rem 1.2rem; border-radius: 60px; }
    .loading { color: #8aaec0; padding: 0.5rem 0; }
    .error-text { color: #ff6b6b; padding: 0.5rem 0; }

    /* Modale de personnalisation d'extrait */
    .modal-overlay { 
      position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #1a1f25; border-radius: 1.6rem 1.6rem 0 0; padding: 1.6rem; width: 100%; max-width: 480px; max-height: 88vh; overflow-y: auto;
    }
    .modal-song-info { display: flex; align-items: center; gap: 1rem; margin-bottom: 1.2rem; }
    .modal-song-info img { width: 56px; height: 56px; border-radius: 10px; object-fit: cover; }
    .modal-box label { display: block; margin-top: 1.1rem; margin-bottom: 0.4rem; font-size: 0.92rem; color: #cfe0ea; }
    .modal-box input[type="range"] { width: 100%; }
    .preset-buttons { display: flex; gap: 0.6rem; margin-bottom: 0.4rem; }
    .preset-buttons button { flex: 1; padding: 0.5rem; border-radius: 0.8rem; border: 2px solid #2d353e; background: #1a1f25; color: #fff; }
    .preset-buttons button.active { border-color: #5e9eff; background: #223047; }
    .checkbox-label { display: flex; align-items: center; gap: 0.6rem; margin-top: 1rem; font-size: 0.92rem; }
    .modal-actions { display: flex; flex-direction: column; gap: 0.7rem; margin-top: 1.5rem; }
    .modal-actions button { padding: 0.8rem; border-radius: 1rem; border: none; font-weight: 600; }
    /* Pied de modale fixe : dictaphone + boutons toujours visibles */
    .modal-foot { position: sticky; bottom: 0; margin: 1.2rem -1.6rem -1.6rem; padding: 0.8rem 1.6rem 1.2rem;
                  background: #1a1f25; border-top: 1px solid #2d353e; z-index: 5; }
    .modal-foot .modal-actions { flex-direction: row; margin-top: 0.7rem; gap: 0.5rem; }
    .modal-foot .modal-actions button { flex: 1; width: auto; margin: 0; padding: 0.7rem 0.3rem; font-size: 0.88rem; }
    .dicta { background: #11161c; border: 1px solid #2d353e; border-radius: 1rem; padding: 0.65rem 0.8rem 0.7rem; }
    .dicta-head { display: flex; justify-content: space-between; align-items: baseline; gap: 0.6rem; }
    .dicta-time { font-variant-numeric: tabular-nums; font-size: 1.35rem; font-weight: 300; letter-spacing: 0.02em; color: #fff; }
    .dicta-time small { color: #6f8294; font-size: 0.8rem; margin-left: 0.3rem; }
    .dicta-meta { font-size: 0.74rem; color: #8aaec0; text-align: right; line-height: 1.3; }
    .dicta canvas { display: block; width: 100%; }
    #dictaOverview { height: 26px; margin-top: 0.45rem; }
    #dictaWave { height: 64px; margin-top: 0.3rem; }
    .dicta-ruler { display: flex; justify-content: space-between; font-size: 0.68rem; color: #5d6b79; margin-top: 0.15rem; font-variant-numeric: tabular-nums; }
    .dicta-level { height: 4px; background: #1f2a35; border-radius: 4px; overflow: hidden; margin-top: 0.4rem; }
    .dicta-level i { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #4fd97f, #ffd75e 70%, #ff5a5f); border-radius: 4px; transition: width 0.06s linear; }
    .dicta-tags { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.45rem; min-height: 1.1rem; }
    .dicta-tags span { font-size: 0.68rem; color: #cfe0ea; background: #223047; border-radius: 60px; padding: 0.12rem 0.55rem; }
    .dicta-msg { font-size: 0.72rem; color: #ffcf7f; margin-top: 0.3rem; }

    #previewBtn { background: #2d353e; color: #fff; }
    #confirmSelectBtn { background: #3b6eff; color: #fff; }
    #cancelSelectBtn { background: transparent; color: #8aaec0; }
    .hint-text { font-size: 0.8rem; color: #8aaec0; margin-top: 0.3rem; }
    .lyrics-scroll-area { max-height: 45vh; overflow-y: auto; background: #101418; border: 1px solid #2d353e; border-radius: 1rem; padding: 1rem; margin: 0.6rem 0; }
    .lyrics-scroll-area.hidden { display: none; }
    .lyrics-line { padding: 0.35rem 0.5rem; border-radius: 0.5rem; cursor: pointer; color: #cfd8e3; line-height: 1.5; }
    .lyrics-line.selected { background: #223047; color: #fff; border-left: 3px solid #5e9eff; }
    .lyrics-line.invalid { background: #3a1f1f; border-left: 3px solid #ff6b6b; }
  </style>
</head>
<body>
  <div id="app">
    <h1>🎵 Sélection des chansons</h1>
    <div id="selection-header" class="selection-header">
      <span id="role-message"></span>
      <span id="counter" class="counter">0 / ?</span>
      <a id="settingsGear" href="config.html?edit=1" class="hidden" title="Modifier les réglages" style="font-size:1.3rem; text-decoration:none;">⚙️</a>
    </div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Artiste ou titre..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="searchBtn">🔍 Chercher</button>
      </div>
      <div id="errorMsg"></div>
      <div id="results" class="results-grid"></div>
    </div>
    <p style="text-align:center; margin-top:1rem;">
      <a href="#" id="backToLobbyLink" style="color:#8aaec0;">🏠 Retourner à la lobby</a>
    </p>
  </div>

  <!-- Modale d'extrait -->
  <div id="customizeModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-song-info">
        <img id="modalArtwork" src="" alt="cover">
        <div>
          <div id="modalTitle" class="song-title"></div>
          <div id="modalArtist" class="song-artist"></div>
        </div>
      </div>

      <!-- Option Volume visible -->
      <label>⏱️ Durée de l'extrait : <span id="durationValue">10</span>s</label>
      <input type="range" id="durationSlider" min="0.5" max="15" step="0.5" value="10">

      <label>📍 Position dans l'extrait</label>
      <div class="preset-buttons">
        <button type="button" id="presetStart">⏮️ Début</button>
        <button type="button" id="presetMiddle">⏺️ Milieu</button>
        <button type="button" id="presetEnd">⏭️ Fin</button>
      </div>
      <input type="range" id="positionSlider" min="0" max="30" step="0.5" value="0">
      <div class="hint-text" id="positionHint">Chargement...</div>

      <label>⚡ Vitesse : <span id="speedValue">1.0x</span></label>
      <input type="range" id="speedSlider" min="0.4" max="2.5" step="0.1" value="1">

      <label>🔊 Volume de cet extrait : <span id="volumeValue">100%</span></label>
      <input type="range" id="volumeSlider" min="70" max="150" step="5" value="100">
      <div id="loudHint" class="loud-hint">
        <span id="loudHintText"></span>
        <button type="button" id="loudHintApply">Ajuster</button>
      </div>

      <div id="complexControlsGroup">
        <label class="checkbox-label" style="margin-top: 1.2rem;">
          <input type="checkbox" id="instrumentalCheck"> 🎸 Sans voix
        </label>
        <div id="instrumentalVariants" class="preset-buttons hidden" style="margin-top:0.4rem; flex-wrap:wrap;">
          <button type="button" class="variant-btn" data-variant="1">🎚️ Stéréo</button>
          <button type="button" class="variant-btn" data-variant="2">🎼 Fréquences</button>
          <button type="button" class="variant-btn" data-variant="3">💪 Renforcé</button>
          <button type="button" class="variant-btn" data-variant="4">🔍 Vraie version instru</button>
        </div>
        <div class="hint-text" id="variantHint"></div>
        <div id="variantIntensityGroup" class="hidden" style="margin-top:0.4rem;">
          <label>🎛️ Précision d'atténuation : <span id="variantIntensityValue">40</span>%</label>
          <input type="range" id="variantIntensitySlider" min="10" max="100" step="5" value="40">
        </div>
        <div id="instrumentalSearchGroup" class="hidden" style="margin-top:0.6rem;">
          <button type="button" id="searchInstrumentalBtn" style="width:100%;">🔍 Chercher une version instrumentale</button>
          <div id="instrumentalResults" style="margin-top:0.5rem;"></div>
        </div>

        <label class="checkbox-label" style="margin-top:0.8rem;">
          <input type="checkbox" id="reverseCheck"> 🔄 Inverser l'extrait (à l'envers)
        </label>
        <label class="checkbox-label" style="margin-top:0.8rem;">
          <input type="checkbox" id="radioModeCheck"> 📻 Mode Radio / Téléphone
        </label>

        <!-- Expérimental (Pitch, Filtre Fréquence) -->
        <div id="advancedSettingsSection" class="hidden" style="margin-top:0.8rem; border-top:1px solid #2d353e; padding-top:0.6rem;">
          <button type="button" id="advancedToggleBtn" style="background:none; border:none; color:#8aaec0; display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
            <span id="advancedToggleArrow">🔽</span> Tonalité & Filtres (Expérimental)
          </button>
          <div id="advancedSettingsContent" class="hidden">
            <label>🎼 Pitch : <span id="pitchValue">0</span> demi-tons</label>
            <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0">

            <label>🎚️ Filtre fréquences</label>
            <input type="range" id="filterSlider" min="-100" max="100" step="5" value="0">
            <div class="hint-text" id="filterHint">Neutre</div>
          </div>
        </div>
      </div>

      <div id="modalError" class="error-text"></div>

      <div class="modal-foot">
        <div class="dicta" id="dicta">
          <div class="dicta-head">
            <div class="dicta-time"><span id="dictaTime">0:00.0</span><small id="dictaTotal">/ 0:10.0</small></div>
            <div class="dicta-meta" id="dictaMeta">Chargement du son…</div>
          </div>
          <canvas id="dictaOverview"></canvas>
          <canvas id="dictaWave"></canvas>
          <div class="dicta-ruler"><span>0:00</span><span id="dictaMid"></span><span id="dictaEnd"></span></div>
          <div class="dicta-level"><i id="dictaLevel"></i></div>
          <div class="dicta-tags" id="dictaTags"></div>
          <div class="dicta-msg" id="dictaMsg"></div>
        </div>
        <div class="modal-actions">
          <button type="button" id="previewBtn">▶️ Écouter</button>
          <button type="button" id="confirmSelectBtn">✅ Choisir</button>
          <button type="button" id="cancelSelectBtn">Annuler</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Modale Paroles (min 1 ligne, max 30 mots) -->
  <div id="lyricsModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-song-info">
        <img id="lyricsModalArtwork" src="" alt="cover">
        <div>
          <div id="lyricsModalTitle" class="song-title"></div>
          <div id="lyricsModalArtist" class="song-artist"></div>
        </div>
      </div>
      <p class="hint-text">
        Touchez 1 ligne (ou 2 lignes consécutives) pour sélectionner votre extrait (de 3 à 30 mots au total).
      </p>
      <div id="lyricsLoading" class="loading">🔎 Recherche des paroles...</div>
      <div id="lyricsScrollArea" class="lyrics-scroll-area hidden"></div>
      <div id="lyricsWordCountHint" class="hint-text"></div>
      <div class="modal-actions">
        <button type="button" id="confirmLyricsBtn" disabled>✅ Choisir cette chanson</button>
        <button type="button" id="retryKaraokeLyricsBtn" class="hidden">🔎 Réessayer</button>
        <button type="button" id="cancelLyricsBtn">Annuler</button>
      </div>
      <div id="lyricsModalError" class="error-text"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script src="js/audio-engine.js"></script>
  <script>
  (function() {
    const roomCode = AppState.roomCode;
    const isHost = AppState.isHost;
    const clientId = AppState.clientId;
    const playerName = AppState.playerName || 'Joueur';

    if (!roomCode) { window.location.href = 'index.html'; return; }

    const roomRef = db.ref('rooms/' + roomCode);
    const selectionsRef = roomRef.child('selections');
    const configRef = roomRef.child('config');
    roomRef.child('status').on('value', s => { if (s.val() === 'game') window.location.href = 'game.html'; });

    const backToLobbyLink = document.getElementById('backToLobbyLink');
    if (backToLobbyLink) {
      backToLobbyLink.addEventListener('click', async (e) => {
        e.preventDefault();
        if (isHost) {
          if (!confirm('Annuler la sélection ?')) return;
          await roomRef.update({ status: 'lobby', selections: {}, gameState: { songs: [], scores: {} } });
          window.location.href = 'host-lobby.html';
        } else {
          window.location.href = 'waiting.html';
        }
      });
    }

    let gameMode = 'classic';
    let advancedAllowed = false;
    let takenKeys = new Set();
    let hostQuota = 0;
    let hostSelected = [];
    let playerSelectedList = [];
    let classicModeOnly = false;
    let playerQuota = 1;
    let allowDuplicates = false;


    if (isHost) document.getElementById('settingsGear').classList.remove('hidden');

    const roleMsg = document.getElementById('role-message');
    const counterSpan = document.getElementById('counter');
    const searchInput = document.getElementById('searchInput');
    const searchBtn = document.getElementById('searchBtn');
    const errorMsg = document.getElementById('errorMsg');
    const resultsDiv = document.getElementById('results');

    // RECHERCHE DÉCLENCHÉE PAR LA TOUCHE ENTRÉE (ALLER A LA LIGNE)
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        searchBtn.click();
      }
    });

    function jsonp(url, param, ms) {
      return new Promise((res, rej) => {
        const cb = 'jp' + Math.random().toString(36).slice(2);
        const sc = document.createElement('script');
        let to;
        const clean = () => { clearTimeout(to); delete window[cb]; sc.remove(); };
        to = setTimeout(() => { clean(); rej(new Error('timeout')); }, ms || 8000);
        window[cb] = d => { clean(); res(d); };
        sc.onerror = () => { clean(); rej(new Error('jsonp')); };
        sc.src = url + (url.includes('?') ? '&' : '?') + (param || 'callback') + '=' + cb;
        document.head.appendChild(sc);
      });
    }

    // Plusieurs sources lancées EN MÊME TEMPS : la première qui renvoie des morceaux gagne.
    let lastSearchInfo = { responded: false, errors: [] };

    function searchOnce(term) {
      const q = encodeURIComponent(term);
      const itunesUrl = `https://itunes.apple.com/search?term=${q}&media=music&entity=song&limit=15`;
      const fromItunes = d => ((d && d.results) || []).map(s => ({
        trackName: s.trackName, artistName: s.artistName,
        artworkUrl100: (s.artworkUrl100 || '').replace('100x100', '300x300'),
        previewUrl: s.previewUrl
      })).filter(s => s.trackName && s.previewUrl);
      const fromDeezer = d => ((d && d.data) || []).map(s => ({
        trackName: s.title, artistName: s.artist && s.artist.name,
        artworkUrl100: s.album && (s.album.cover_big || s.album.cover_medium),
        previewUrl: s.preview
      })).filter(s => s.trackName && s.previewUrl);
      const getJson = (u, ms) => {
        const ac = new AbortController(); const to = setTimeout(() => ac.abort(), ms || 8000);
        return fetch(u, { signal: ac.signal })
          .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
          .then(t => JSON.parse(t.trim().replace(/^[\w$.]+\(/, '').replace(/\);?$/, '')))
          .finally(() => clearTimeout(to));
      };

      const sources = [
        ['iTunes direct',  () => getJson(itunesUrl).then(fromItunes)],
        ['iTunes JSONP',   () => jsonp(itunesUrl, 'callback').then(fromItunes)],
        ['Deezer JSONP',   () => jsonp(`https://api.deezer.com/search?q=${q}&output=jsonp`, 'callback').then(fromDeezer)],
        ['iTunes proxy 1', () => getJson('https://corsproxy.io/?url=' + encodeURIComponent(itunesUrl)).then(fromItunes)],
        ['iTunes proxy 2', () => getJson('https://api.allorigins.win/raw?url=' + encodeURIComponent(itunesUrl)).then(fromItunes)]
      ];
      return new Promise(resolve => {
        let pending = sources.length, done = false, responded = false;
        const errors = [];
        const end = () => { if (--pending === 0 && !done) { done = true; resolve({ ok: false, list: [], responded, errors }); } };
        sources.forEach(([name, f]) => {
          let p; try { p = f(); } catch (e) { p = Promise.reject(e); }
          p.then(list => {
            responded = true;
            if (done) return;
            if (list && list.length) { done = true; resolve({ ok: true, list, responded, errors }); }
            else end();
          }, err => { errors.push(name + ' : ' + (err && err.message || 'échec')); end(); });
        });
      });
    }

    async function searchMusic(term) {
      let r = await searchOnce(term);
      if (!r.ok && !r.responded) r = await searchOnce(term);   // 2e essai si aucune source n'a répondu
      lastSearchInfo = { responded: r.responded, errors: r.errors };
      return r.list;
    }

    let searchGen = 0;   // évite qu'une recherche lente n'écrase les résultats d'une recherche plus récente

    searchBtn.addEventListener('click', async () => {
      const term = searchInput.value.trim();
      if (!term) return;
      const myGen = ++searchGen;
      resultsDiv.innerHTML = '';                 // reset immédiat : jamais de mélange avec l'ancienne recherche
      searchBtn.disabled = true;
      errorMsg.innerHTML = '<div class="loading">🔎 Recherche...</div>';
      const results = await searchMusic(term);
      if (myGen !== searchGen) return;            // une recherche plus récente a déjà démarré, on ignore ce résultat
      searchBtn.disabled = false;
      errorMsg.innerHTML = '';
      displayResults(results);
    });

    function displayResults(results) { 
      resultsDiv.innerHTML = ''; 
      if (results.length === 0) {
        resultsDiv.innerHTML = lastSearchInfo.responded
          ? '<div class="text-center">Aucun morceau trouvé pour cette recherche. Essaie un autre mot.</div>'
          : '<div class="error-text">⚠️ Impossible de joindre les serveurs de musique. Vérifie ta connexion (ou désactive ton bloqueur de contenu) puis réessaie.<div class="hint-text" style="margin-top:.5rem">' + lastSearchInfo.errors.map(escapeHTML).join('<br>') + '</div></div>';
        return;
      }
      results.forEach(song => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.innerHTML = `<img src="${song.artworkUrl100}" alt="cover"><div class="song-info"><div class="song-title">${escapeHTML(song.trackName)}</div><div class="song-artist">${escapeHTML(song.artistName)}</div></div>`;
        const key = normalize(song.trackName + '|' + song.artistName);
        const mine = (isHost ? hostSelected : playerSelectedList).some(so => songKey(so) === key);
        if (!allowDuplicates && (takenKeys.has(key) || mine)) {
          card.classList.add('selected');
          card.querySelector('.song-artist').textContent += mine ? ' · déjà choisie par toi' : ' · déjà prise';
        }
        card.addEventListener('click', () => {
          if (gameMode === 'lyrics') openLyricsPickerModal(song, card);
          else openCustomizeModal(song, card);
        });
        resultsDiv.appendChild(card);
      });
    }

    // MODALE DE PERSONNALISATION
    const modal = document.getElementById('customizeModal');
    const durationSlider = document.getElementById('durationSlider');
    const durationValue = document.getElementById('durationValue');

    // Moyenne des volumes déjà confirmés dans la partie (hôte + joueurs), pour comparaison
    async function getReferenceLoudness() {
      try {
        const snap = await selectionsRef.once('value');
        const all = snap.val() || {};
        const vals = [];
        Object.values(all).forEach(sel => (sel && sel.songs ? sel.songs : []).forEach(s => {
          if (typeof s.loudnessRms === 'number' && s.loudnessRms > 0) {
            vals.push(s.loudnessRms * ((s.customVolume != null ? s.customVolume : 100) / 100));
          }
        }));
        return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
      } catch (e) { return null; }
    }

    // Mini-vérification rapide : ce son sera-t-il trop faible/fort par rapport aux autres déjà choisis ?
    async function checkLoudness(song) {
      loudHint.classList.remove('show', 'ok', 'warn');
      const [ref, rms] = await Promise.all([
        getReferenceLoudness(),
        AudioEngine.analyzeLoudness(song.previewUrl, 3, 8)
      ]);
      if (draftSong !== song) return; // la modale a changé entre-temps
      draftLoudnessRms = rms;
      if (rms == null || ref == null) return; // pas assez de données pour comparer, on ne dérange pas
      const ratio = rms / ref;
      if (ratio > 0.8 && ratio < 1.25) return; // déjà équilibré : rien à signaler
      const recommended = Math.round(Math.max(70, Math.min(150, 100 * ref / rms)) / 5) * 5;
      loudHintText.textContent = recommended > 100
        ? `🔊 Ce son est plus faible que les autres — monte à ${recommended}%`
        : `🔉 Ce son est plus fort que les autres — baisse à ${recommended}%`;
      loudHint.classList.add('show', 'warn');
      loudHintApply.onclick = () => {
        volumeSlider.value = recommended;
        volumeValue.textContent = recommended + '%';
        loudHint.classList.remove('show');
        scheduleDicta();
      };
    }

    /* ===================== DICTAPHONE ===================== */
    const dEl = {
      time: document.getElementById('dictaTime'), total: document.getElementById('dictaTotal'),
      meta: document.getElementById('dictaMeta'), over: document.getElementById('dictaOverview'),
      wave: document.getElementById('dictaWave'), level: document.getElementById('dictaLevel'),
      tags: document.getElementById('dictaTags'), msg: document.getElementById('dictaMsg'),
      mid: document.getElementById('dictaMid'), end: document.getElementById('dictaEnd')
    };
    const dState = { full: null, fullDur: 30, clip: null, settings: null, error: '', gen: 0, timer: null, raf: null, progress: 0 };

    const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return m + ':' + (t % 60).toFixed(1).padStart(4, '0'); };
    const fmtS = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60); return m + ':' + String(Math.floor(t % 60)).padStart(2, '0'); };

    function fitCanvas(cv) {
      const dpr = window.devicePixelRatio || 1, w = cv.clientWidth || 300, h = cv.clientHeight || 40;
      if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) { cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); }
      const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
      return { c, w, h };
    }

    function drawBars(c, w, h, peaks, color, opts) {
      const n = peaks.length, slot = w / n, bw = Math.max(1.5, slot * 0.58);
      for (let i = 0; i < n; i++) {
        const x = i * slot + (slot - bw) / 2;
        const amp = Math.max(0.04, Math.min(1, peaks[i] * (opts.gain || 1)));
        const bh = Math.max(2, amp * h * 0.92);
        c.fillStyle = typeof color === 'function' ? color(i / n) : color;
        c.beginPath();
        if (c.roundRect) c.roundRect(x, (h - bh) / 2, bw, bh, bw / 2); else c.rect(x, (h - bh) / 2, bw, bh);
        c.fill();
      }
    }

    function drawDicta() {
      const st = dState;
      // --- vue d'ensemble : tout le morceau, fenêtre de l'extrait en surbrillance ---
      {
        const { c, w, h } = fitCanvas(dEl.over);
        c.clearRect(0, 0, w, h);
        if (st.full && st.settings) {
          const s = st.settings, dur = st.fullDur || 30;
          const x0 = Math.max(0, Math.min(1, s.clipStart / dur)) * w;
          const x1 = Math.max(0, Math.min(1, (s.clipStart + s.clipDuration) / dur)) * w;
          drawBars(c, w, h, st.full, i => { const x = i * w; return (x >= x0 && x <= x1) ? '#5e9eff' : '#34424f'; }, { gain: 1.35 });
          c.strokeStyle = 'rgba(94,158,255,.9)'; c.lineWidth = 1.5;
          c.strokeRect(x0 + 0.5, 1, Math.max(3, x1 - x0) - 1, h - 2);
        } else {
          drawBars(c, w, h, new Float32Array(60).fill(0.12), '#2a3541', {});
        }
      }
      // --- rendu de l'extrait AVEC les réglages (volume, vitesse, pitch, filtres, inversion…) ---
      {
        const { c, w, h } = fitCanvas(dEl.wave);
        c.clearRect(0, 0, w, h);
        c.strokeStyle = '#1f2a35'; c.lineWidth = 1;
        c.beginPath(); c.moveTo(0, h / 2 + 0.5); c.lineTo(w, h / 2 + 0.5); c.stroke();
        const p = st.progress || 0;
        if (st.clip) {
          drawBars(c, w, h, st.clip.peaks, f => (f <= p && p > 0) ? '#ff5a5f' : '#d7e4ee', { gain: 1.3 });
        } else {
          drawBars(c, w, h, new Float32Array(80).fill(0.1), '#2a3541', {});
        }
        if (p > 0) {   // tête de lecture
          const x = Math.round(p * w);
          c.fillStyle = '#ff5a5f'; c.fillRect(x - 1, 0, 2, h);
          c.beginPath(); c.arc(x, 3, 3.5, 0, Math.PI * 2); c.fill();
        }
      }
    }

    function dictaLabels() {
      const st = dState, s = st.settings || readSettings();
      const total = st.clip ? st.clip.duration : (s.clipDuration / (s.speed || 1));
      dEl.total.textContent = '/ ' + fmt(total);
      dEl.end.textContent = fmtS(total);
      dEl.mid.textContent = fmtS(total / 2);
      dEl.meta.innerHTML = `${total.toFixed(1)} s · ×${(s.speed || 1).toFixed(1)} · ${s.pitch > 0 ? '+' : ''}${s.pitch || 0} ½t · ${s.customVolume}%`;
      const tags = [];
      if (s.instrumental) tags.push('Sans voix');
      if (s.reverse) tags.push('Inversé');
      if (s.radioMode) tags.push('Radio');
      if (Math.abs(s.filterValue || 0) > 15) tags.push(s.filterValue > 0 ? 'Coupe-bas' : 'Coupe-haut');
      if (s.speed && s.speed !== 1) tags.push(s.speed > 1 ? 'Accéléré' : 'Ralenti');
      if (s.pitch) tags.push(s.pitch > 0 ? 'Plus aigu' : 'Plus grave');
      dEl.tags.innerHTML = tags.map(t => `<span>${t}</span>`).join('');
      dEl.msg.textContent = st.error;
    }

    async function refreshDicta() {
      const my = ++dState.gen;
      if (!draftSong) return;
      const settings = readSettings();
      dState.settings = settings;
      dictaLabels(); drawDicta();
      try {
        const buf = await AudioEngine.loadBuffer(settings.previewUrl);
        if (my !== dState.gen) return;
        dState.fullDur = buf.duration;
        dState.full = AudioEngine.getPeaks(buf, 110).peaks;
        const r = await AudioEngine.renderClipPreview(settings, 150);
        if (my !== dState.gen) return;
        dState.clip = r; dState.error = '';
      } catch (e) {
        if (my !== dState.gen) return;
        dState.clip = null; dState.full = null;
        dState.error = '⚠️ Forme d\'onde indisponible (réseau) — le son peut quand même se lancer.';
      }
      dictaLabels(); drawDicta();
    }

    function scheduleDicta() {
      clearTimeout(dState.timer);
      dState.timer = setTimeout(refreshDicta, 160);
    }

    function dictaLoop() {
      const ps = AudioEngine.getPlayState();
      if (ps.playing && ps.total > 0) {
        dState.progress = Math.min(1, ps.elapsed / ps.total);
        dEl.time.textContent = fmt(ps.elapsed);
        dEl.level.style.width = Math.round(ps.level * 100) + '%';
        drawDicta();
        dState.raf = requestAnimationFrame(dictaLoop);
      } else {
        dState.raf = null; dState.progress = 0; dEl.level.style.width = '0%'; dEl.time.textContent = fmt(0);
        previewBtn.textContent = '▶️ Écouter';
        drawDicta();
      }
    }

    function resetDicta() {
      dState.gen++; dState.full = null; dState.clip = null; dState.error = ''; dState.progress = 0; dState.settings = null;
      dEl.time.textContent = fmt(0); dEl.level.style.width = '0%';
      dEl.meta.textContent = 'Chargement du son…';
    }

    // Toute modification de réglage met à jour le dictaphone
    modal.addEventListener('input', scheduleDicta);
    modal.addEventListener('change', scheduleDicta);
    modal.addEventListener('click', e => {
      if (e.target.closest('.variant-btn, #presetStart, #presetMiddle, #presetEnd, #instrumentalResults button')) setTimeout(scheduleDicta, 0);
    });
    window.addEventListener('resize', () => { if (!modal.classList.contains('hidden')) drawDicta(); });

    // Bouton écouter / arrêter : mêmes réglages et même moteur qu'en jeu
    const previewBtn = document.getElementById('previewBtn');
    previewBtn.onclick = async () => {
      if (AudioEngine.getPlayState().playing) { stopAudio(); return; }
      previewBtn.textContent = '⏳';

      document.getElementById('modalError').textContent = '';
      if (AudioEngine.getPlayState().mode === 'element') dState.error = 'ℹ️ Lecture simplifiée : les effets audio ne sont pas disponibles pour ce morceau.';
      dictaLabels();
      previewBtn.textContent = '⏹ Stop';
      if (!dState.raf) dState.raf = requestAnimationFrame(dictaLoop);
    };

    document.getElementById('confirmSelectBtn').onclick = async () => {
      stopAudio();
      const isInstrumentalOn = instrumentalCheck.checked;
      const songData = {
        title: draftSong.trackName,

        clipStart: parseFloat(positionSlider.value) || 0,
        clipDuration: parseFloat(durationSlider.value) || 10,

        speed: parseFloat(speedSlider.value),

    function songKey(so) {
      return normalize((so.title || '') + '|' + (so.artist || ''));
    }

    function toast(text) {
      const t = document.createElement('div');
      t.textContent = text;
      t.style.cssText = 'position:fixed;left:50%;bottom:2rem;transform:translateX(-50%);background:#2f7740;' +
        'color:#fff;padding:.9rem 1.6rem;border-radius:60px;font-weight:700;z-index:3000;box-shadow:0 8px 24px rgba(0,0,0,.6)';

    async function saveSongPick(songData, card) {
      if (!allowDuplicates && takenKeys.has(songKey(songData))) {
        alert('Cette chanson a déjà été choisie par quelqu\'un d\'autre. Prends-en une autre !');
        return;
      }
      const mine = isHost ? hostSelected : playerSelectedList;
      if (mine.some(so => songKey(so) === songKey(songData))) {
        alert('Tu as déjà choisi cette chanson.');
        return;
      }
      if (isHost) {
        hostSelected.push(songData);
        await selectionsRef.child('host').set({ songs: hostSelected, done: hostSelected.length >= hostQuota });
        counterSpan.textContent = `${hostSelected.length} / ${hostQuota}`;
        toast(`✅ ${songData.title} ajoutée !`);
        if (hostSelected.length >= hostQuota) { window.location.href = 'waiting.html'; return; }
      } else {
        songData.ownerId = clientId;
        songData.ownerName = playerName;
        playerSelectedList.push(songData);
        await selectionsRef.child(clientId).set({ songs: playerSelectedList, done: playerSelectedList.length >= playerQuota });
        counterSpan.textContent = `${playerSelectedList.length} / ${playerQuota}`;
        toast(`✅ ${songData.title} ajoutée !`);
        if (playerSelectedList.length >= playerQuota) { window.location.href = 'waiting.html'; return; }
      }
      // Repart d'une recherche vierge : plus aucun résidu de la sélection précédente
      searchGen++;
      searchInput.value = '';
      resultsDiv.innerHTML = '';
      errorMsg.innerHTML = '';
      searchInput.focus();

    // PAROLES (min 1 ligne, max 30 mots)
    const lyricsModal = document.getElementById('lyricsModal');
    const lyricsScrollArea = document.getElementById('lyricsScrollArea');
    const lyricsWordCountHint = document.getElementById('lyricsWordCountHint');
    const confirmLyricsBtn = document.getElementById('confirmLyricsBtn');
    let lyricsLines = [];
    let lyricsStartIndex = -1;

    function openLyricsPickerModal(song, card) {
      draftSong = song;
      draftCard = card;
      document.getElementById('lyricsModalArtwork').src = song.artworkUrl100;
      document.getElementById('lyricsModalTitle').textContent = song.trackName;

    async function fetchLyrics(song) {
      lyricsScrollArea.classList.add('hidden');
      const ld = document.getElementById('lyricsLoading');
      const rb = document.getElementById('retryKaraokeLyricsBtn');
      ld.classList.remove('hidden'); ld.textContent = '🔎 Recherche des paroles...';
      rb.classList.add('hidden');
      confirmLyricsBtn.disabled = true;
      const a = encodeURIComponent(song.artistName), t = encodeURIComponent(song.trackName);
      const getJson = async u => {
        const ac = new AbortController(); const to = setTimeout(() => ac.abort(), 7000);
        try { const r = await fetch(u, { signal: ac.signal }); if (!r.ok) throw new Error('http'); return await r.json(); }
        finally { clearTimeout(to); }
      };
      const ovh = `https://api.lyrics.ovh/v1/${a}/${t}`;
      const sources = [
        async () => ((await getJson(`https://lrclib.net/api/search?track_name=${t}&artist_name=${a}`)) || []).map(i => i.plainLyrics).find(Boolean),
        async () => (await getJson(ovh)).lyrics,
        async () => (await getJson('https://corsproxy.io/?url=' + encodeURIComponent(ovh))).lyrics
      ];
      let text = null;
      for (const src of sources) { try { text = await src(); if (text) break; } catch (e) {} }
      if (!text) { ld.textContent = '⚠️ Paroles introuvables.'; rb.classList.remove('hidden'); return; }
      lyricsLines = text.split('\n').map(l => l.trim()).filter(Boolean);
      renderLyrics();
    }
    document.getElementById('retryKaraokeLyricsBtn').onclick = () => fetchLyrics(draftSong);

    function renderLyrics() {
      document.getElementById('lyricsLoading').classList.add('hidden');
      lyricsScrollArea.classList.remove('hidden');
      lyricsScrollArea.innerHTML = '';
      lyricsStartIndex = -1;

      lyricsLines.forEach((line, idx) => {
        const div = document.createElement('div');
        div.className = 'lyrics-line';
        div.textContent = line;
        div.onclick = () => {
          const lines = lyricsScrollArea.querySelectorAll('.lyrics-line');
          if (lyricsStartIndex === -1 || idx === lyricsStartIndex) {
            lines.forEach(l => l.classList.remove('selected', 'invalid'));
            if (lyricsStartIndex === idx) { lyricsStartIndex = -1; confirmLyricsBtn.disabled = true; return; }
            lyricsStartIndex = idx;
            div.classList.add('selected');
            const words = line.split(/\s+/).filter(Boolean).length;
            validateLyrics(words);
          } else if (idx === lyricsStartIndex + 1) {
            div.classList.add('selected');
            const combined = lyricsLines[lyricsStartIndex] + " " + line;
            const words = combined.split(/\s+/).filter(Boolean).length;
            validateLyrics(words);
          } else {
            lines.forEach(l => l.classList.remove('selected', 'invalid'));
            lyricsStartIndex = idx;
            div.classList.add('selected');
            const words = line.split(/\s+/).filter(Boolean).length;
            validateLyrics(words);
          }
        };
        lyricsScrollArea.appendChild(div);
      });
    }

    function validateLyrics(words) {
      if (words >= 3 && words <= 30) {
        lyricsWordCountHint.innerHTML = `<span style="color:#4fd97f;">✅ ${words} mots sélectionnés.</span>`;
        confirmLyricsBtn.disabled = false;
      } else {
        lyricsWordCountHint.innerHTML = `<span style="color:#ff6b6b;">⚠️ ${words} mots. Doit être entre 3 et 30 mots.</span>`;
        confirmLyricsBtn.disabled = true;
      }
    }

    confirmLyricsBtn.onclick = async () => {
      const l1 = lyricsLines[lyricsStartIndex] || '';
      const l2 = lyricsLines[lyricsStartIndex + 1] || '';
      const snippet = lyricsStartIndex !== -1 ? (l1 + (l2 ? '\n' + l2 : '')) : '';

      const songData = {
        title: draftSong.trackName,
        artist: draftSong.artistName,
        artwork: draftSong.artworkUrl100,
        lyricsSnippet: snippet
      };
      lyricsModal.classList.add('hidden');
      await saveSongPick(songData, draftCard);
    };

    document.getElementById('cancelLyricsBtn').onclick = () => lyricsModal.classList.add('hidden');

    function escapeHTML(str) { 
      return String(str).replace(/[&<>]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[c] || c));
    }

    // === Démarrage : lecture de la config une fois tout le DOM câblé ===
    configRef.once('value', (snap) => {
      const config = snap.val();
      if (config) {
        gameMode = config.mode || 'classic';
        classicModeOnly = !!config.classicModeOnly;
        allowDuplicates = !!config.allowDuplicates;
        playerQuota = gameMode === 'playlist' ? (config.playlistSongsPerPlayer || 5) : (config.songsPerPlayer !== undefined ? config.songsPerPlayer : 1);

        advancedAllowed = !!config.advancedSettings && !classicModeOnly;
        if (classicModeOnly) {
          document.getElementById('complexControlsGroup').style.display = 'none';
        } else {
          document.getElementById('advancedSettingsSection').classList.toggle('hidden', !advancedAllowed);
        }
        if (gameMode === 'instrumental') {
          instrumentalCheck.checked = true;
          instrumentalCheck.dispatchEvent(new Event('change'));
        }
        // Doublons : on mémorise ce qui est déjà pris par les autres
        if (!allowDuplicates) {
          selectionsRef.on('value', (allSnap) => {
            const all = allSnap.val() || {};
            takenKeys = new Set();
            Object.entries(all).forEach(([key, sel]) => {
              if (key === (isHost ? 'host' : clientId)) return;
              (sel && sel.songs ? sel.songs : []).forEach(so => takenKeys.add(songKey(so)));
            });
          });
        }

        if (isHost) {
          if (gameMode === 'playlist') {
            roleMsg.textContent = 'Mode Playlist : en attente des joueurs...';
            selectionsRef.child('host').set({ songs: [], done: true }).then(() => {
              window.location.href = 'waiting.html';
            });
            return;
          }
          hostQuota = config.hostSongsCount || 0;
          if (hostQuota === 0) {
            selectionsRef.child('host').set({ songs: [], done: true }).then(() => {
              window.location.href = 'waiting.html';
            });
            return;
          }
          roleMsg.textContent = `Choisis ${hostQuota} chanson(s) pour compléter la partie`;
          selectionsRef.child('host').once('value', (selSnap) => {
            const existing = selSnap.val();
            if (existing && Array.isArray(existing.songs)) hostSelected = existing.songs;
            counterSpan.textContent = `${hostSelected.length} / ${hostQuota}`;
            if (hostSelected.length >= hostQuota && hostQuota > 0) window.location.href = 'waiting.html';
          });
        } else {
          if (playerQuota === 0) {
            selectionsRef.child(clientId).set({ songs: [], done: true }).then(() => {
              window.location.href = 'waiting.html';
            });
            return;
          }
          roleMsg.textContent = `Choisis ${playerQuota} chanson(s) pour la partie`;
          selectionsRef.child(clientId).once('value', (selSnap) => {
            const existing = selSnap.val();
            if (existing && Array.isArray(existing.songs)) playerSelectedList = existing.songs;
            counterSpan.textContent = `${playerSelectedList.length} / ${playerQuota}`;
            if (playerSelectedList.length >= playerQuota) window.location.href = 'waiting.html';
          });
        }
      }
    });
  })();
  </script>
</body>
</html>
