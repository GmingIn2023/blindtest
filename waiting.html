<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En attente · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .waiting-room { background: #1e2a36; border-radius: 2rem; padding: 2rem; text-align: center; }
    .progress-list { margin-top: 1.5rem; text-align: left; background: #0f1419; border-radius: 1.5rem; padding: 1.5rem; }
    .progress-item { display: flex; align-items: center; justify-content: space-between; padding: 0.8rem 0; border-bottom: 1px solid #2a323a; }
    .progress-item:last-child { border-bottom: none; }
    .ready-badge { background: #2f7740; color: white; padding: 0.2rem 0.8rem; border-radius: 60px; font-size: 0.9rem; }
    .not-ready-badge { background: #77402f; color: white; padding: 0.2rem 0.8rem; border-radius: 60px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="app">
    <h1>⏳ En attente des autres joueurs</h1>
    <div class="waiting-room">
      <div id="waitingMessage" style="margin-bottom:1rem;">Certains joueurs finalisent leurs sélections...</div>
      <div id="waitingProgress" class="progress-list"></div>
      <div style="margin-top:2rem;">
        <button id="refreshBtn" class="primary">🔄 Actualiser</button>
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script>
    (function() {
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost;

      if (!roomCode) { window.location.href = 'index.html'; return; }

      const roomRef = db.ref('rooms/' + roomCode);
      const selectionsRef = roomRef.child('selections');
      const playersRef = roomRef.child('players');

      const waitingProgress = document.getElementById('waitingProgress');
      const waitingMessage = document.getElementById('waitingMessage');
      let alreadyMerged = false;
      let redirecting = false;

      function dedupeSongs(allSongs) {
        const byKey = new Map();
        const result = [];
        allSongs.forEach((song) => {
          const key = (song.title + '|' + song.artist).toLowerCase().replace(/[^a-z0-9|]/g, '');
          if (byKey.has(key)) {
            const existing = byKey.get(key);
            const existingIds = existing.ownerIds || (existing.ownerId ? [existing.ownerId] : []);
            const existingNames = existing.ownerNames || (existing.ownerName ? [existing.ownerName] : []);
            if (song.ownerId && !existingIds.includes(song.ownerId)) {
              existing.ownerIds = existingIds.concat([song.ownerId]);
              existing.ownerNames = existingNames.concat([song.ownerName]);
              delete existing.ownerId; delete existing.ownerName;
            }
          } else {
            byKey.set(key, song); result.push(song);
          }
        });
        return result;
      }

      async function mergeSelectionsIntoGameState(selections, playerList) {
        if (alreadyMerged || !isHost) return;
        alreadyMerged = true;

        const configSnap = await roomRef.child('config').once('value');
        const config = configSnap.val() || {};

        let allSongs = [];
        if (selections.host && Array.isArray(selections.host.songs)) {
          allSongs = allSongs.concat(selections.host.songs);
        }
        playerList.forEach(p => {
          const sel = selections[p.id];
          if (sel && Array.isArray(sel.songs)) allSongs = allSongs.concat(sel.songs);
        });

        if (config.allowDuplicates) allSongs = dedupeSongs(allSongs);

        // Fisher-Yates Shuffle
        for (let i = allSongs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [allSongs[i], allSongs[j]] = [allSongs[j], allSongs[i]];
        }

        const scores = {};
        playerList.forEach(p => { scores[p.id] = 0; });

        await roomRef.child('gameState').update({
          songs: allSongs,
          currentSongIndex: 0,
          scores: scores,
          playerAttempts: {},
          buzzer: null,
          buzzerLocked: false,
          reopenAt: 0,
          roundActive: false,
          roundStartTime: 0,
          mode: config.mode || 'classic',
          maxAttempts: config.maxAttempts !== undefined ? config.maxAttempts : 3,
          blurEnabled: !!config.blurEnabled,
          lockOthersOnBuzz: config.lockOthersOnBuzz !== undefined ? config.lockOthersOnBuzz : true,
          multipleCorrectAllowed: !!config.multipleCorrectAllowed,
          lyricsSpeed: config.lyricsSpeed || 'slow',
          lyricsSkipWords: !!config.lyricsSkipWords
        });
      }

      async function waitForSongsThenRedirect() {
        if (redirecting) return;
        redirecting = true;
        waitingMessage.innerHTML = '✅ Partie prête ! Chargement...';
        for (let i = 0; i < 10; i++) {
          const snap = await roomRef.child('gameState/songs').once('value');
          if (Array.isArray(snap.val()) && snap.val().length > 0) {
            window.location.href = 'game.html'; return;
          }
          await new Promise(r => setTimeout(r, 400));
        }
        window.location.href = 'game.html';
      }

      function updateProgress() {
        playersRef.once('value').then(playersSnap => {
          const players = playersSnap.val() || {};
          const playerList = Object.entries(players).map(([id, data]) => ({ id, ...data }));

          selectionsRef.once('value').then(async selectionsSnap => {
            const selections = selectionsSnap.val() || {};
            const configSnap = await roomRef.child('config').once('value');
            const config = configSnap.val() || {};
            const songsPerPlayer = config.songsPerPlayer !== undefined ? config.songsPerPlayer : 1;

            const hostDone = selections.host && selections.host.done === true;
            let allReady = hostDone;
            let html = '';

            html += `<div class="progress-item"><span>🎤 Hôte</span><span class="${hostDone ? 'ready-badge' : 'not-ready-badge'}">${hostDone ? '✅ Prêt' : '⏳ En cours...'}</span></div>`;

            playerList.forEach(player => {
              // Si le quota pour le joueur est réglé à 0, il est immédiatement considéré prêt
              const playerDone = songsPerPlayer === 0 || (selections[player.id] && selections[player.id].done === true);
              if (!playerDone) allReady = false;

              html += `<div class="progress-item"><span>${player.avatar} ${player.name}</span><span class="${playerDone ? 'ready-badge' : 'not-ready-badge'}">${playerDone ? '✅ Prêt' : '⏳ En cours...'}</span></div>`;
            });

            waitingProgress.innerHTML = html;

            if (allReady) {
              await mergeSelectionsIntoGameState(selections, playerList);
              waitForSongsThenRedirect();
            }
          });
        });
      }

      roomRef.child('status').once('value', (statusSnap) => {
        if (statusSnap.val() === 'lobby') {
          waitingMessage.innerHTML = '⏳ En attente que l\'hôte relance...';
          waitingProgress.innerHTML = '';
          roomRef.child('status').on('value', snap => {
            if (snap.val() === 'selection') window.location.href = 'selection.html';
          });
          return;
        }
        updateProgress();
        setInterval(updateProgress, 2500);
      });

      document.getElementById('refreshBtn').onclick = updateProgress;
    })();
  </script>
</body>
</html>
