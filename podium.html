<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F3ECE0">
  <title>Podium · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    #app { max-width: 520px; }

    .winner-banner { text-align: center; margin-bottom: 0.5rem; animation: rise-in .4s var(--ease) both; }
    .winner-banner .vinyl { width: 112px; height: 112px; margin: 0 auto 0.9rem; }
    .winner-banner .vinyl .v-label { animation: vinyl-spin 2.4s var(--ease) .3s 1 both; }
    .winner-banner h1 { font-size: clamp(1.75rem, 8vw, 2.25rem); margin: 0 0 0.25rem; overflow-wrap: anywhere; }
    .winner-banner p { color: var(--ink-2); margin: 0; }

    .podium-stage {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.75rem 0 1.5rem;
      min-height: 260px;
      border-bottom: 2px solid var(--ink);
    }
    .podium-stage:empty { display: none; }
    .podium-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 31%;
      min-width: 0;
    }
    .podium-block .avatar, .podium-block .pname, .podium-block .pscore { animation: dropIn .5s var(--ease) backwards; }
    .podium-block .avatar { font-size: 2.2rem; line-height: 1.1; }
    .podium-block .pname {
      font-weight: 700; font-size: 0.95rem; line-height: 1.2;
      margin-top: 0.25rem; text-align: center;
      max-width: 100%; overflow-wrap: anywhere;
    }
    .podium-block .pscore {
      color: var(--ink-2); font-size: 0.875rem; font-weight: 600;
      margin: 0.1rem 0 0.45rem;
      font-variant-numeric: tabular-nums;
    }
    .podium-bar {
      width: 100%;
      height: var(--h);
      border: 1.5px solid var(--ink);
      border-bottom: 0;
      border-radius: 14px 14px 0 0;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 0.5rem;
      font-family: var(--font-display);
      font-weight: 800;
      font-size: 2rem;
      line-height: 1;
      color: var(--ink);
      font-variant-numeric: lining-nums;
      overflow: hidden;
      animation: growBar 1s var(--ease) backwards;
    }
    .rank-1 { order: 2; --h: 160px; --d: 1.5s; } .rank-1 .podium-bar { background: var(--mustard); font-size: 2.6rem; }
    .rank-2 { order: 1; --h: 115px; --d: 0.85s; } .rank-2 .podium-bar { background: var(--card); }
    .rank-3 { order: 3; --h: 82px;  --d: 0.2s; } .rank-3 .podium-bar { background: var(--tomato-soft); }
    .rank-1 .pscore { color: var(--ink); }
    .podium-block .podium-bar { animation-delay: var(--d); }
    .podium-block .avatar, .podium-block .pname, .podium-block .pscore { animation-delay: calc(var(--d) + 0.7s); }
    @keyframes growBar { from { height: 0; } to { height: var(--h); } }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .podium-bar, .podium-block .avatar, .podium-block .pname, .podium-block .pscore { animation: none !important; }
    }

    .rest-list {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 0.15rem 1rem;
      margin-bottom: 1.5rem;
    }
    .rest-list .rest-row {
      display: grid;
      grid-template-columns: 1.75rem 1fr auto;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--line);
    }
    .rest-list .rest-row:last-child { border-bottom: none; }
    .rest-row .rk { font-family: var(--font-display); font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums lining-nums; }
    .rest-row .who { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
    .rest-row .pts { color: var(--ink-2); font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }

    /* Confettis de papier */
    .confetti {
      position: fixed;
      top: -24px;
      width: 8px; height: 14px;
      border-radius: 2px;
      pointer-events: none;
      z-index: 999;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0% { transform: translate3d(0, 0, 0) rotate(0); opacity: 1; }
      100% { transform: translate3d(var(--dx, 0px), 105vh, 0) rotate(var(--r, 540deg)); opacity: .9; }
    }

    #restartBtn { width: 100%; margin-top: 0.5rem; min-height: 56px; font-size: 1.0625rem; }
    #restartBtn:disabled { background: var(--sunk); color: var(--ink-2); border-color: var(--line); box-shadow: none; opacity: 1; }
    #waitingForHost { text-align: center; color: var(--ink-2); margin-top: 1rem; }
  </style>
</head>
<body>
  <div id="app">
    <div class="winner-banner">
      <svg class="vinyl gold" viewBox="0 0 200 200" aria-hidden="true" focusable="false">
        <circle class="v-disc" cx="100" cy="100" r="97"/>
        <g class="v-grooves">
          <circle cx="100" cy="100" r="89"/><circle cx="100" cy="100" r="81"/><circle cx="100" cy="100" r="73"/>
          <circle cx="100" cy="100" r="65"/><circle cx="100" cy="100" r="57"/><circle cx="100" cy="100" r="49"/>
        </g>
        <path class="v-shine" d="M100 17a83 83 0 0 1 63 29"/>
        <path class="v-shine" d="M100 183a83 83 0 0 1-63-29"/>
        <g class="v-label">
          <circle class="v-label-bg" cx="100" cy="100" r="37"/>
          <path id="vlGold" d="M100 76a24 24 0 1 1 0 48a24 24 0 1 1 0-48" fill="none"/>
          <text class="v-label-text"><textPath href="#vlGold">DISQUE D'OR · BRAVO ·</textPath></text>
          <circle class="v-hole" cx="100" cy="100" r="4"/>
        </g>
      </svg>
      <h1 id="winnerText">Calcul des résultats…</h1>
      <p>Fin de la partie. Merci d'avoir joué !</p>
    </div>

    <div class="podium-stage" id="podiumStage"></div>
    <div class="rest-list" id="restList"></div>

    <button id="restartBtn" class="primary hidden">Rejouer avec le même code</button>
    <p id="waitingForHost" class="hidden">L'hôte va peut-être relancer une partie. Reste là !</p>
    <p class="page-foot">
      <a href="index.html" class="back-link">Quitter</a>
    </p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script>
    (function() {
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost === true;
      const clientId = AppState.clientId;

      if (!roomCode) {
        window.location.href = 'index.html';
        return;
      }

      const roomRef = db.ref('rooms/' + roomCode);

      // Confettis en papier (couleurs de la pochette), sauf si l'utilisateur limite les animations
      function spawnConfetti() {
        try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
        const colors = ['var(--tomato)', 'var(--mustard)', 'var(--pine)', 'var(--ink)', 'var(--tomato-soft)'];
        for (let i = 0; i < 36; i++) {
          const el = document.createElement('div');
          el.className = 'confetti';
          el.style.background = colors[i % colors.length];
          el.style.left = Math.random() * 100 + 'vw';
          el.style.width = (6 + Math.random() * 5) + 'px';
          el.style.height = (10 + Math.random() * 8) + 'px';
          el.style.setProperty('--dx', ((Math.random() - 0.5) * 120).toFixed(0) + 'px');
          el.style.setProperty('--r', ((Math.random() < 0.5 ? -1 : 1) * (360 + Math.random() * 540)).toFixed(0) + 'deg');
          el.style.animationDuration = (2.4 + Math.random() * 1.6) + 's';
          el.style.animationDelay = (Math.random() * 0.8) + 's';
          document.body.appendChild(el);
          setTimeout(() => el.remove(), 5000);
        }
      }

      Promise.all([
        roomRef.child('gameState/scores').once('value'),
        roomRef.child('players').once('value')
      ]).then(([scoresSnap, playersSnap]) => {
        const scores = scoresSnap.val() || {};
        const players = playersSnap.val() || {};

        const ranked = Object.entries(players)
          .map(([id, p]) => ({ id, name: p.name, avatar: p.avatar || '🎧', score: scores[id] || 0 }))
          .sort((a, b) => b.score - a.score);

        if (ranked.length === 0) {
          document.getElementById('winnerText').textContent = 'Aucun joueur trouvé';
          return;
        }

        const winner = ranked[0];
        const winnerText = document.getElementById('winnerText');
        if (clientId === winner.id) {
          winnerText.textContent = `Bravo, tu as gagné !`;
        } else {
          winnerText.textContent = `${winner.avatar} ${winner.name} a gagné !`;
        }
        spawnConfetti();

        // Podium (top 3)
        const stage = document.getElementById('podiumStage');
        const top3 = ranked.slice(0, 3);
        top3.forEach((p, idx) => {
          const block = document.createElement('div');
          block.className = 'podium-block rank-' + (idx + 1);
          block.innerHTML = `
            <div class="avatar" aria-hidden="true">${escapeHTML(p.avatar)}</div>
            <div class="pname">${escapeHTML(p.name)}</div>
            <div class="pscore"><span class="count" data-to="${p.score}">0</span> pts</div>
            <div class="podium-bar">${idx + 1}</div>
          `;
          stage.appendChild(block);
        });

        // Les points montent en même temps que les tours
        stage.querySelectorAll('.podium-block').forEach(block => {
          const span = block.querySelector('.count');
          const to = parseInt(span.dataset.to, 10) || 0;
          const delay = (block.classList.contains('rank-1') ? 1.5 : block.classList.contains('rank-2') ? 0.85 : 0.2) * 1000 + 700;
          setTimeout(() => {
            const t0 = performance.now(), dur = 900;
            const step = now => {
              const k = Math.min(1, (now - t0) / dur);
              span.textContent = Math.round(to * (1 - Math.pow(1 - k, 3)));
              if (k < 1) requestAnimationFrame(step);
            };
            requestAnimationFrame(step);
          }, delay);
        });

        // Le reste du classement
        const restList = document.getElementById('restList');
        const rest = ranked.slice(3);
        if (rest.length === 0) {
          restList.classList.add('hidden');
        } else {
          rest.forEach((p, idx) => {
            const row = document.createElement('div');
            row.className = 'rest-row';
            row.innerHTML = `<span class="rk">${idx + 4}</span><span class="who">${escapeHTML(p.avatar)} ${escapeHTML(p.name)}</span><span class="pts">${p.score} pts</span>`;
            restList.appendChild(row);
          });
        }
      });

      // ==================== REDÉMARRER (même code de room) ====================
      const restartBtn = document.getElementById('restartBtn');
      const waitingForHost = document.getElementById('waitingForHost');

      if (isHost) {
        restartBtn.classList.remove('hidden');
        restartBtn.addEventListener('click', async () => {
          restartBtn.disabled = true;
          restartBtn.textContent = 'On remet les disques en place…';
          // On garde la config (réglages) telle quelle, on remet tout le
          // reste à zéro, et on renvoie tout le monde dans un lobby — c'est
          // l'hôte qui décide ensuite quand relancer la sélection.
          await roomRef.update({
            status: 'lobby',
            selections: {},
            gameState: {
              currentSongIndex: 0,
              songs: [],
              scores: {},
              buzzer: null,
              solved: false,
              phase: 'idle',
              finished: false,
              roundStartTime: 0
            }
          });
          window.location.href = 'host-lobby.html';
        });
      } else {
        waitingForHost.classList.remove('hidden');
        // Dès que l'hôte relance, on repart vers le lobby (même code, même nom)
        roomRef.child('status').on('value', (snap) => {
          if (snap.val() === 'lobby') {
            window.location.href = 'waiting.html';
          }
        });
      }
    })();
  </script>
</body>
</html>
