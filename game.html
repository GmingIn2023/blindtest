<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blind Test · Jeu</title>
  <style>
    /* === STYLES COMPLETS === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #0a0c0e;
      color: #f0f4fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    #app {
      max-width: 700px;
      width: 100%;
      background: #151e26;
      border-radius: 2.5rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      padding: 2rem 1.8rem;
    }
    h1 {
      font-size: 2.2rem;
      color: #ffffff;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    button {
      background: #2a3b4c;
      border: none;
      border-radius: 60px;
      padding: 0.85rem 1.4rem;
      color: white;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
      margin: 0.5rem 0;
      transition: all 0.2s;
      border: 1px solid #3e5a77;
    }
    button:hover:not(:disabled) {
      background: #3e5a77;
      transform: translateY(-2px);
    }
    button.primary {
      background: #3b6eff;
      border-color: #6e9eff;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hidden { display: none !important; }

    /* Vue Hôte */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .play-btn {
      background: linear-gradient(135deg, #5e9eff 0%, #2a5bbf 100%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      font-size: 2rem;
      border: none;
      color: white;
      cursor: pointer;
    }
    .reveal-btn {
      background: linear-gradient(135deg, #2e3b4e, #1e2835);
      border: 2px solid #3e4c5a;
      padding: 0.9rem 2rem;
      border-radius: 60px;
    }
    .timer-big {
      font-size: 2.5rem;
      font-weight: bold;
      color: #ffaa33;
      text-align: center;
      font-family: monospace;
      background: #0f1a24;
      padding: 0.5rem;
      border-radius: 1rem;
      margin: 1rem 0;
    }
    .notification {
      background: #1e3f5a;
      border-radius: 60px;
      padding: 0.5rem 1rem;
      margin: 0.5rem 0;
      text-align: center;
    }
    .scoreboard {
      background: #0f1419;
      border-radius: 1.5rem;
      padding: 1rem;
      margin: 1rem 0;
    }

    /* Vue Joueur */
    .buzzer-btn {
      background: radial-gradient(circle at 30% 30%, #ff4d4d, #b30000);
      width: 200px;
      height: 200px;
      border-radius: 50%;
      margin: 2rem auto;
      font-size: 2rem;
      font-weight: bold;
      color: white;
      border: none;
      cursor: pointer;
      display: block;
    }
    .buzzer-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .cooldown-timer {
      font-size: 1.2rem;
      color: #ffaa33;
      text-align: center;
    }

    /* Popups */
    .popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: #1e2a36;
      border: 3px solid #ffaa33;
      border-radius: 2rem;
      padding: 2rem;
      width: 90%;
      max-width: 400px;
      z-index: 1000;
      box-shadow: 0 10px 30px black;
      text-align: center;
    }
    .popup h3 {
      margin-bottom: 1rem;
      color: #ffaa33;
    }
    .popup-cover {
      width: 120px;
      height: 120px;
      border-radius: 1rem;
      margin: 1rem auto;
      object-fit: cover;
      display: block;
    }
    .popup-cover.blur {
      filter: blur(8px);
    }
    .choice-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 0.5rem;
      margin-top: 1rem;
    }
    .choice-btn {
      background: #2a3a4a;
      border: 2px solid #5e9eff;
      border-radius: 1rem;
      padding: 0.8rem;
      cursor: pointer;
      text-align: center;
    }
    .choice-btn:hover {
      background: #3b6eff;
    }
    .answer-input {
      width: 100%;
      padding: 0.8rem;
      border-radius: 60px;
      border: 1px solid #3e5a77;
      background: #0f1a24;
      color: white;
      margin: 1rem 0;
    }
    .popup-timer {
      font-size: 2rem;
      color: #ffaa33;
      margin: 0.5rem 0;
    }
    /* Flash plein écran au moment d'un buzz */
    .buzz-flash {
      position: fixed; inset: 0; z-index: 500;
      background: radial-gradient(circle, rgba(255,80,80,0.35) 0%, rgba(255,80,80,0) 70%);
      pointer-events: none;
      animation: buzzPulse 0.6s ease-out;
    }
    .buzz-flash.hidden { display: none; }
    @keyframes buzzPulse {
      0% { opacity: 0; transform: scale(0.8); }
      30% { opacity: 1; transform: scale(1.05); }
      100% { opacity: 0; transform: scale(1); }
    }

    /* Pochette révélée par quadrants (hôte uniquement) */
    .quadrant-cover {
      position: relative;
      width: 160px; height: 160px;
      margin: 1rem auto;
      border-radius: 16px;
      overflow: hidden;
      background: #000;
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .quadrant-cover.hidden { display: none; }
    .quadrant {
      background-size: 320px 320px;
      filter: blur(18px);
      opacity: 0;
      transition: opacity 0.6s ease, filter 1.5s ease;
    }
    #quad-0 { background-position: 0 0; }
    #quad-1 { background-position: -160px 0; }
    #quad-2 { background-position: 0 -160px; }
    #quad-3 { background-position: -160px -160px; }

    /* Bouton Révéler devient vert quand une bonne réponse a été trouvée */
    .reveal-btn.correct-ready {
      background: #2fae5f !important;
      border-color: #4fd97f !important;
      animation: revealPulse 1s ease-in-out infinite;
    }
    @keyframes revealPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(79,217,127,0.5); }
      50% { box-shadow: 0 0 0 10px rgba(79,217,127,0); }
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>🎧 Blind Test</h1>

    <!-- Panneau de diagnostic : à lire et me rapporter si un problème persiste -->
    <div id="debugPanel" style="position:fixed; bottom:0; left:0; right:0; background:#000; color:#7fff9f; font-size:0.7rem; padding:6px 10px; font-family:monospace; z-index:9999; opacity:0.9;"></div>
    <div id="mergeDebugPanel" style="position:fixed; bottom:22px; left:0; right:0; background:#000; color:#ffcf5c; font-size:0.7rem; padding:6px 10px; font-family:monospace; z-index:9999; opacity:0.9;"></div>

    <!-- Flash plein écran quand quelqu'un buzz -->
    <div id="buzzFlash" class="buzz-flash hidden"></div>

    <!-- Vue HÔTE -->
    <div id="host-view" class="hidden">
      <div class="game-header">
        <span id="hostSongCounter" class="song-counter">Chanson 1 / ?</span>
        <button id="hostPlay" class="play-btn">▶️</button>
        <button id="hostReveal" class="reveal-btn">🔎 Révéler</button>
      </div>
      <div class="timer-big" id="hostTimer">00:00.0</div>
      <div id="quadrantCover" class="quadrant-cover hidden">
        <div class="quadrant" id="quad-0"></div>
        <div class="quadrant" id="quad-1"></div>
        <div class="quadrant" id="quad-2"></div>
        <div class="quadrant" id="quad-3"></div>
      </div>
      <div id="hostNotification" class="notification"></div>
      <div id="hostScoreboard" class="scoreboard"></div>
      <button id="hostNext" class="primary">⏩ Chanson suivante</button>
    </div>

    <!-- Vue JOUEUR -->
    <div id="player-view" class="hidden">
      <div id="playerSongInfo" style="text-align:center; margin-bottom:1rem;">Chanson 1 / ?</div>
      <div class="timer-big" id="playerTimer">00:00.0</div>
      <div id="playerScore" style="font-size:1.5rem; text-align:center; color:#d4ffb0; margin:0.5rem;">0 pts</div>
      <div id="playerAttempts" style="text-align:center;">Essais restants: ∞</div>
      <div id="cooldownDisplay" class="cooldown-timer"></div>
      <button class="buzzer-btn" id="playerBuzzer">JE SAIS !</button>
      <div id="playerFeedback" style="text-align:center;"></div>
      <div id="playerScoreboard" class="scoreboard"></div>
    </div>

    <!-- Popup de révélation (hôte) -->
    <div id="popupReveal" class="popup hidden">
      <h3>🎉 Réponse</h3>
      <img id="revealCover" class="popup-cover" src="" alt="cover">
      <h2 id="revealTitle"></h2>
      <p id="revealArtist"></p>
      <button id="closeReveal" class="primary">Fermer</button>
    </div>

    <!-- Popup réponse écrite -->
    <div id="popupAnswer" class="popup hidden">
      <h3>✏️ Tape le titre</h3>
      <input type="text" id="answerInput" class="answer-input" placeholder="Titre">
      <div style="display:flex; gap:1rem; align-items:center;">
        <button id="submitAnswer" style="flex:1;">✅ Valider</button>
        <span id="answerTimer" class="popup-timer">10</span>
      </div>
    </div>

    <!-- Popup choix multiple -->
    <div id="popupChoice" class="popup hidden">
      <h3>🎯 Choisis la chanson</h3>
      <div id="choiceGrid" class="choice-grid"></div>
      <div id="choiceTimer" class="popup-timer">5</div>
    </div>

    <!-- Popup résultat (bravo/faux) -->
    <div id="popupResult" class="popup hidden">
      <h3 id="resultTitle"></h3>
      <p id="resultMessage"></p>
    </div>

    <!-- Popup pour le mode artiste -->
    <div id="popupArtist" class="popup hidden">
      <h3>🎤 Quel artiste ?</h3>
      <div id="artistGrid" class="choice-grid"></div>
    </div>

    <!-- Popup pour le mode date -->
    <div id="popupDate" class="popup hidden">
      <h3>📅 De quelle époque ?</h3>
      <div id="dateGrid" class="choice-grid"></div>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/state.js"></script>

  <script>
    (function() {
      // ==================== CONFIGURATION FIREBASE ====================
      const firebaseConfig = {
        apiKey: "AIzaSyBOEU9kg6YuXllGEGS9iod_SsBRu9NOPro",
        authDomain: "blind-test-kahoot.firebaseapp.com",
        databaseURL: "https://blind-test-kahoot-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "blind-test-kahoot",
        storageBucket: "blind-test-kahoot.firebasestorage.app",
        messagingSenderId: "798773649205",
        appId: "1:798773649205:web:de5dd5cbce41ea2ec5b67c"
      };
      firebase.initializeApp(firebaseConfig);
      const db = firebase.database();

      // ==================== RÉCUPÉRATION DE L'ÉTAT LOCAL ====================
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost === true;
      const clientId = AppState.clientId;
      const playerName = AppState.playerName || 'Joueur';

      if (!roomCode) {
        alert('Aucune partie en cours. Retour à l\'accueil.');
        window.location.href = 'index.html';
        return;
      }

      console.log('Jeu démarré', { roomCode, isHost, clientId, playerName });

      const roomRef = db.ref('rooms/' + roomCode);
      const gameStateRef = roomRef.child('gameState');
      const playersRef = roomRef.child('players');

      // ==================== FILET DE SÉCURITÉ ====================
      // Si on arrive sur cette page (rechargement, retour navigateur, lien
      // direct...) sans que waiting.html ait eu l'occasion de fusionner les
      // sélections dans gameState.songs, on le fait nous-mêmes ici. Ça évite
      // TOUT le tableau vide indépendamment de comment on est arrivé sur
      // cette page. On réessaie plusieurs fois avec un délai, au lieu d'un
      // seul essai, au cas où les données ne soient pas encore toutes
      // disponibles pile au moment du chargement de la page.
      let songsFixAttempted = false;

      async function tryMergeOnce(mergeDebug, attempt, maxTries) {
        const songsSnap = await gameStateRef.child('songs').once('value');
        const existing = songsSnap.val();
        if (Array.isArray(existing) && existing.length > 0) {
          if (mergeDebug) mergeDebug.textContent = `🔧 fusion : déjà ${existing.length} chanson(s) en place, rien à faire`;
          return true;
        }

        const [selSnap, playersSnap, configSnap] = await Promise.all([
          roomRef.child('selections').once('value'),
          roomRef.child('players').once('value'),
          roomRef.child('config').once('value')
        ]);
        const selections = selSnap.val() || {};
        const players = playersSnap.val() || {};
        const config = configSnap.val() || {};
        const playerIds = Object.keys(players);

        let allSongs = [];
        if (selections.host && Array.isArray(selections.host.songs)) {
          allSongs = allSongs.concat(selections.host.songs);
        }
        playerIds.forEach((id) => {
          const sel = selections[id];
          if (sel && Array.isArray(sel.songs)) allSongs = allSongs.concat(sel.songs);
        });

        if (mergeDebug) {
          mergeDebug.textContent = `🔧 essai ${attempt}/${maxTries} : selections.host=${selections.host ? (selections.host.songs || []).length : 'ABSENT'} ` +
            `· joueurs:${playerIds.length} · total:${allSongs.length}`;
        }

        if (allSongs.length === 0) return false; // on retentera au prochain tour

        for (let i = allSongs.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = allSongs[i]; allSongs[i] = allSongs[j]; allSongs[j] = tmp;
        }
        const scores = {};
        playerIds.forEach((id) => { scores[id] = 0; });

        await gameStateRef.update({
          songs: allSongs,
          currentSongIndex: 0,
          scores: scores,
          playerAttempts: {},
          buzzer: null,
          buzzerLocked: false,
          reopenAt: 0,
          roundActive: false,
          roundStartTime: 0,
          mode: config.mode || 'classic',
          maxAttempts: (config.maxAttempts !== undefined) ? config.maxAttempts : 3,
          blurEnabled: !!config.blurEnabled,
          lockOthersOnBuzz: (config.lockOthersOnBuzz !== undefined) ? config.lockOthersOnBuzz : true
        });
        if (mergeDebug) mergeDebug.textContent += ` → ✅ écrit avec succès (${allSongs.length} chansons)`;
        return true;
      }

      async function ensureSongsPopulated() {
        const mergeDebug = document.getElementById('mergeDebugPanel');
        if (!isHost || songsFixAttempted) return;
        songsFixAttempted = true;

        const maxTries = 8; // ~16 secondes au total, largement le temps que tout se propage
        for (let attempt = 1; attempt <= maxTries; attempt++) {
          try {
            const done = await tryMergeOnce(mergeDebug, attempt, maxTries);
            if (done) return;
          } catch (err) {
            if (mergeDebug) mergeDebug.textContent = `🔧 essai ${attempt} ERREUR : ` + (err && err.message ? err.message : String(err));
            console.error('ensureSongsPopulated error', err);
          }
          await new Promise((r) => setTimeout(r, 2000));
        }
      }
      const songsFixPromise = ensureSongsPopulated();

      // ==================== VARIABLES PARTAGÉES ====================
      let currentAudio = null;
      let currentWebAudioSource = null;
      let audioCtx = null;
      let previousBuzzerId = null; // pour détecter la transition null -> quelqu'un (flash)
      let lastCorrectSongIndex = -1; // pour le bouton Révéler qui devient vert
      let gameSongs = [];
      let currentSongIndex = 0;
      let roundActive = false;
      let roundStartTime = 0;
      let scores = {};
      let playerAttempts = {};
      let buzzer = null;          // { id, name, at } | null
      let buzzerLocked = false;   // true = manche verrouillée (bonne réponse trouvée)
      let reopenAt = 0;           // timestamp: le buzzer redevient dispo pour tous après une erreur
      let lockOthersOnBuzz = true;
      let mode = 'classic';
      let maxAttempts = 3;
      let blurEnabled = false;

      // Intervalles
      let answerTimerInterval = null;
      let choiceTimerInterval = null;
      let answerStartTime = 0;

      // Classement en direct, trié par score, réutilisé par l'hôte et les joueurs
      function renderScoreboard(targetId) {
        const target = document.getElementById(targetId);
        if (!target) return;
        playersRef.once('value', (snap) => {
          const players = snap.val() || {};
          const ranked = Object.entries(players)
            .map(([id, p]) => ({ id, name: p.name, avatar: p.avatar || '', score: scores[id] || 0 }))
            .sort((a, b) => b.score - a.score);

          let html = '<strong>🏆 Classement</strong><br>';
          ranked.forEach((p, idx) => {
            const isBuzzing = buzzer && buzzer.id === p.id;
            const attempts = playerAttempts[p.id] || {};
            const attemptsLeft = (attempts.attemptsLeft !== undefined) ? attempts.attemptsLeft : maxAttempts;
            const attemptsText = maxAttempts === 0 ? '∞' : attemptsLeft;
            const medal = ['🥇', '🥈', '🥉'][idx] || `${idx + 1}.`;
            const rowStyle = isBuzzing
              ? 'background:#3a2d2d;border-radius:8px;padding:3px 8px;margin:2px 0;'
              : 'opacity:0.8;padding:3px 8px;';
            html += `<div style="${rowStyle}">
              ${isBuzzing ? '🔴' : medal} ${p.avatar} ${p.name}: ${p.score} pts
              <span style="color:#8aaec0;font-size:0.82em;">· essais: ${attemptsText}</span>
            </div>`;
          });
          target.innerHTML = html;
        });
      }

      // ==================== FONCTIONS UTILITAIRES ====================
      function normalize(str) {
        if (!str) return '';
        return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, "");
      }
      function formatTimer(ms) {
        if (ms < 0) ms = 0;
        let seconds = Math.floor(ms / 1000);
        let tenth = Math.floor((ms % 1000) / 100);
        let minutes = Math.floor(seconds / 60);
        seconds = seconds % 60;
        return `${minutes.toString().padStart(2,'0')}:${seconds.toString().padStart(2,'0')}.${tenth}`;
      }
      function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
      }
      function getCooldown(attemptCount) {
        return 3000 + (attemptCount - 1) * 2000; // 3s, 5s, 7s...
      }

      // Score façon Kahoot : plus on répond vite, plus on gagne de points.
      // <0.5s -> 100 pts. Puis -15 pts/seconde jusqu'à 4s, puis -10 pts/seconde
      // au-delà, avec un plancher à 20 pts tant que la réponse est correcte.
      function computeKahootPoints(elapsedMs) {
        const t = elapsedMs / 1000;
        if (t < 0.5) return 100;
        let points;
        if (t <= 4) {
          points = 100 - 15 * t;
        } else {
          points = (100 - 15 * 4) - 10 * (t - 4);
        }
        return Math.max(20, Math.round(points));
      }

      function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      function reverseBuffer(ctx, buffer) {
        const out = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
        for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
          const src = buffer.getChannelData(ch);
          const dst = out.getChannelData(ch);
          for (let i = 0; i < src.length; i++) dst[i] = src[src.length - 1 - i];
        }
        return out;
      }
      function phaseCancelInstrumental(ctx, buffer) {
        if (buffer.numberOfChannels < 2) return buffer;
        const out = ctx.createBuffer(2, buffer.length, buffer.sampleRate);
        const left = buffer.getChannelData(0);
        const right = buffer.getChannelData(1);
        const outL = out.getChannelData(0);
        const outR = out.getChannelData(1);
        for (let i = 0; i < left.length; i++) {
          const diff = (left[i] - right[i]) / 2;
          outL[i] = diff;
          outR[i] = diff;
        }
        return out;
      }

      function stopCurrentPlayback() {
        if (currentAudio) { try { currentAudio.pause(); } catch(e){} currentAudio = null; }
        if (currentWebAudioSource) { try { currentWebAudioSource.stop(); } catch(e){} currentWebAudioSource = null; }
      }

      // Joue l'extrait en respectant les réglages choisis à la sélection :
      // position de départ, durée, inversion, instrumental.
      async function playSongClip(song) {
        stopCurrentPlayback();
        const clipStart = song.clipStart || 0;
        const clipDuration = song.clipDuration || 10;

        if (!song.reverse && !song.instrumental) {
          // Cas simple et fiable : lecture directe, pas de traitement audio
          currentAudio = new Audio(song.previewUrl);
          currentAudio.addEventListener('loadedmetadata', () => {
            currentAudio.currentTime = clipStart;
          });
          currentAudio.play().catch(e => console.log('Erreur lecture audio', e));
          setTimeout(() => { if (currentAudio) currentAudio.pause(); }, clipDuration * 1000);
          return;
        }

        // Reverse et/ou instrumental : traitement Web Audio (nécessite de
        // décoder l'extrait complet). Si ça échoue (réseau/CORS), on retombe
        // sur une lecture normale plutôt que de ne rien jouer du tout.
        try {
          const ctx = getAudioContext();
          const res = await fetch(song.previewUrl);
          const arrayBuffer = await res.arrayBuffer();
          let buffer = await ctx.decodeAudioData(arrayBuffer);
          if (song.instrumental) buffer = phaseCancelInstrumental(ctx, buffer);
          if (song.reverse) buffer = reverseBuffer(ctx, buffer);
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(ctx.destination);
          const playFrom = song.reverse ? Math.max(0, buffer.duration - clipStart - clipDuration) : clipStart;
          source.start(0, playFrom, clipDuration);
          currentWebAudioSource = source;
        } catch (e) {
          console.log('Traitement audio impossible, lecture normale à la place', e);
          currentAudio = new Audio(song.previewUrl);
          currentAudio.play().catch(() => {});
        }
      }

      // Flash plein écran visible par tout le monde quand quelqu'un buzz
      function triggerBuzzFlash() {
        const flash = document.getElementById('buzzFlash');
        if (!flash) return;
        flash.classList.remove('hidden');
        // Redémarre l'animation CSS à chaque déclenchement
        flash.style.animation = 'none';
        void flash.offsetWidth;
        flash.style.animation = '';
        setTimeout(() => flash.classList.add('hidden'), 650);
      }

      // ==================== AFFICHAGE DE LA BONNE VUE ====================
      // Déclarées ici pour être accessibles depuis l'écoute Firebase plus
      // bas, même si elles sont définies à l'intérieur de initHost()/initPlayer().
      let updateHostUI = function() {};
      let updatePlayerUI = function() {};

      const hostView = document.getElementById('host-view');
      const playerView = document.getElementById('player-view');
      if (isHost) {
        hostView.classList.remove('hidden');
        initHost();
      } else {
        playerView.classList.remove('hidden');
        initPlayer();
      }

      // ==================== ÉCOUTE GLOBALE DE L'ÉTAT ====================
      gameStateRef.on('value', (snap) => {
        const gs = snap.val() || {};
        gameSongs = gs.songs || [];
        currentSongIndex = gs.currentSongIndex || 0;
        roundActive = gs.roundActive || false;
        roundStartTime = gs.roundStartTime || 0;
        scores = gs.scores || {};
        playerAttempts = gs.playerAttempts || {};
        buzzer = gs.buzzer || null;
        buzzerLocked = gs.buzzerLocked || false;
        reopenAt = gs.reopenAt || 0;
        lockOthersOnBuzz = (gs.lockOthersOnBuzz !== undefined) ? gs.lockOthersOnBuzz : true;
        mode = gs.mode || 'classic';
        maxAttempts = (gs.maxAttempts !== undefined && gs.maxAttempts !== null) ? gs.maxAttempts : 3;
        blurEnabled = gs.blurEnabled || false;

        // Quelqu'un vient de buzzer (transition null -> quelqu'un) : flash
        // visible par tout le monde, hôte comme joueurs.
        const currentBuzzerId = buzzer ? buzzer.id : null;
        if (currentBuzzerId && currentBuzzerId !== previousBuzzerId) {
          triggerBuzzFlash();
        }
        previousBuzzerId = currentBuzzerId;

        const debugPanel = document.getElementById('debugPanel');
        if (debugPanel) {
          debugPanel.textContent =
            `room:${roomCode} · role:${isHost ? 'host' : 'player'} · chansons:${gameSongs.length} · ` +
            `index:${currentSongIndex} · round:${roundActive} · buzzer:${buzzer ? buzzer.name : '-'} · ` +
            `mode:${mode} · essais:${maxAttempts}`;
        }

        // Mettre à jour les interfaces
        if (isHost) {
          updateHostUI();
        } else {
          updatePlayerUI();
        }
      });

      // ==================== HÔTE ====================
      function initHost() {
        const hostSongCounter = document.getElementById('hostSongCounter');
        const hostTimer = document.getElementById('hostTimer');
        const hostNotification = document.getElementById('hostNotification');
        const hostScoreboard = document.getElementById('hostScoreboard');
        const hostNext = document.getElementById('hostNext');
        const hostPlay = document.getElementById('hostPlay');
        const hostReveal = document.getElementById('hostReveal');

        // Timer en continu
        setInterval(() => {
          if (roundActive && roundStartTime > 0) {
            const elapsed = Date.now() - roundStartTime;
            hostTimer.textContent = formatTimer(elapsed);
            updateQuadrantCover(elapsed);
          } else {
            // Filet de sécurité : si la manche n'est plus active (bonne
            // réponse trouvée, révélée, etc.) mais qu'un extrait joue encore
            // sur cet appareil, on l'arrête.
            stopCurrentPlayback();
          }
        }, 100);

        function resetQuadrantCover(song) {
          const container = document.getElementById('quadrantCover');
          if (!blurEnabled) { container.classList.add('hidden'); return; }
          container.classList.remove('hidden');
          const url = song && song.artwork ? song.artwork : '';
          for (let i = 0; i < 4; i++) {
            const q = document.getElementById('quad-' + i);
            q.style.backgroundImage = url ? `url('${url}')` : 'none';
            q.style.opacity = '0';
            q.style.filter = 'blur(18px)';
          }
        }

        // Coin par coin (2s/4s/6s/8s), puis le flou diminue progressivement
        function updateQuadrantCover(elapsedMs) {
          if (!blurEnabled) return;
          const container = document.getElementById('quadrantCover');
          if (!container || container.classList.contains('hidden')) return;
          const t = elapsedMs / 1000;
          const revealTimes = [2, 4, 6, 8];
          for (let i = 0; i < 4; i++) {
            if (t >= revealTimes[i]) {
              document.getElementById('quad-' + i).style.opacity = '1';
            }
          }
          if (t > 8) {
            const blurAmount = Math.max(4, 18 - (t - 8) * 3.5);
            for (let i = 0; i < 4; i++) {
              document.getElementById('quad-' + i).style.filter = `blur(${blurAmount}px)`;
            }
          }
        }

        updateHostUI = function() {
          if (gameSongs.length > 0) {
            hostSongCounter.textContent = `Chanson ${currentSongIndex+1} / ${gameSongs.length}`;
          }
          updateHostScoreboard();
          // Le bouton "Suivant" est toujours cliquable : l'hôte peut skip librement
        }

        function updateHostScoreboard() {
          renderScoreboard('hostScoreboard');
        }

        hostPlay.addEventListener('click', async () => {
          if (roundActive) return;
          let song = gameSongs[currentSongIndex];
          if (!song || !song.previewUrl) {
            // On attend que la réparation automatique ait fini avant de
            // conclure qu'il n'y a vraiment rien (évite de renvoyer à tort
            // vers la sélection si on clique Play trop vite après le
            // chargement de la page).
            hostPlay.disabled = true;
            await songsFixPromise;
            const freshSnap = await gameStateRef.child('songs').once('value');
            const freshSongs = freshSnap.val();
            hostPlay.disabled = false;
            if (Array.isArray(freshSongs) && freshSongs.length > 0) {
              gameSongs = freshSongs;
              song = gameSongs[currentSongIndex];
            }
          }
          if (!song || !song.previewUrl) {
            alert('Aucune chanson trouvée pour cette partie. Regarde le message orange en bas de l\'écran et copie-le-moi.');
            return;
          }
          const startTime = Date.now();
          gameStateRef.update({
            roundStartTime: startTime,
            roundActive: true,
            buzzer: null,
            buzzerLocked: false,
            reopenAt: 0
          });
          hostReveal.classList.remove('correct-ready');
          resetQuadrantCover(song);
          // Lecture de l'extrait, en respectant les réglages choisis à la sélection
          playSongClip(song);
        });

        // Révélation avec popup jolie
        hostReveal.addEventListener('click', () => {
          const song = gameSongs[currentSongIndex];
          if (!song) return;
          stopCurrentPlayback();
          gameStateRef.update({ roundActive: false, buzzer: null, buzzerLocked: true, reopenAt: 0 });
          hostReveal.classList.remove('correct-ready');
          const popup = document.getElementById('popupReveal');
          const cover = document.getElementById('revealCover');
          const title = document.getElementById('revealTitle');
          const artist = document.getElementById('revealArtist');
          cover.src = song.artwork || 'https://via.placeholder.com/120';
          cover.classList.remove('blur');
          title.textContent = song.title;
          artist.textContent = song.artist;
          popup.classList.remove('hidden');
        });

        document.getElementById('closeReveal').addEventListener('click', () => {
          document.getElementById('popupReveal').classList.add('hidden');
        });

        hostNext.addEventListener('click', () => {
          stopCurrentPlayback();
          hostReveal.classList.remove('correct-ready');
          if (currentSongIndex + 1 < gameSongs.length) {
            gameStateRef.update({
              currentSongIndex: currentSongIndex + 1,
              roundActive: false,
              roundStartTime: 0,
              buzzer: null,
              buzzerLocked: false,
              reopenAt: 0,
              playerAttempts: {} // essais remis à zéro pour la nouvelle chanson
            });
          } else {
            gameStateRef.parent.update({ status: 'finished' });
            window.location.href = 'podium.html';
          }
        });

        // Affichage des résultats de réponse
        gameStateRef.child('answerResult').on('value', (snap) => {
          const res = snap.val();
          if (res) {
            playersRef.child(res.playerId).once('value', (pSnap) => {
              const player = pSnap.val();
              if (player) {
                hostNotification.textContent = `${player.name}: ${res.correct ? '✅' : '❌'} ${res.points} pts`;
                setTimeout(() => hostNotification.textContent = '', 3000);
              }
            });
            if (res.correct) {
              hostReveal.classList.add('correct-ready');
            }
            snap.ref.remove(); // nettoyer
          }
        });
      }

      // ==================== JOUEUR ====================
      function initPlayer() {
        const playerSongInfo = document.getElementById('playerSongInfo');
        const playerTimer = document.getElementById('playerTimer');
        const playerScore = document.getElementById('playerScore');
        const playerAttemptsDiv = document.getElementById('playerAttempts');
        const cooldownDisplay = document.getElementById('cooldownDisplay');
        const playerBuzzer = document.getElementById('playerBuzzer');
        const playerFeedback = document.getElementById('playerFeedback');

        // Timer en continu
        setInterval(() => {
          if (roundActive && roundStartTime > 0) {
            const elapsed = Date.now() - roundStartTime;
            playerTimer.textContent = formatTimer(elapsed);
          }
        }, 100);

        // Empêche de rouvrir la popup deux fois pour la même prise de buzzer
        let popupOpenForBuzzAt = 0;
        let lastCorrectAnswer = null;

        gameStateRef.child('answerResult').on('value', (snap) => {
          const res = snap.val();
          if (res && res.correct) {
            lastCorrectAnswer = {
              playerName: res.playerName,
              songTitle: gameSongs[currentSongIndex] ? gameSongs[currentSongIndex].title : '',
              songIndex: currentSongIndex
            };
          }
        });

        updatePlayerUI = function() {
          if (gameSongs[currentSongIndex]) {
            playerSongInfo.textContent = `Chanson ${currentSongIndex+1} / ${gameSongs.length}`;
          }
          playerScore.textContent = (scores[clientId] || 0) + ' pts';
          renderScoreboard('playerScoreboard');

          const attempts = playerAttempts[clientId] || { attemptsLeft: maxAttempts, cooldownUntil: 0, attemptCount: 0 };
          playerAttemptsDiv.textContent = `Essais restants: ${maxAttempts === 0 ? '∞' : attempts.attemptsLeft}`;

          const now = Date.now();

          // C'est nous qui avons le buzzer : la popup de réponse est déjà (ou va être) affichée, on ne touche à rien.
          if (buzzer && buzzer.id === clientId) {
            playerBuzzer.disabled = true;
            cooldownDisplay.textContent = '';
            playerFeedback.textContent = '';
            return;
          }

          if (!roundActive) {
            playerBuzzer.disabled = true;
            cooldownDisplay.textContent = '';
            playerFeedback.textContent = '⏸️ En attente du lancement...';
            return;
          }

          if (buzzerLocked) {
            playerBuzzer.disabled = true;
            cooldownDisplay.textContent = '';
            if (lastCorrectAnswer && lastCorrectAnswer.songIndex === currentSongIndex) {
              playerFeedback.textContent = `🎉 ${lastCorrectAnswer.playerName} a trouvé "${lastCorrectAnswer.songTitle}" ! En attente de l'hôte...`;
            } else {
              playerFeedback.textContent = '✅ Manche terminée';
            }
            return;
          }

          if (buzzer && buzzer.id !== clientId) {
            if (lockOthersOnBuzz) {
              playerBuzzer.disabled = true;
              cooldownDisplay.textContent = '';
              playerFeedback.textContent = `🔒 ${buzzer.name} a buzzé...`;
              return;
            }
            // Option désactivée : pas de blocage visuel forcé, les vérifications
            // suivantes (cooldown, essais...) décident normalement. La
            // transaction Firebase empêche de toute façon de voler le buzzer.
          }

          if (reopenAt && now < reopenAt) {
            const sec = Math.ceil((reopenAt - now) / 1000);
            playerBuzzer.disabled = true;
            cooldownDisplay.textContent = `⏳ Réouverture dans ${sec}s`;
            playerFeedback.textContent = '';
            return;
          }

          if (attempts.cooldownUntil && now < attempts.cooldownUntil) {
            const sec = Math.ceil((attempts.cooldownUntil - now)/1000);
            cooldownDisplay.textContent = `⏳ Cooldown: ${sec}s`;
            playerBuzzer.disabled = true;
            playerFeedback.textContent = '';
            return;
          }

          if (maxAttempts > 0 && attempts.attemptsLeft <= 0) {
            playerBuzzer.disabled = true;
            cooldownDisplay.textContent = '';
            playerFeedback.textContent = '❌ Plus d\'essais';
            return;
          }

          // Rien ne bloque : le buzzer est disponible
          playerBuzzer.disabled = false;
          cooldownDisplay.textContent = '';
          playerFeedback.textContent = '';
        }

        // Rafraîchit l'UI régulièrement pour faire vivre les décomptes (cooldown, réouverture)
        setInterval(updatePlayerUI, 250);

        // Tentative atomique de prise du buzzer : le premier qui écrit dans Firebase gagne.
        // Contrairement à un simple .update(), la transaction garantit qu'un seul joueur
        // peut "gagner" même en cas de clics quasi simultanés.
        function grabBuzzer() {
          return new Promise((resolve) => {
            gameStateRef.child('buzzer').transaction(
              (current) => {
                if (current === null || current === undefined) {
                  return { id: clientId, name: playerName, at: Date.now() };
                }
                return; // undefined = on annule, quelqu'un a déjà le buzzer
              },
              (error, committed, snapshot) => {
                if (error) { console.log('Erreur transaction buzzer', error); resolve(false); return; }
                const val = snapshot ? snapshot.val() : null;
                resolve(!!(committed && val && val.id === clientId));
              }
            );
          });
        }

        playerBuzzer.addEventListener('click', async () => {
          if (playerBuzzer.disabled) return;
          playerBuzzer.disabled = true; // feedback immédiat, empêche le double-clic pendant la transaction
          const won = await grabBuzzer();
          if (won) {
            popupOpenForBuzzAt = Date.now();
            if (mode === 'kahoot') showChoicePopup();
            else if (mode === 'artist') showArtistPopup();
            else if (mode === 'date') showDatePopup();
            else showAnswerPopup();
          }
          // Si on a perdu la course, le prochain rafraîchissement (updatePlayerUI)
          // grisera le bouton avec le nom du gagnant automatiquement.
        });

        // ===== Popup réponse écrite =====
        function showAnswerPopup() {
          const popup = document.getElementById('popupAnswer');
          const input = document.getElementById('answerInput');
          const timerSpan = document.getElementById('answerTimer');
          popup.classList.remove('hidden');
          input.value = '';
          input.focus();
          let timeLeft = 10;
          timerSpan.textContent = timeLeft;
          answerStartTime = Date.now();
          if (answerTimerInterval) clearInterval(answerTimerInterval);
          answerTimerInterval = setInterval(() => {
            timeLeft--;
            timerSpan.textContent = timeLeft;
            if (timeLeft <= 0) {
              clearInterval(answerTimerInterval);
              submitAnswer('');
            }
          }, 1000);
        }

        document.getElementById('submitAnswer').onclick = () => {
          const ans = document.getElementById('answerInput').value.trim();
          submitAnswer(ans);
        };

        async function submitAnswer(answer) {
          if (answerTimerInterval) clearInterval(answerTimerInterval);
          document.getElementById('popupAnswer').classList.add('hidden');
          const song = gameSongs[currentSongIndex];
          if (!song) return;
          const correct = song.title;
          const normAnswer = normalize(answer);
          const normCorrect = normalize(correct);
          const isCorrect = normAnswer === normCorrect || normCorrect.includes(normAnswer) || normAnswer.includes(normCorrect);
          const elapsed = roundActive ? Date.now() - roundStartTime : 0;
          let points = 0;
          if (isCorrect) {
            points = computeKahootPoints(elapsed);
          } else {
            points = -50;
          }
          await sendResult(points, isCorrect, correct, elapsed);
        }

        // ===== Popup choix multiple =====
        function showChoicePopup() {
          const currentSong = gameSongs[currentSongIndex];
          if (!currentSong) return;
          // Générer des propositions : la bonne + 3 autres aléatoires (parmi toutes les chansons)
          let otherSongs = gameSongs.filter(s => s.title !== currentSong.title);
          while (otherSongs.length < 3) {
            otherSongs = otherSongs.concat(gameSongs);
          }
          shuffleArray(otherSongs);
          const choices = [currentSong, ...otherSongs.slice(0, 3)];
          shuffleArray(choices);
          const grid = document.getElementById('choiceGrid');
          grid.innerHTML = '';
          choices.forEach((song, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = song.title;
            btn.onclick = () => handleChoice(song, currentSong);
            grid.appendChild(btn);
          });
          document.getElementById('popupChoice').classList.remove('hidden');
          let timeLeft = 5;
          document.getElementById('choiceTimer').textContent = timeLeft;
          if (choiceTimerInterval) clearInterval(choiceTimerInterval);
          choiceTimerInterval = setInterval(() => {
            timeLeft--;
            document.getElementById('choiceTimer').textContent = timeLeft;
            if (timeLeft <= 0) {
              clearInterval(choiceTimerInterval);
              handleChoice(null, currentSong);
            }
          }, 1000);
        }

        async function handleChoice(selected, correct) {
          if (choiceTimerInterval) clearInterval(choiceTimerInterval);
          document.getElementById('popupChoice').classList.add('hidden');
          const isCorrect = selected && selected.title === correct.title;
          const elapsed = roundActive ? Date.now() - roundStartTime : 0;
          let points = 0;
          if (isCorrect) {
            const seconds = elapsed / 1000;
            points = Math.max(20, 100 - Math.floor(seconds * 10));
          } else {
            points = -50;
          }
          await sendResult(points, isCorrect, correct.title, elapsed);
        }

        // ===== Popup artiste =====
        function showArtistPopup() {
          // Simuler une liste d'artistes (on pourrait les prendre depuis les chansons)
          const artists = [...new Set(gameSongs.map(s => s.artist))];
          if (artists.length === 0) {
            // fallback
            artists.push('Inconnu');
          }
          shuffleArray(artists);
          const grid = document.getElementById('artistGrid');
          grid.innerHTML = '';
          artists.forEach(artist => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = artist;
            btn.onclick = () => handleArtistChoice(artist);
            grid.appendChild(btn);
          });
          document.getElementById('popupArtist').classList.remove('hidden');
        }

        async function handleArtistChoice(selectedArtist) {
          document.getElementById('popupArtist').classList.add('hidden');
          const song = gameSongs[currentSongIndex];
          const isCorrect = song.artist.toLowerCase() === selectedArtist.toLowerCase();
          const points = isCorrect ? 50 : -50;
          await sendResult(points, isCorrect, song.artist, 0);
        }

        // ===== Popup date =====
        function showDatePopup() {
          const eras = [
            { label: 'Avant 1980', min: 1900, max: 1979 },
            { label: '1980-2000', min: 1980, max: 1999 },
            { label: '2000-2010', min: 2000, max: 2009 },
            { label: '2010-2020', min: 2010, max: 2019 },
            { label: 'Après 2020', min: 2020, max: 2030 }
          ];
          const grid = document.getElementById('dateGrid');
          grid.innerHTML = '';
          eras.forEach(era => {
            const btn = document.createElement('button');
            btn.className = 'choice-btn';
            btn.textContent = era.label;
            btn.onclick = () => handleDateChoice(era);
            grid.appendChild(btn);
          });
          document.getElementById('popupDate').classList.remove('hidden');
        }

        async function handleDateChoice(selectedEra) {
          document.getElementById('popupDate').classList.add('hidden');
          // Pour cet exemple, on n'a pas l'année, on simule
          const songYear = 2015; // À remplacer par une vraie donnée
          const isCorrect = songYear >= selectedEra.min && songYear <= selectedEra.max;
          const points = isCorrect ? 50 : -50;
          await sendResult(points, isCorrect, selectedEra.label, 0);
        }

        // ===== Envoi du résultat =====
        async function sendResult(points, isCorrect, correctInfo, elapsed) {
          scores[clientId] = (scores[clientId] || 0) + points;
          let attempts = playerAttempts[clientId] || { attemptsLeft: maxAttempts, cooldownUntil: 0, attemptCount: 0 };
          const now = Date.now();

          const updates = {
            scores: scores,
            answerResult: { playerId: clientId, correct: isCorrect, points, correctInfo, playerName: playerName },
            buzzer: null
          };

          if (isCorrect) {
            // Bonne réponse : la manche est terminée, plus personne ne peut buzzer,
            // et le chrono s'arrête tout de suite (pas besoin d'attendre que
            // l'hôte clique sur Révéler).
            attempts.attemptsLeft = 0;
            attempts.cooldownUntil = 0;
            updates.buzzerLocked = true;
            updates.reopenAt = 0;
            updates.roundActive = false;
          } else {
            // Mauvaise réponse : cooldown perso escaladé (3s, 5s, 7s...) + 3s de blocage
            // global avant que quiconque (y compris les autres) puisse retenter sa chance.
            if (maxAttempts > 0) {
              attempts.attemptsLeft = Math.max(0, attempts.attemptsLeft - 1);
              attempts.attemptCount = (attempts.attemptCount || 0) + 1;
              attempts.cooldownUntil = now + getCooldown(attempts.attemptCount);
            }
            updates.reopenAt = now + 3000;
          }

          playerAttempts[clientId] = attempts;
          updates.playerAttempts = playerAttempts;

          await gameStateRef.update(updates);

          // Afficher la popup de résultat
          const popup = document.getElementById('popupResult');
          const titleEl = document.getElementById('resultTitle');
          const msgEl = document.getElementById('resultMessage');
          if (isCorrect) {
            titleEl.textContent = '🎉 Bravo !';
            msgEl.innerHTML = `+${points} points`;
          } else {
            // On ne révèle jamais le titre à un joueur qui s'est trompé
            titleEl.textContent = '❌ Faux !';
            msgEl.innerHTML = `-50 points`;
          }
          popup.classList.remove('hidden');
          setTimeout(() => popup.classList.add('hidden'), 3000);
        }
      }
    })();
  </script>
