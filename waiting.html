<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En attente · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .waiting-room {
      background: #1e2a36;
      border-radius: 2rem;
      padding: 2rem;
      text-align: center;
    }
    .progress-list {
      margin-top: 1.5rem;
      text-align: left;
      background: #0f1419;
      border-radius: 1.5rem;
      padding: 1.5rem;
    }
    .progress-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.8rem 0;
      border-bottom: 1px solid #2a323a;
    }
    .progress-item:last-child {
      border-bottom: none;
    }
    .ready-badge {
      background: #2f7740;
      color: white;
      padding: 0.2rem 0.8rem;
      border-radius: 60px;
      font-size: 0.9rem;
    }
    .not-ready-badge {
      background: #77402f;
      color: white;
      padding: 0.2rem 0.8rem;
      border-radius: 60px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div id="app">
    <h1>⏳ En attente des autres joueurs</h1>
    <div class="waiting-room">
      <div id="waitingMessage" style="margin-bottom:1rem;">
        Certains joueurs n'ont pas encore choisi leur chanson...
      </div>
      <div id="waitingProgress" class="progress-list">
        <!-- Rempli dynamiquement -->
      </div>
      <div style="margin-top:2rem;">
        <button id="refreshBtn" class="primary">🔄 Actualiser</button>
      </div>
    </div>
    <p style="text-align:center; margin-top:1.5rem;">
      <a href="index.html" style="color:#8aaec0;">← Annuler la partie</a>
    </p>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Nos scripts -->
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script>
    (function() {
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost;

      if (!roomCode) {
        window.location.href = 'index.html';
        return;
      }

      const roomRef = db.ref('rooms/' + roomCode);
      const selectionsRef = roomRef.child('selections');
      const playersRef = roomRef.child('players');

      const waitingProgress = document.getElementById('waitingProgress');
      const waitingMessage = document.getElementById('waitingMessage');
      let alreadyMerged = false;
      let redirecting = false;

      // Étape manquante qui causait tous les bugs de jeu : personne ne
      // fusionnait jamais les sélections (hôte + joueurs) dans
      // gameState.songs. game.html recevait donc toujours un tableau vide.
      async function mergeSelectionsIntoGameState(selections, playerList) {
        if (alreadyMerged) return;
        alreadyMerged = true;

        if (isHost) {
          const configSnap = await roomRef.child('config').once('value');
          const config = configSnap.val() || {};

          let allSongs = [];
          if (selections.host && Array.isArray(selections.host.songs)) {
            allSongs = allSongs.concat(selections.host.songs);
          }
          playerList.forEach(p => {
            const sel = selections[p.id];
            if (sel && Array.isArray(sel.songs)) {
              allSongs = allSongs.concat(sel.songs);
            }
          });

          // Mélange l'ordre des chansons (Fisher-Yates)
          for (let i = allSongs.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            const tmp = allSongs[i]; allSongs[i] = allSongs[j]; allSongs[j] = tmp;
          }

          const scores = {};
          playerList.forEach(p => { scores[p.id] = 0; });

          // On copie aussi les réglages de config.html dans gameState :
          // game.html les lit depuis gameState, pas depuis config, et ils
          // n'y étaient jamais recopiés (mode/essais/flou restaient toujours
          // sur leur valeur par défaut, peu importe ce que l'hôte choisissait).
          await roomRef.child('gameState').update({
            songs: allSongs,
            currentSongIndex: 0,
            scores: scores,
            playerAttempts: {},
            buzzer: null,
            buzzerLocked: false,
            reopenAt: 0,
            roundActive: false,
            roundStartTime: 0,
            mode: config.mode || 'classic',
            maxAttempts: (config.maxAttempts !== undefined) ? config.maxAttempts : 3,
            blurEnabled: !!config.blurEnabled,
            lockOthersOnBuzz: (config.lockOthersOnBuzz !== undefined) ? config.lockOthersOnBuzz : true
          });
        }
      }

      // Que ce soit l'hôte ou un joueur, on attend que gameState.songs soit
      // réellement rempli avant de rediriger, pour ne jamais arriver sur
      // game.html avec un tableau vide (course entre l'écriture de l'hôte
      // et la redirection des joueurs).
      async function waitForSongsThenRedirect() {
        if (redirecting) return;
        redirecting = true;
        waitingMessage.innerHTML = '✅ Tout le monde est prêt ! Préparation de la partie...';
        for (let i = 0; i < 15; i++) {
          const snap = await roomRef.child('gameState/songs').once('value');
          const songs = snap.val();
          if (Array.isArray(songs) && songs.length > 0) {
            window.location.href = 'game.html';
            return;
          }
          await new Promise(r => setTimeout(r, 400));
        }
        // Filet de sécurité au cas où : on y va quand même après ~6s
        window.location.href = 'game.html';
      }

      function updateProgress() {
        // Récupérer les joueurs
        playersRef.once('value').then(playersSnap => {
          const players = playersSnap.val() || {};
          const playerList = Object.entries(players).map(([id, data]) => ({ id, ...data }));

          // Récupérer les sélections
          selectionsRef.once('value').then(async selectionsSnap => {
            const selections = selectionsSnap.val() || {};

            // Vérifier si l'hôte a terminé
            const hostDone = selections.host && selections.host.done === true;

            // Pour chaque joueur, vérifier s'il a terminé
            let allReady = hostDone;
            let html = '';

            // Ligne pour l'hôte
            html += `<div class="progress-item">
              <span>🎤 Hôte</span>
              <span class="${hostDone ? 'ready-badge' : 'not-ready-badge'}">
                ${hostDone ? '✅ Prêt' : '⏳ En cours...'}
              </span>
            </div>`;

            // Lignes pour chaque joueur
            playerList.forEach(player => {
              const playerDone = selections[player.id] && selections[player.id].done === true;
              if (playerDone && allReady !== false) allReady = allReady && true; // tout va bien
              else allReady = false; // au moins un pas prêt

              html += `<div class="progress-item">
                <span>${player.avatar} ${player.name}</span>
                <span class="${playerDone ? 'ready-badge' : 'not-ready-badge'}">
                  ${playerDone ? '✅ Prêt' : '⏳ En cours...'}
                </span>
              </div>`;
            });

            waitingProgress.innerHTML = html;

            // Si tout le monde est prêt (hôte + tous les joueurs), on fusionne
            // les sélections puis on passe à la page de jeu
            if (hostDone && playerList.every(p => selections[p.id] && selections[p.id].done)) {
              await mergeSelectionsIntoGameState(selections, playerList);
              waitForSongsThenRedirect();
            } else {
              waitingMessage.innerHTML = '⏳ En attente des joueurs...';
            }
          });
        });
      }

      // Mise à jour immédiate
      updateProgress();

      // Mise à jour périodique toutes les 2 secondes
      setInterval(updateProgress, 2000);

      // Bouton actualiser manuel
      document.getElementById('refreshBtn').addEventListener('click', updateProgress);
    })();
  </script>
</body>
</html>
