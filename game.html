<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Partie · Blind Test</title>
<link rel="stylesheet" href="css/style.css">
<style>
  #app { max-width: 620px; }
  .g-top { display:flex; justify-content:space-between; align-items:center; gap:.6rem; margin-bottom:1rem; }
  .g-round { font-weight:800; color:#9fc5ff; }
  .g-pill { background:#0f1a24; border:1px solid #3e5a77; padding:.35rem .9rem; border-radius:60px; font-size:.85rem; white-space:nowrap; }
  .g-exit { background:none; border:none; width:auto; margin:0; padding:.2rem .4rem; font-size:1.2rem; }

  .cover-wrap { width:190px; height:190px; margin:0 auto 1rem; position:relative; }
  .vinyl-disc {
    position:absolute; inset:0; border-radius:50%;
    background: repeating-radial-gradient(circle at 50% 50%, #1b232c 0, #1b232c 3px, #131a21 3px, #131a21 6px);
    box-shadow: 0 10px 28px rgba(0,0,0,.55), inset 0 0 0 1px #2d3d4e;
  }
  .cover-wrap::after {
    content:''; position:absolute; left:50%; top:50%; width:12px; height:12px; z-index:2;
    background:#0a0c0e; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px #384a5c;
  }
  .cover-wrap img {
    position:absolute; left:50%; top:50%; width:58%; height:58%; transform:translate(-50%,-50%);
    object-fit:cover; border-radius:50%; border:3px solid #10161d; background:#0f1a24;
  }
  .cover-wrap.spin { animation: slowspin 22s linear infinite; }
  @keyframes slowspin { to { transform: rotate(360deg); } }

  .timer-big { margin:.6rem 0 1rem; }
  .lyrics-box { background:#0f1a24; border:1px solid #3e5a77; border-radius:1.2rem; padding:1.2rem;
                font-size:1.3rem; font-weight:700; line-height:1.7; text-align:center; min-height:5rem; margin:1rem 0; }
  .lyrics-box .w { opacity:.15; transition:opacity .25s; }
  .lyrics-box .w.on { opacity:1; color:#d4ffb0; }

  .buzz-banner { background:#5a1e1e; border:2px solid #ff6b6b; border-radius:1.2rem;
                 padding:.9rem; text-align:center; font-weight:800; font-size:1.1rem; margin:.8rem 0;
                 animation: pulse .7s ease infinite alternate; }
  @keyframes pulse { to { transform: scale(1.03); } }

  .reveal-card { display:flex; gap:1rem; align-items:center; text-align:left;
                 background:#12321f; border:2px solid #4fd97f; border-radius:1.2rem; padding:1rem; margin:1rem 0; }
  .reveal-card img { width:70px; height:70px; border-radius:1rem; object-fit:cover; }
  .reveal-card .t { font-weight:800; font-size:1.1rem; }
  .reveal-card .a { color:#8aaec0; }
  .reveal-card .o { color:#9fc5ff; font-size:.85rem; margin-top:.2rem; }

  .feed { background:#0f1a24; border-radius:1rem; padding:.6rem .9rem; max-height:150px; overflow-y:auto;
          font-size:.88rem; margin:1rem 0; }
  .feed div { padding:.3rem 0; border-bottom:1px solid #1d2b38; }
  .feed div:last-child { border-bottom:none; }
  .ok { color:#4fd97f; } .ko { color:#ff8b8b; } .mut { color:#8aaec0; }

  .board { background:#0f1a24; border-radius:1.2rem; padding:.6rem 1rem; }
  .board .row { display:flex; justify-content:space-between; align-items:center; padding:.5rem 0;
                border-bottom:1px solid #1d2b38; transition: transform .4s ease; }
  .board .row:last-child { border-bottom:none; }
  .board .row.me { color:#d4ffb0; font-weight:700; }
  .board .pts { font-weight:800; color:#9fc5ff; }

  .btn-row { display:flex; gap:.6rem; }
  .btn-row button { margin:.5rem 0; }
  #btnReveal.armed { background:#2f7740; border-color:#4fd97f; }

  .vote-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:.6rem; margin:1rem 0; }
  .vote-grid button { margin:0; padding:1.1rem .6rem; font-size:1rem; }
  .vote-grid button.picked { background:#3b6eff; border-color:#9fc5ff; }

  .answer-row { display:flex; gap:.5rem; align-items:center; }
  .answer-row input { border-radius:60px; margin:0; }
  .answer-row button { width:auto; padding:.85rem 1.3rem; margin:0; white-space:nowrap; }
  .note { color:#8aaec0; font-size:.9rem; text-align:center; margin:.5rem 0; }

  .flash { position:fixed; inset:0; background:rgba(255,80,80,.35); z-index:2000;
           display:flex; align-items:center; justify-content:center; font-size:2rem; font-weight:900;
           pointer-events:none; animation: fadeout 1.1s forwards; }
  @keyframes fadeout { 0%{opacity:1} 100%{opacity:0} }
</style>
</head>
<body>
<div id="app">

  <div class="g-top">
    <span class="g-round" id="roundInfo">Manche –</span>
    <span class="g-pill hidden" id="scorePill">0 pts</span>
    <button class="g-exit" id="btnExit" title="Quitter">📲</button>
  </div>

  <div class="cover-wrap" id="coverWrap"><div class="vinyl-disc"></div><img id="cover" alt="cover"></div>
  <div class="timer-big" id="timer">00:00.0</div>

  <div class="lyrics-box hidden" id="lyricsBox"></div>

  <div class="buzz-banner hidden" id="buzzBanner"></div>
  <div class="reveal-card hidden" id="revealCard">
    <img id="rvArt" alt="cover">
    <div>
      <div class="t" id="rvTitle"></div>
      <div class="a" id="rvArtist"></div>
      <div class="o" id="rvOwner"></div>
    </div>
  </div>

  <!-- ===== HÔTE ===== -->
  <div id="hostZone" class="hidden">
    <div class="btn-row">
      <button class="primary" id="btnPlay">▶️ Lancer l'extrait</button>
      <button id="btnReveal">👁️ Révéler</button>
      <button id="btnReplay" class="hidden">🔁 Recommencer</button>
    </div>
    <button id="btnNext" class="hidden">➡️ Chanson suivante</button>
    <p class="note" id="hostHint"></p>
  </div>

  <!-- ===== JOUEUR ===== -->
  <div id="playerZone" class="hidden">
    <button class="buzzer-btn" id="btnBuzz">BUZZ</button>

    <div id="answerZone" class="hidden">
      <div class="answer-row">
        <input type="text" id="answerInput" placeholder="Titre de la chanson…" autocomplete="off" spellcheck="false">
        <button class="primary" id="btnAnswer">OK</button>
      </div>
    </div>

    <div id="voteZone" class="hidden">
      <p class="note">À qui appartient cette chanson ?</p>
      <div class="vote-grid" id="voteGrid"></div>
    </div>

    <p class="note" id="playerStatus"></p>
  </div>

  <div class="feed" id="feed"><div class="mut">La partie commence…</div></div>
  <div class="board" id="board"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/utils.js"></script>
<script src="js/state.js"></script>
<script src="js/audio-engine.js"></script>
<script>
(function () {
  const roomCode = AppState.roomCode;
  const isHost   = AppState.isHost === true;
  const clientId = AppState.clientId;
  const myName   = AppState.playerName || 'Joueur';
  if (!roomCode || !clientId) { location.href = 'index.html'; return; }

  const roomRef = db.ref('rooms/' + roomCode);
  const gsRef   = roomRef.child('gameState');

  const $ = id => document.getElementById(id);
  const el = {
    roundInfo:$('roundInfo'), scorePill:$('scorePill'), btnExit:$('btnExit'),
    coverWrap:$('coverWrap'), cover:$('cover'), timer:$('timer'), lyricsBox:$('lyricsBox'),
    buzzBanner:$('buzzBanner'), revealCard:$('revealCard'), rvArt:$('rvArt'), rvTitle:$('rvTitle'),
    rvArtist:$('rvArtist'), rvOwner:$('rvOwner'),
    hostZone:$('hostZone'), btnPlay:$('btnPlay'), btnReveal:$('btnReveal'), btnReplay:$('btnReplay'),
    btnNext:$('btnNext'), hostHint:$('hostHint'),
    playerZone:$('playerZone'), btnBuzz:$('btnBuzz'), answerZone:$('answerZone'), answerInput:$('answerInput'),
    btnAnswer:$('btnAnswer'), voteZone:$('voteZone'), voteGrid:$('voteGrid'), playerStatus:$('playerStatus'),
    feed:$('feed'), board:$('board')
  };

  const LYRICS_MS  = { slow:1400, medium:900, fast:550 };
  const BLANK = 'data:image/svg+xml,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200"><rect width="200" height="200" fill="#0f1a24"/><text x="100" y="118" font-size="70" text-anchor="middle">🎵</text></svg>');

  let gs = {}, players = {}, songs = [], song = null, idx = -1;
  let phase = 'idle', mode = 'classic';
  let timerInt = null, blurRaf = null, lyricsInt = null, playedIndex = -1;
  let lastFlashAt = 0, lastPhase = null;

  el.cover.src = BLANK;
  (isHost ? el.hostZone : el.playerZone).classList.remove('hidden');
  if (!isHost) el.scorePill.classList.remove('hidden');

  /* ------------------------------------------------------------------ */
  /*  Écoute temps réel                                                  */
  /* ------------------------------------------------------------------ */
  roomRef.child('players').on('value', s => { players = s.val() || {}; render(); });

  gsRef.on('value', s => {
    gs = s.val() || {};
    if (gs.finished) { AudioEngine.stopAudio(); location.href = 'podium.html'; return; }

    songs = gs.songs || [];
    mode  = gs.mode || 'classic';
    const newIdx = gs.currentSongIndex || 0;
    if (newIdx !== idx) { idx = newIdx; onNewSong(); }
    song  = songs[idx] || null;
    phase = gs.phase || 'idle';

    render();
  });

  function onNewSong() {
    stopAllTimers();
    AudioEngine.stopAudio();
    playedIndex = -1;
    el.answerInput.value = '';
    el.lyricsBox.innerHTML = '';
    el.revealCard.classList.add('hidden');
    if (songs[idx + 1]) AudioEngine.preloadSong(songs[idx + 1]);
  }

  function stopAllTimers() {
    [timerInt, lyricsInt].forEach(t => t && clearInterval(t));
    timerInt = lyricsInt = null;
    if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
    el.coverWrap.classList.remove('spin');
  }

  /* ------------------------------------------------------------------ */
  /*  Rendu                                                              */
  /* ------------------------------------------------------------------ */
  function isMySong(s) {
    if (!s) return false;
    if (s.ownerIds) return s.ownerIds.includes(clientId);
    return s.ownerId === clientId;
  }

  function ownerNames(s) {
    if (!s) return '';
    if (s.ownerNames) return s.ownerNames.join(' & ');
    return s.ownerName || "l'hôte";
  }

  function render() {
    if (!songs.length) { el.roundInfo.textContent = 'Chargement…'; return; }
    el.roundInfo.textContent = `Manche ${idx + 1} / ${songs.length}`;
    el.scorePill.textContent = ((gs.scores || {})[clientId] || 0) + ' pts';

    // Pochette
    const revealed = phase === 'revealed';
    if (revealed) {
      if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
      el.cover.src = song && song.artwork ? song.artwork : BLANK;
      el.cover.style.transition = 'filter .5s ease';
      el.cover.style.filter = 'none';
    } else if (phase === 'idle') {
      el.cover.src = BLANK;
      el.cover.style.transition = 'none';
      el.cover.style.filter = 'none';
    }

    // Phase changée ?
    if (phase !== lastPhase) { lastPhase = phase; onPhaseChange(); }

    renderTimer();
    renderBuzz();
    renderReveal();
    renderFeed();
    renderBoard();
    if (isHost) renderHost(); else renderPlayer();
  }

  function onPhaseChange() {
    stopAllTimers();
    if (phase === 'playing') {
      el.coverWrap.classList.add('spin');
      if (mode !== 'lyrics') startBlur();
      if (mode === 'lyrics') startLyrics();
      timerInt = setInterval(renderTimer, 100);
    } else {
      AudioEngine.stopAudio();
      if (phase === 'revealed' && mode === 'lyrics') showAllLyrics();
    }
  }

  function renderTimer() {
    if (phase === 'playing' && gs.roundStartTime) {
      el.timer.textContent = formatTimer(Date.now() - gs.roundStartTime);
    } else if (phase === 'idle') {
      el.timer.textContent = '00:00.0';
    }
  }

  /* --- Flou progressif de la pochette : dégradé en continu (aucun flash,
         aucun palier brusque), plus lent en mode Paroles --- */
  function startBlur() {
    if (!gs.blurEnabled || !song || !song.artwork) { el.cover.src = BLANK; return; }
    const MAX_BLUR = 24;
    const totalMs = (mode === 'lyrics' ? 16000 : 11000);

    const img = new Image();
    img.onload = () => {
      if (phase !== 'playing') return;              // la manche a déjà changé entre-temps
      el.cover.style.transition = 'none';
      el.cover.style.filter = `blur(${MAX_BLUR}px)`;
      el.cover.src = song.artwork;                    // déjà en cache : aucun flash à sharp
      const start = performance.now();
      const tick = (now) => {
        const t = Math.min(1, (now - start) / totalMs);
        el.cover.style.filter = `blur(${(MAX_BLUR * (1 - t)).toFixed(1)}px)`;
        blurRaf = t < 1 ? requestAnimationFrame(tick) : null;
      };
      blurRaf = requestAnimationFrame(tick);
    };
    img.src = song.artwork;
  }

  /* --- Mode Paroles : révélation mot à mot --- */
  function startLyrics() {
    if (!song || !song.lyricsSnippet) return;
    el.lyricsBox.classList.remove('hidden');
    const words = song.lyricsSnippet.split(/\s+/).filter(Boolean);
    el.lyricsBox.innerHTML = words.map(w => {
      const shown = gs.lyricsSkipWords && w.length > 3
        ? w[0] + '•'.repeat(w.length - 2) + w[w.length - 1] : w;
      return `<span class="w">${escapeHTML(shown)}</span>`;
    }).join(' ');
    const spans = el.lyricsBox.querySelectorAll('.w');
    let i = 0;
    const tick = () => {
      if (i >= spans.length) { clearInterval(lyricsInt); lyricsInt = null; return; }
      spans[i].classList.add('on');
      if (isHost) AudioEngine.playBeep(380 + i * 12);
      i++;
    };
    tick();
    lyricsInt = setInterval(tick, LYRICS_MS[gs.lyricsSpeed] || 1400);
  }

  function showAllLyrics() {
    if (mode !== 'lyrics') return;
    el.lyricsBox.querySelectorAll('.w').forEach(s => s.classList.add('on'));
  }

  /* --- Bandeau de buzz --- */
  function renderBuzz() {
    const b = gs.buzzer;
    if (b && phase === 'playing') {
      el.buzzBanner.classList.remove('hidden');
      el.buzzBanner.textContent = `🔔 ${b.name} a buzzé !`;
      if (b.at && b.at > lastFlashAt) { lastFlashAt = b.at; flash(`🔔 ${b.name}`); }
    } else {
      el.buzzBanner.classList.add('hidden');
    }
  }

  function flash(text) {
    const d = document.createElement('div');
    d.className = 'flash';
    d.textContent = text;
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 1100);
  }

  function renderReveal() {
    if (phase !== 'revealed' || !song) { el.revealCard.classList.add('hidden'); return; }
    el.revealCard.classList.remove('hidden');
    el.rvArt.src = song.artwork || BLANK;
    el.rvTitle.textContent  = song.title || '';
    el.rvArtist.textContent = song.artist || '';
    el.rvOwner.textContent  = '🎧 Proposée par ' + ownerNames(song);
  }

  function renderFeed() {
    const items = Object.values(gs.feed || {}).sort((a, b) => a.at - b.at).slice(-8).reverse();
    if (!items.length) { el.feed.innerHTML = '<div class="mut">En attente…</div>'; return; }
    el.feed.innerHTML = items.map(f =>
      `<div class="${f.ok ? 'ok' : f.ok === false ? 'ko' : 'mut'}">${escapeHTML(f.text)}</div>`).join('');
  }

  function renderBoard() {
    const scores = gs.scores || {};
    const rows = Object.entries(players)
      .map(([id, p]) => ({ id, name: p.name, avatar: p.avatar || '🎧', pts: scores[id] || 0 }))
      .sort((a, b) => b.pts - a.pts);
    el.board.innerHTML = rows.map((r, i) =>
      `<div class="row ${r.id === clientId ? 'me' : ''}"><span>${i + 1}. ${r.avatar} ${escapeHTML(r.name)}</span><span class="pts">${r.pts}</span></div>`
    ).join('') || '<div class="mut">Aucun joueur</div>';
  }

  /* ------------------------------------------------------------------ */
  /*  Vue HÔTE                                                           */
  /* ------------------------------------------------------------------ */
  function renderHost() {
    el.btnPlay.classList.toggle('hidden', phase !== 'idle');
    el.btnReveal.classList.toggle('hidden', phase !== 'playing');
    el.btnReplay.classList.toggle('hidden', phase !== 'playing' || mode === 'lyrics');
    el.btnNext.classList.toggle('hidden', phase !== 'revealed');
    el.btnReveal.classList.toggle('armed', !!gs.solved);

    if (phase === 'idle')      el.hostHint.textContent = "Appuie sur ▶️ quand tout le monde est prêt.";
    else if (phase === 'playing') el.hostHint.textContent = mode === 'playlist'
        ? `Votes : ${Object.keys(gs.votes || {}).length} / ${votersFor(song).length}`
        : (gs.solved ? '✅ Bonne réponse trouvée — tu peux révéler.' : 'Manche en cours…');
    else el.hostHint.textContent = idx + 1 >= songs.length ? 'Dernière chanson — passe au podium !' : '';

    if (phase === 'revealed' && idx + 1 >= songs.length) el.btnNext.textContent = '🏆 Voir le podium';
    else el.btnNext.textContent = '➡️ Chanson suivante';

    // L'extrait s'arrête dès qu'un joueur buzze
    if (phase === 'playing' && gs.buzzer && mode !== 'lyrics') {
      AudioEngine.stopAudio();
      playedIndex = -1;                     // l'extrait reprendra si la réponse est fausse
    }

    // Lecture du son (hôte uniquement)
    const roundOver = gs.solved && !gs.multipleCorrectAllowed;
    if (phase === 'playing' && !gs.buzzer && !roundOver && playedIndex !== idx && mode !== 'lyrics') {
      playedIndex = idx;
      AudioEngine.playAudioClip(song).then(ok => {
        if (!ok) el.hostHint.textContent = '⚠️ Audio indisponible pour cette chanson.';
      });
    }
  }

  el.btnPlay.onclick = async () => {
    if (!song) return;
    AudioEngine.unlockAudio();
    await gsRef.update({
      phase: 'playing', roundStartTime: Date.now(),
      buzzer: null, votes: null, solved: false, solvedBy: null, attempts: null, feed: null
    });
  };

  el.btnReveal.onclick = async () => {
    AudioEngine.stopAudio();
    if (mode === 'playlist') await scorePlaylistVotes();
    await gsRef.update({ phase: 'revealed', buzzer: null });
  };

  // Rejoue l'extrait depuis le début, sans toucher au buzzer ni aux scores
  el.btnReplay.onclick = async () => {
    if (!song) return;
    AudioEngine.stopAudio();
    AudioEngine.playAudioClip(song);
    if (blurRaf) { cancelAnimationFrame(blurRaf); blurRaf = null; }
    if (mode !== 'lyrics') startBlur();
    await gsRef.update({ roundStartTime: Date.now() });
  };

  el.btnNext.onclick = async () => {
    if (idx + 1 >= songs.length) { await gsRef.update({ finished: true }); return; }
    await gsRef.update({
      currentSongIndex: idx + 1, phase: 'idle', buzzer: null,
      votes: null, solved: false, solvedBy: null, attempts: null, feed: null, roundStartTime: 0
    });
  };

  // Attribution des points du mode Playlist (fait par l'hôte à la révélation)
  async function scorePlaylistVotes() {
    const fresh = (await gsRef.once('value')).val() || {};   // lecture fraîche : tous les votes
    const votes = fresh.votes || {};
    const owners = song.ownerIds || (song.ownerId ? [song.ownerId] : []);
    const updates = {};
    const scores = Object.assign({}, fresh.scores || {});
    Object.entries(votes).forEach(([voter, v]) => {
      const good = owners.includes(v.guess);
      if (good) scores[voter] = (scores[voter] || 0) + points(v.at - (fresh.roundStartTime || v.at));
      pushFeed(`${good ? '✅' : '❌'} ${nameOf(voter)} → ${nameOf(v.guess)}`, good, updates);
    });
    updates['scores'] = scores;
    await gsRef.update(updates);
  }

  /* ------------------------------------------------------------------ */
  /*  Vue JOUEUR                                                         */
  /* ------------------------------------------------------------------ */
  function votersFor(s) {
    const owners = s ? (s.ownerIds || (s.ownerId ? [s.ownerId] : [])) : [];
    return Object.keys(players).filter(id => !owners.includes(id));
  }

  function renderPlayer() {
    const mine   = isMySong(song);
    const isVote = mode === 'playlist';
    const buzzer = gs.buzzer;
    const iHold  = buzzer && buzzer.id === clientId;
    const maxA   = gs.maxAttempts === undefined ? 3 : gs.maxAttempts;
    const used   = ((gs.attempts || {})[clientId]) || 0;
    const out    = maxA > 0 && used >= maxA;
    const solvedByMe = !!(gs.solvedBy || {})[clientId];

    el.btnBuzz.classList.toggle('hidden', isVote || phase !== 'playing');
    el.voteZone.classList.toggle('hidden', !isVote || phase !== 'playing' || mine);
    el.answerZone.classList.toggle('hidden', !iHold || phase !== 'playing');

    if (phase === 'idle') {
      el.playerStatus.textContent = mine ? "🤫 C'est ta chanson — laisse deviner !" : '⏳ En attente du lancement…';
      return;
    }
    if (phase === 'revealed') {
      el.playerStatus.textContent = '👀 Réponse révélée.';
      return;
    }

    // phase playing
    if (isVote) {
      if (mine) { el.playerStatus.textContent = "🤫 C'est ta chanson — tu ne votes pas."; return; }
      renderVoteGrid();
      const v = (gs.votes || {})[clientId];
      el.playerStatus.textContent = v ? `✅ Vote enregistré : ${nameOf(v.guess)}` : 'Choisis un joueur !';
      return;
    }

    let disabled = false, msg = '';
    if (mine)                    { disabled = true; msg = "🤫 C'est ta chanson — laisse deviner !"; }
    else if (solvedByMe)         { disabled = true; msg = '✅ Tu as déjà trouvé !'; }
    else if (out)                { disabled = true; msg = '🚫 Plus de tentatives pour cette manche.'; }
    else if (iHold)              { disabled = true; msg = '🎤 À toi ! Tape le titre.'; }
    else if (buzzer)             { disabled = !!gs.lockOthersOnBuzz; msg = `🔔 ${buzzer.name} répond…`; }
    else if (gs.solved && !gs.multipleCorrectAllowed) { disabled = true; msg = '✅ Déjà trouvé par quelqu\'un.'; }
    else                         { msg = maxA > 0 ? `${maxA - used} tentative(s) restante(s)` : 'Buzze dès que tu sais !'; }

    el.btnBuzz.disabled = disabled;
    el.playerStatus.textContent = msg;
    if (iHold && document.activeElement !== el.answerInput) el.answerInput.focus();
  }

  function renderVoteGrid() {
    const v = (gs.votes || {})[clientId];
    el.voteGrid.innerHTML = Object.keys(players).map(id =>
      `<button data-id="${id}" class="${v && v.guess === id ? 'picked' : ''}" ${v ? 'disabled' : ''}>${players[id].avatar || '🎧'} ${escapeHTML(players[id].name)}</button>`
    ).join('');
    el.voteGrid.querySelectorAll('button').forEach(b => {
      b.onclick = () => gsRef.child('votes/' + clientId).set({ guess: b.dataset.id, at: Date.now() });
    });
  }

  /* --- Buzzer : transaction, premier arrivé premier servi --- */
  el.btnBuzz.onclick = () => {
    if (el.btnBuzz.disabled) return;
    el.btnBuzz.disabled = true;
    gsRef.child('buzzer').transaction(cur => (cur === null ? { id: clientId, name: myName, at: Date.now() } : undefined));
  };

  /* --- Réponse --- */
  el.answerInput.addEventListener('keydown', e => { if (e.key === 'Enter') el.btnAnswer.click(); });
  el.btnAnswer.onclick = async () => {
    const raw = el.answerInput.value.trim();
    if (!raw || !song) return;
    el.answerInput.value = '';
    const good = matches(raw, song.title);
    const fresh = (await gsRef.once('value')).val() || {};   // lecture fraîche : scores à jour
    const elapsed = Date.now() - (fresh.roundStartTime || Date.now());
    const used = (((fresh.attempts || {})[clientId]) || 0) + 1;

    const updates = { buzzer: null };
    const scores = Object.assign({}, fresh.scores || {});
    if (good) {
      let pts = points(elapsed);
      if (mode === 'instrumental') pts = Math.round(pts * 1.5);
      scores[clientId] = (scores[clientId] || 0) + pts;
      updates['solved'] = true;
      updates['solvedBy/' + clientId] = true;
      pushFeed(`✅ ${myName} : "${raw}" (+${pts})`, true, updates);
    } else {
      const penalty = used <= 1 ? 10 : 20;
      scores[clientId] = (scores[clientId] || 0) - penalty;
      updates['attempts/' + clientId] = used;
      pushFeed(`❌ ${myName} : "${raw}" (−${penalty})`, false, updates);
    }
    updates['scores'] = scores;
    await gsRef.update(updates);
  };

  /* ------------------------------------------------------------------ */
  /*  Helpers                                                            */
  /* ------------------------------------------------------------------ */
  function points(elapsedMs) {
    const s = Math.max(0, elapsedMs) / 1000;
    let p;
    if (s <= 3) p = 100;
    else if (s <= 5) p = 100 - (s - 3) * 10;
    else p = 80 - (s - 5) * 5;
    return Math.max(20, Math.round(p));
  }

  function cleanTitle(t) {
    return normalize(String(t || '').replace(/\(.*?\)|\[.*?\]|(-|–)\s*(remaster|live|radio|single|version|feat).*$/gi, ''));
  }

  function matches(input, target) {
    const a = normalize(input), b = cleanTitle(target), full = normalize(target);
    if (!a) return false;
    if (a === b || a === full) return true;
    if (a.length >= 4 && (b.includes(a) || full.includes(a)) && a.length >= b.length * 0.6) return true;
    if (b.length >= 4 && a.includes(b)) return true;
    return false;
  }

  function nameOf(id) { return players[id] ? players[id].name : (id === 'host' ? "l'hôte" : '?'); }

  function pushFeed(text, ok, updates) {
    updates['feed/' + Date.now() + Math.floor(Math.random() * 999)] = { text, ok, at: Date.now() };
  }

  function escapeHTML(s) {
    return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
  }

  /* --- Sortie --- */
  el.btnExit.onclick = async () => {
    if (isHost) {
      if (!confirm('Terminer la partie et revenir au salon ?')) return;
      AudioEngine.stopAudio();
      await roomRef.update({ status: 'lobby' });
      await gsRef.update({ finished: false, phase: 'idle', songs: [] });
      location.href = 'host-lobby.html';
    } else {
      if (!confirm('Quitter la partie ?')) return;
      await roomRef.child('players/' + clientId).remove();
      AppState.clear();
      location.href = 'index.html';
    }
  };

  // Si l'hôte ferme la partie, les joueurs reviennent au salon d'attente
  roomRef.child('status').on('value', s => {
    if (s.val() === 'lobby' && !isHost) location.href = 'waiting.html';
  });
})();
</script>
</body>
</html>
