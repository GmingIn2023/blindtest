<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>Sélection K des chansons · Blind Test</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .selection-header {
      background: linear-gradient(135deg, #2d3748 0%, #1e2530 100%);
      border-left: 6px solid #5e9eff;
      padding: 1.2rem 1.6rem;
      border-radius: 1.5rem;
      margin-bottom: 1.8rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .search-container {
      background: #1c2127;
      border-radius: 1.8rem;
      padding: 1.6rem;
    }
    .search-box {
      display: flex;
      gap: 0.8rem;
    }
    .search-box input[type="text"] {
      flex: 1;
    }
    .results-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-top: 1.5rem;
      max-height: 400px;
      overflow-y: auto;
    }
    .song-card {
      display: flex;
      align-items: center;
      background: #1a1f25;
      padding: 1rem;
      border-radius: 1.2rem;
      border: 2px solid #2d353e;
      cursor: pointer;
      transition: 0.2s;
    }
    .song-card:hover:not(.selected) {
      border-color: #5e9eff;
      transform: translateX(5px);
    }
    .song-card img {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      margin-right: 1.2rem;
      object-fit: cover;
    }
    .song-card.selected {
      border-color: #2f7740;
      background: #1a2420;
      opacity: 0.6;
      pointer-events: none;
    }
    .song-info {
      flex: 1;
    }
    .song-title {
      font-weight: 600;
      margin-bottom: 0.3rem;
    }
    .song-artist {
      color: #8aaec0;
      font-size: 0.9rem;
    }
    .counter {
      background: #3b6eff;
      padding: 0.5rem 1.2rem;
      border-radius: 60px;
    }
    .loading { color: #8aaec0; padding: 0.5rem 0; }
    .error-text { color: #ff6b6b; padding: 0.5rem 0; }

    /* ===== Modale de personnalisation d'extrait ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1000;
    }
    .modal-overlay.hidden { display: none; }
    .modal-box {
      background: #1a1f25;
      border-radius: 1.6rem 1.6rem 0 0;
      padding: 1.6rem;
      width: 100%;
      max-width: 480px;
      max-height: 88vh;
      overflow-y: auto;
    }
    .modal-song-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.2rem;
    }
    .modal-song-info img {
      width: 56px; height: 56px;
      border-radius: 10px;
      object-fit: cover;
    }
    .modal-box label {
      display: block;
      margin-top: 1.1rem;
      margin-bottom: 0.4rem;
      font-size: 0.92rem;
      color: #cfe0ea;
    }
    .modal-box input[type="range"] { width: 100%; }
    .preset-buttons {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.4rem;
    }
    .preset-buttons button {
      flex: 1;
      padding: 0.5rem;
      border-radius: 0.8rem;
      border: 2px solid #2d353e;
      background: #1a1f25;
      color: #fff;
    }
    .preset-buttons button.active {
      border-color: #5e9eff;
      background: #223047;
    }
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1rem;
      font-size: 0.92rem;
    }
    .modal-actions {
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      margin-top: 1.5rem;
    }
    .modal-actions button {
      padding: 0.8rem;
      border-radius: 1rem;
      border: none;
      font-weight: 600;
    }
    #previewBtn { background: #2d353e; color: #fff; }
    #confirmSelectBtn { background: #3b6eff; color: #fff; }
    #cancelSelectBtn { background: transparent; color: #8aaec0; }
    .hint-text { font-size: 0.8rem; color: #8aaec0; margin-top: 0.3rem; }
    .experimental-tag { color: #f5a623; font-size: 0.78rem; }
    .song-added-popup {
      position: fixed;
      top: 16px;
      left: 50%;
      z-index: 1200;
      background: #17301f;
      border: 1px solid #4fd97f;
      border-radius: 1rem;
      padding: 0.7rem 1.2rem;
      text-align: center;
      box-shadow: 0 6px 20px rgba(0,0,0,0.4);
      animation: sapInOut 1.3s ease forwards;
    }
    .song-added-popup.hidden { display: none; }
    .sap-title { font-weight: 700; }
    .sap-options { font-size: 0.8rem; color: #9fe0b5; margin-top: 0.2rem; }
    @keyframes sapInOut {
      0%   { opacity: 0; transform: translate(-50%, -14px); }
      20%  { opacity: 1; transform: translate(-50%, 0); }
      65%  { opacity: 1; transform: translate(-50%, 0); }
      100% { opacity: 0; transform: translate(-50%, -14px); }
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="songAddedPopup" class="song-added-popup hidden">
      <div class="sap-title">✅ <span id="sapSongName"></span> ajoutée !</div>
      <div class="sap-options" id="sapOptions"></div>
    </div>
    <h1>🎵 Sélection des chansons</h1>
    <div id="selection-header" class="selection-header">
      <span id="role-message"></span>
      <span id="counter" class="counter">0 / ?</span>
      <a id="settingsGear" href="config.html?edit=1" class="hidden" title="Modifier les réglages" style="font-size:1.3rem; text-decoration:none;">⚙️</a>
    </div>
    <div class="search-container">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Artiste ou titre..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button id="searchBtn">🔍 Chercher</button>
      </div>
      <div id="errorMsg"></div>
      <div id="results" class="results-grid"></div>
    </div>
    <p style="text-align:center; margin-top:1rem;">
      <a href="#" id="backToLobbyLink" style="color:#8aaec0;">🏠 Retourner à la lobby</a>
    </p>
  </div>

  <!-- Modale de personnalisation de l'extrait -->
  <div id="customizeModal" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-song-info">
        <img id="modalArtwork" src="" alt="cover">
        <div>
          <div id="modalTitle" class="song-title"></div>
          <div id="modalArtist" class="song-artist"></div>
        </div>
      </div>

      <label>⏱️ Durée de l'extrait : <span id="durationValue">10</span>s</label>
      <input type="range" id="durationSlider" min="0.5" max="15" step="0.5" value="10">

      <label>📍 & Position dans l'extrait</label>
      <div class="preset-buttons">
        <button type="button" id="presetStart">⏮️ Début</button>
        <button type="button" id="presetMiddle">⏺️ Milieu</button>
        <button type="button" id="presetEnd">⏭️ Fin</button>
      </div>
      <input type="range" id="positionSlider" min="0" max="0" step="0.5" value="0">
      <div class="hint-text" id="positionHint">Chargement de l'aperçu...</div>

      <div id="reverseControlGroup">
        <label class="checkbox-label">
          <input type="checkbox" id="reverseCheck"> 🔄 Inverser l'extrait (à l'envers)
        </label>
      </div>
      <label class="checkbox-label">
        <input type="checkbox" id="instrumentalCheck">
        🎸 Sans voix
      </label>
      <div id="instrumentalVariants" class="preset-buttons hidden" style="margin-top:0.4rem; flex-wrap:wrap;">
        <button type="button" class="variant-btn" data-variant="1">🎚️ Stéréo</button>
        <button type="button" class="variant-btn" data-variant="2">🎼 Fréquences</button>
        <button type="button" class="variant-btn" data-variant="3">💪 Renforcé</button>
        <button type="button" class="variant-btn" data-variant="4">🔍 Vraie version instru</button>
      </div>
      <div class="hint-text" id="variantHint"></div>
      <div id="variantIntensityGroup" class="hidden" style="margin-top:0.4rem;">
        <label>🎛️ Intensité : <span id="variantIntensityValue">60</span>%</label>
        <input type="range" id="variantIntensitySlider" min="10" max="100" step="5" value="60">
      </div>
      <div id="instrumentalSearchGroup" class="hidden" style="margin-top:0.6rem;">
        <button type="button" id="searchInstrumentalBtn" style="width:100%;">🔍 Chercher une version instrumentale</button>
        <div id="instrumentalResults" style="margin-top:0.5rem;"></div>
      </div>

      <div id="speedControlGroup">
        <label>⚡ Vitesse : <span id="speedValue">1.0x</span></label>
        <input type="range" id="speedSlider" min="0.4" max="2.5" step="0.1" value="1">
      </div>

      <div id="radioControlGroup">
        <label class="checkbox-label">
          <input type="checkbox" id="radioModeCheck">
          📻 Mode Radio / Téléphone
        </label>
      </div>

      <div id="advancedSettingsSection" class="hidden" style="margin-top:0.8rem; border-top:1px solid #2d353e; padding-top:0.6rem;">
        <button type="button" id="advancedToggleBtn" style="background:none; border:none; color:#8aaec0; padding:0; display:flex; align-items:center; gap:0.4rem; cursor:pointer;">
          <span id="advancedToggleArrow">🔽</span> Paramètres avancés
        </button>
        <div id="advancedSettingsContent" class="hidden">
          <label>🎼 Pitch (tonalité) : <span id="pitchValue">0</span> demi-tons <span class="experimental-tag">(expérimental)</span></label>
          <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0">

          <label>🎚️ Filtre fréquences <span class="experimental-tag">(expérimental)</span></label>
          <input type="range" id="filterSlider" min="-100" max="100" step="5" value="0">
          <div class="hint-text" id="filterHint">Neutre</div>
        </div>
      </div>

      <div class="modal-actions">
        <button type="button" id="previewBtn">▶️ Écouter l'extrait</button>
        <button type="button" id="confirmSelectBtn">✅ Choisir cette chanson</button>
        <button type="button" id="cancelSelectBtn">Annuler</button>
      </div>
      <div id="modalError" class="error-text"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
  <script src="js/firebase-init.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/state.js"></script>
  <script>
    (function() {
      const roomCode = AppState.roomCode;
      const isHost = AppState.isHost;
      const clientId = AppState.clientId;
      const playerName = AppState.playerName || 'Joueur';

      if (!roomCode) {
        window.location.href = 'index.html';
        return;
      }

      const roomRef = db.ref('rooms/' + roomCode);
      const selectionsRef = roomRef.child('selections');
      const configRef = roomRef.child('config');

      // "Retour à la lobby" : si l'hôte, on remet la room à zéro (mêmes
      // réglages, même code) et tout le monde est renvoyé au même endroit.
      const backToLobbyLink = document.getElementById('backToLobbyLink');
      if (backToLobbyLink) {
        backToLobbyLink.addEventListener('click', async (e) => {
          e.preventDefault();
          if (isHost) {
            if (!confirm('Retourner à la lobby ? La sélection en cours sera annulée pour tout le monde.')) return;
            await roomRef.update({
              status: 'lobby',
              selections: {},
              gameState: {
                currentSongIndex: 0,
                songs: [],
                scores: {},
                playerAttempts: {},
                buzzer: null,
                buzzerLocked: false,
                reopenAt: 0,
                roundStartTime: 0,
                roundActive: false
              }
            });
            window.location.href = 'host-lobby.html';
          } else {
            window.location.href = 'waiting.html';
          }
        });
      }

      let hostQuota = 0;
      let hostSelected = [];
      let playerSelectedList = [];

      // Si l'hôte retourne à la lobby pendant que d'autres sont encore sur
      // cette page, les joueurs suivent automatiquement (l'hôte navigue
      // déjà lui-même explicitement après son clic, pas besoin ici).
      if (!isHost) {
        roomRef.child('status').on('value', (snap) => {
          if (snap.val() === 'lobby') {
            window.location.href = 'waiting.html';
          }
        });
      }

      const roleMsg = document.getElementById('role-message');
      const counterSpan = document.getElementById('counter');
      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');
      const errorMsg = document.getElementById('errorMsg');
      const resultsDiv = document.getElementById('results');

      let gameMode = 'classic';
      let playerQuota = 1; // 1 chanson en mode normal, 5 en mode Playlist (mini-playlist)
      let advancedSettingsEnabled = false;
      let allowDuplicates = false;

      configRef.once('value', (snap) => {
        const config = snap.val();
        if (config) {
          gameMode = config.mode || 'classic';
          advancedSettingsEnabled = !!config.advancedSettings;
          allowDuplicates = !!config.allowDuplicates;
          playerQuota = gameMode === 'playlist' ? (config.playlistSongsPerPlayer || 5) : 1;

          // En mode Instrumental, on simplifie l'écran principal : vitesse,
          // inversion et radio passent sous "Paramètres avancés" (toujours
          // visible dans ce mode), pour laisser la place aux réglages
          // "sans voix" qui sont le vrai sujet de ce mode.
          if (gameMode === 'instrumental') {
            const advancedContent = document.getElementById('advancedSettingsContent');
            const advancedSection = document.getElementById('advancedSettingsSection');
            const reverseGroup = document.getElementById('reverseControlGroup');
            const speedGroup = document.getElementById('speedControlGroup');
            const radioGroup = document.getElementById('radioControlGroup');
            advancedContent.insertBefore(radioGroup, advancedContent.firstChild);
            advancedContent.insertBefore(speedGroup, advancedContent.firstChild);
            advancedContent.insertBefore(reverseGroup, advancedContent.firstChild);
            advancedSection.classList.remove('hidden');
          }

          if (isHost) {
            if (gameMode === 'playlist') {
              // En mode Playlist, l'hôte ne choisit aucune chanson : ce sont
              // les joueurs qui construisent chacun leur mini-playlist.
              roleMsg.textContent = '🎧 Mode Playlist : en attente des playlists des joueurs...';
              selectionsRef.child('host').set({ songs: [], done: true }).then(() => {
                window.location.href = 'waiting.html';
              });
              return;
            }
            hostQuota = config.hostSongsCount || 0;
            // On restaure ce qui a déjà été choisi (si on revient sur cette
            // page après un rechargement), au lieu de repartir de zéro.
            selectionsRef.child('host').once('value', (selSnap) => {
              const existing = selSnap.val();
              if (existing && Array.isArray(existing.songs)) {
                hostSelected = existing.songs;
              }
              counterSpan.textContent = `${hostSelected.length} / ${hostQuota}`;
              if (hostSelected.length >= hostQuota && hostQuota > 0) {
                window.location.href = 'waiting.html';
              }
            });
          } else {
            if (gameMode === 'playlist') {
              roleMsg.textContent = `🎧 Construis ta playlist : choisis ${playerQuota} chansons que tu aimes`;
            }
            selectionsRef.child(clientId).once('value', (selSnap) => {
              const existing = selSnap.val();
              if (existing && Array.isArray(existing.songs)) {
                playerSelectedList = existing.songs;
              }
              counterSpan.textContent = `${playerSelectedList.length} / ${playerQuota}`;
              if (playerSelectedList.length >= playerQuota) {
                window.location.href = 'waiting.html';
              }
            });
          }
        }
      });

      if (isHost) {
        roleMsg.textContent = '🎤 Hôte : choisis tes chansons';
        const gear = document.getElementById('settingsGear');
        if (gear) gear.classList.remove('hidden');
      } else {
        roleMsg.textContent = '🎵 Joueur : choisis TA chanson (1 seule)';
      }

      // ============================================================
      // RECHERCHE — plusieurs fournisseurs différents en cascade.
      // Deezer est un domaine totalement différent d'Apple : si le
      // blocage vient du réseau/quota côté itunes.apple.com, Deezer
      // n'est pas affecté et prend le relais.
      // ============================================================

      function normalizeItunes(list) {
        return (list || [])
          .map(s => ({
            trackName: s.trackName,
            artistName: s.artistName,
            artworkUrl100: s.artworkUrl100,
            previewUrl: s.previewUrl
          }))
          .filter(s => s.previewUrl);
      }

      function normalizeDeezer(list) {
        return (list || [])
          .map(s => ({
            trackName: s.title,
            artistName: s.artist ? s.artist.name : '',
            artworkUrl100: s.album ? s.album.cover_medium : '',
            previewUrl: s.preview
          }))
          .filter(s => s.previewUrl);
      }

      // ===== Annulation des recherches précédentes =====
      // Avant, une recherche encore "en vol" pouvait afficher ses résultats
      // APRÈS qu'une recherche plus récente ait démarré → mélange de résultats
      // ("Bell Run"), et l'accumulation de requêtes non annulées finissait
      // par faire échouer les recherches suivantes. On coupe tout net à
      // chaque nouvelle recherche.
      let searchGeneration = 0;
      let activeTeardowns = [];

      function cancelPendingSearches() {
        activeTeardowns.forEach(fn => { try { fn(); } catch (e) {} });
        activeTeardowns = [];
      }

      function jsonpRequest(url) {
        return new Promise((resolve) => {
          const callbackName = 'jsonpCb_' + Date.now() + '_' + Math.floor(Math.random() * 1e6);
          const script = document.createElement('script');
          let settled = false;

          const cleanup = () => {
            delete window[callbackName];
            if (script.parentNode) script.parentNode.removeChild(script);
            clearTimeout(timeoutId);
          };
          activeTeardowns.push(() => { if (!settled) { settled = true; cleanup(); resolve(null); } });

          const timeoutId = setTimeout(() => {
            if (settled) return;
            settled = true; cleanup();
            resolve(null);
          }, 6000);

          window[callbackName] = (data) => {
            if (settled) return;
            settled = true; cleanup();
            resolve(data);
          };
          script.onerror = () => {
            if (settled) return;
            settled = true; cleanup();
            resolve(null);
          };
          script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + callbackName;
          document.body.appendChild(script);
        });
      }

      async function searchDeezer(term, debugLog) {
        const t0 = Date.now();
        const data = await jsonpRequest(`https://api.deezer.com/search?q=${encodeURIComponent(term)}&output=jsonp`);
        const ms = Date.now() - t0;
        if (!data) { debugLog.push(`Deezer: échec/timeout (${ms}ms)`); return { ok: false, results: [] }; }
        if (!data.data) { debugLog.push(`Deezer: réponse invalide (${ms}ms)`); return { ok: false, results: [] }; }
        const results = normalizeDeezer(data.data);
        debugLog.push(`Deezer: ${results.length} résultat(s) (${ms}ms)`);
        return { ok: true, results };
      }

      async function searchItunesJSONP(term, debugLog) {
        const t0 = Date.now();
        const data = await jsonpRequest(`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=15`);
        const ms = Date.now() - t0;
        if (!data) { debugLog.push(`iTunes: échec/timeout (${ms}ms)`); return { ok: false, results: [] }; }
        if (!data.results) { debugLog.push(`iTunes: réponse invalide (${ms}ms)`); return { ok: false, results: [] }; }
        const results = normalizeItunes(data.results);
        debugLog.push(`iTunes: ${results.length} résultat(s) (${ms}ms)`);
        return { ok: true, results };
      }

      async function searchViaProxy(term, proxyPrefix, label, debugLog) {
        const t0 = Date.now();
        try {
          const target = `https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&limit=15`;
          const url = proxyPrefix + encodeURIComponent(target);
          const controller = new AbortController();
          activeTeardowns.push(() => controller.abort());
          const t = setTimeout(() => controller.abort(), 6000);
          const res = await fetch(url, { signal: controller.signal });
          clearTimeout(t);
          const ms = Date.now() - t0;
          if (!res.ok) { debugLog.push(`${label}: HTTP ${res.status} (${ms}ms)`); return { ok: false, results: [] }; }
          const data = await res.json();
          const results = normalizeItunes(data.results);
          debugLog.push(`${label}: ${results.length} résultat(s) (${ms}ms)`);
          return { ok: true, results };
        } catch (e) {
          const ms = Date.now() - t0;
          debugLog.push(`${label}: ${e.name === 'AbortError' ? 'timeout/annulé' : 'erreur réseau'} (${ms}ms)`);
          return { ok: false, results: [] };
        }
      }

      // Lance plusieurs recherches en même temps et retourne la première
      // qui répond avec des résultats, au lieu d'attendre l'échec d'un
      // service avant de tenter le suivant (beaucoup plus rapide + fiable
      // puisqu'il suffit qu'un seul des deux fonctionne).
      function firstSuccessful(promiseFactories, timeoutMs) {
        return new Promise((resolve) => {
          let remaining = promiseFactories.length;
          let done = false;
          const globalTimeout = setTimeout(() => {
            if (done) return;
            done = true;
            resolve({ ok: false, results: [] });
          }, timeoutMs);

          promiseFactories.forEach((factory) => {
            factory().then((r) => {
              remaining--;
              if (done) return;
              if (r.ok && r.results.length > 0) {
                done = true;
                clearTimeout(globalTimeout);
                resolve(r);
              } else if (remaining === 0) {
                done = true;
                clearTimeout(globalTimeout);
                resolve({ ok: false, results: [] });
              }
            });
          });
        });
      }

      async function searchItunes(term, debugLog) {
        // iTunes et Deezer en course simultanée
        const race = await firstSuccessful([
          () => searchItunesJSONP(term, debugLog),
          () => searchDeezer(term, debugLog)
        ], 6000);
        if (race.ok) return race;

        // Dernier recours si les deux ont échoué : proxies (plus lents,
        // mais mieux que rien)
        let r = await searchViaProxy(term, 'https://api.allorigins.win/raw?url=', 'Proxy1', debugLog);
        if (r.ok) return r;

        r = await searchViaProxy(term, 'https://corsproxy.io/?url=', 'Proxy2', debugLog);
        if (r.ok) return r;

        return { ok: false, results: [] };
      }

      searchBtn.addEventListener('click', async () => {
        const term = searchInput.value.trim();
        if (!term) return;

        // On coupe net toute recherche précédente encore en vol, puis on
        // démarre une nouvelle "génération" : tout résultat tardif d'une
        // ancienne recherche sera ignoré, jamais mélangé à celle-ci.
        cancelPendingSearches();
        searchGeneration++;
        const myGeneration = searchGeneration;

        searchBtn.disabled = true;

      // ---- Lecture / prévisualisation ----

      function stopPreview() {
        if (stopPreviewTimer) { clearTimeout(stopPreviewTimer); stopPreviewTimer = null; }
        if (previewAudioEl) { try { previewAudioEl.pause(); } catch(e){} }
        if (window._reversePreviewSource) {
          try { window._reversePreviewSource.stop(); } catch(e){}
          window._reversePreviewSource = null;

      }

      function getAudioContext() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        return audioCtx;
      }
      async function ensureAudioContextRunning(ctx) {
        if (ctx.state === 'suspended') {
          try { await ctx.resume(); } catch (e) { console.log('Impossible de relancer l\'audio', e); }
        }
      }
      // Déblocage définitif dès la toute première interaction sur la page.
      let audioUnlocked = false;
      function unlockAudioOnce() {
        if (audioUnlocked) return;
        audioUnlocked = true;
        try {
          const ctx = getAudioContext();
          if (ctx.state === 'suspended') ctx.resume().catch(() => {});
          const buffer = ctx.createBuffer(1, 1, 22050);
          const src = ctx.createBufferSource();
          src.buffer = buffer;
          src.connect(ctx.destination);
          src.start(0);
        } catch (e) { console.log('Déblocage audio impossible', e); }
      }
      document.addEventListener('touchstart', unlockAudioOnce, { once: true });
      document.addEventListener('click', unlockAudioOnce, { once: true });

      function reverseBuffer(ctx, buffer) {
        const out = ctx.createBuffer(buffer.numberOfChannels, buffer.length, buffer.sampleRate);
        for (let ch = 0; ch < buffer.numberOfChannels; ch++) {
          const src = buffer.getChannelData(ch);
          const dst = out.getChannelData(ch);
          for (let i = 0; i < src.length; i++) dst[i] = src[src.length - 1 - i];
        }
        return out;
      }

      function phaseCancelInstrumental(ctx, buffer) {
        if (buffer.numberOfChannels < 2) return buffer; // mono : technique inapplicable
        const out = ctx.createBuffer(2, buffer.length, buffer.sampleRate);
        const left = buffer.getChannelData(0);
        const right = buffer.getChannelData(1);
        const outL = out.getChannelData(0);
        const outR = out.getChannelData(1);
        for (let i = 0; i < left.length; i++) {
          const diff = (left[i] - right[i]) / 2;
          outL[i] = diff;
          outR[i] = diff;
        }
        return out;
      }

      // Variante 2 : creuse largement toute la zone où vit la voix humaine
      // (voix parlée/chantée ~250Hz-4000Hz), avec des bandes larges et peu
      // de Q qui se chevauchent, plutôt que des coupures étroites peu
      // audibles. Intensité réglable de léger à très marqué.
      function applyVocalNotch(ctx, node, intensity) {
        const pct = (intensity !== undefined ? intensity : 60) / 100;
        const gain = -8 - pct * 24; // -8dB (léger) à -32dB (très marqué)
        const bands = [
          { freq: 300,  q: 0.7 },
          { freq: 900,  q: 0.7 },
          { freq: 2200, q: 0.7 },
          { freq: 4000, q: 0.7 }
        ];
        let current = node;
        bands.forEach((b) => {
          const f = ctx.createBiquadFilter();
          f.type = 'peaking';
          f.frequency.value = b.freq;
          f.Q.value = b.q;
          f.gain.value = gain;
          current.connect(f);
          current = f;
        });
        return current;
      }

      let cachedBuffer = null;
      let cachedBufferUrl = null;

      async function loadBufferForSong(url) {
        if (cachedBufferUrl === url && cachedBuffer) return cachedBuffer;
        const ctx = getAudioContext();
        await ensureAudioContextRunning(ctx);
        const res = await fetch(url);
        const arrayBuffer = await res.arrayBuffer();
        const buffer = await ctx.decodeAudioData(arrayBuffer);
        cachedBuffer = buffer;
        cachedBufferUrl = url;
        return buffer;
      }

      // Construit la chaîne d'effets Web Audio (vitesse/pitch/filtre/radio)
      // et retourne le dernier nœud à connecter à la sortie.
      function buildAudioGraph(ctx, source, settings) {
        source.playbackRate.value = settings.speed || 1;
        source.detune.value = (settings.pitch || 0) * 100; // demi-tons -> cents

        let node = source;
        let gainBoost = 1;
        const variant = settings.instrumentalVariant || 1;
        if (settings.instrumental && (variant === 2 || variant === 3)) {
          node = applyVocalNotch(ctx, node, settings.instrumentalIntensity);
          gainBoost *= 1.8;
        }

        const fv = settings.filterValue || 0;
        if (fv > 15) {
          const hp = ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 100 + (fv / 100) * 4000;
          node.connect(hp);
          node = hp;
          gainBoost *= 1.6;
        } else if (fv < -15) {
          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 8000 + (fv / 100) * 7800;
          node.connect(lp);
          node = lp;
          gainBoost *= 1.6;
        }

        if (settings.radioMode) {
          const hp2 = ctx.createBiquadFilter();
          hp2.type = 'highpass';
          hp2.frequency.value = 300;
          const lp2 = ctx.createBiquadFilter();
          lp2.type = 'lowpass';
          lp2.frequency.value = 3400;
          const shaper = ctx.createWaveShaper();
          const curve = new Float32Array(256);
          for (let i = 0; i < 256; i++) {
            const x = (i / 255) * 2 - 1;
            curve[i] = Math.tanh(x * 3);
          }
          shaper.curve = curve;
          node.connect(hp2);
          hp2.connect(lp2);
          lp2.connect(shaper);
          node = shaper;
          gainBoost *= 2.2;
        }

        if (gainBoost !== 1) {
          const gainNode = ctx.createGain();
          gainNode.gain.value = Math.min(gainBoost, 4);
          node.connect(gainNode);
          node = gainNode;
        }
        return node;
      }

      function buildAudioGraphForElement(ctx, node, settings) {
        let gainBoost = 1;
        const fv = settings.filterValue || 0;
        if (fv > 15) {
          const hp = ctx.createBiquadFilter();
          hp.type = 'highpass';
          hp.frequency.value = 100 + (fv / 100) * 4000;
          node.connect(hp);
          node = hp;
          gainBoost *= 1.6;
        } else if (fv < -15) {
          const lp = ctx.createBiquadFilter();
          lp.type = 'lowpass';
          lp.frequency.value = 8000 + (fv / 100) * 7800;
          node.connect(lp);
          node = lp;
          gainBoost *= 1.6;
        }
        if (settings.radioMode) {
          const hp2 = ctx.createBiquadFilter();
          hp2.type = 'highpass';
          hp2.frequency.value = 300;
          const lp2 = ctx.createBiquadFilter();
          lp2.type = 'lowpass';
          lp2.frequency.value = 3400;
          const shaper = ctx.createWaveShaper();
          const curve = new Float32Array(256);
          for (let i = 0; i < 256; i++) {
            const x = (i / 255) * 2 - 1;
            curve[i] = Math.tanh(x * 3);
          }
          shaper.curve = curve;
          node.connect(hp2);
          hp2.connect(lp2);
          lp2.connect(shaper);
          node = shaper;
          gainBoost *= 2.2;
        }
        if (gainBoost !== 1) {
          const gainNode = ctx.createGain();
          gainNode.gain.value = Math.min(gainBoost, 4);
          node.connect(gainNode);
          node = gainNode;
        }
        return node;
      }

      let previewMediaSource = null; // un seul par élément <audio>, remis à null à chaque nouvelle chanson

      function readModalSettings() {
        return {
          speed: parseFloat(speedSlider.value) || 1,
          pitch: parseInt(pitchSlider.value, 10) || 0,
          filterValue: parseFloat(filterSlider.value) || 0,
          radioMode: radioModeCheck.checked,
          instrumental: instrumentalCheck.checked,
          instrumentalVariant: selectedVariant,
          instrumentalIntensity: parseInt(variantIntensitySlider.value, 10) || 60
        };
      }

      async function playPreview() {
        stopPreview();
        modalError.textContent = '';
        const start = parseFloat(positionSlider.value) || 0;
        const dur = parseFloat(durationSlider.value) || 10;
        const wantsReverse = reverseCheck.checked;
        const wantsInstrumental = instrumentalCheck.checked;
        const settings = readModalSettings();
        const isRealInstrumentalVariant = wantsInstrumental && settings.instrumentalVariant === 4;

        if (isRealInstrumentalVariant && !pickedInstrumentalSource) {
          modalError.textContent = "Choisis d'abord une version instrumentale dans les résultats ci-dessus.";
          return;
        }
        // Variante 4 (vraie version instru) : c'est juste une source audio
        // différente, aucun traitement DSP nécessaire — pas besoin du buffer.
        const sourceUrl = isRealInstrumentalVariant ? pickedInstrumentalSource.previewUrl : draftSong.previewUrl;
        // Reverse/pitch (et les variantes 1/3 qui font de l'annulation de
        // phase) ont vraiment besoin des octets bruts. Vitesse/filtre/radio
        // n'en ont pas besoin : chemin plus fiable (audio direct +
        // MediaElementSource), sans dépendre du CORS.
        const needsBuffer = wantsReverse || (wantsInstrumental && !isRealInstrumentalVariant) || settings.pitch !== 0;
        const needsGraph = Math.abs(settings.filterValue) > 15 || settings.radioMode;

        if (!needsBuffer) {
          try {
            if (isRealInstrumentalVariant) {
              // Nouvel élément dédié : la source réelle diffère de celle
              // déjà chargée dans previewAudioEl (chanson originale).
              stopPreview();
              const altAudio = new Audio(sourceUrl);
              currentAudio = altAudio;
              altAudio.playbackRate = settings.speed !== 1 ? settings.speed : 1;
              if (needsGraph) {
                const ctx = getAudioContext();
                await ensureAudioContextRunning(ctx);
                const src = ctx.createMediaElementSource(altAudio);
                const outNode = buildAudioGraphForElement(ctx, src, settings);
                outNode.connect(ctx.destination);
              }
              await altAudio.play();
              stopPreviewTimer = setTimeout(() => altAudio.pause(), dur * 1000);
              return;
            }

            previewAudioEl.playbackRate = settings.speed !== 1 ? settings.speed : 1;

            if (needsGraph) {
              const ctx = getAudioContext();
              await ensureAudioContextRunning(ctx);
              if (!previewMediaSource) {
                previewMediaSource = ctx.createMediaElementSource(previewAudioEl);
              } else {
                previewMediaSource.disconnect();
              }
              const outNode = buildAudioGraphForElement(ctx, previewMediaSource, settings);
              outNode.connect(ctx.destination);
            } else if (previewMediaSource) {
              // Pas de filtre cette fois, mais l'élément est déjà câblé dans
              // le graphe Web Audio depuis un essai précédent : on le
              // reconnecte directement à la sortie, sans filtre.
              previewMediaSource.disconnect();
              previewMediaSource.connect(getAudioContext().destination);
            }
            previewAudioEl.currentTime = start;
            await previewAudioEl.play();
            stopPreviewTimer = setTimeout(() => previewAudioEl.pause(), dur * 1000);
          } catch (e) {
            modalError.textContent = "Impossible de lire l'extrait (appuie une fois sur l'écran puis réessaie).";
          }
          return;
        }

        // Reverse / instrumental (variantes 1/3) / pitch : besoin du buffer
        // brut. Dépend du CORS du CDN — on tente, et on prévient si ça échoue.
        try {
          const ctx = getAudioContext();
          await ensureAudioContextRunning(ctx);
          let buffer = await loadBufferForSong(draftSong.previewUrl);
          if (wantsInstrumental && (settings.instrumentalVariant === 1 || settings.instrumentalVariant === 3)) {
            buffer = phaseCancelInstrumental(ctx, buffer);
          }
          if (wantsReverse) buffer = reverseBuffer(ctx, buffer);

          const source = ctx.createBufferSource();
          source.buffer = buffer;
          const outNode = buildAudioGraph(ctx, source, settings);
          outNode.connect(ctx.destination);
          const playFrom = wantsReverse
            ? Math.max(0, buffer.duration - start - dur)
            : start;
          source.start(0, playFrom, dur);
          window._reversePreviewSource = source;
        } catch (e) {
          modalError.textContent = "⚠️ Effets indisponibles pour ce morceau sur ce réseau. La lecture normale fonctionne toujours.";
        }
      }

      previewBtn.addEventListener('click', playPreview);

      function normalizeKey(str) {
        if (!str) return '';
        return str.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');
      }

      async function isSongAlreadyTaken(song) {
        const selSnap = await selectionsRef.once('value');
        const selections = selSnap.val() || {};
        const key = normalizeKey(song.trackName) + '|' + normalizeKey(song.artistName);
        return Object.values(selections).some((entry) =>
          entry && Array.isArray(entry.songs) &&
          entry.songs.some((s) => (normalizeKey(s.title) + '|' + normalizeKey(s.artist)) === key)
        );
      }

      confirmBtn.addEventListener('click', async () => {
        if (!draftSong) return;

        if (!allowDuplicates) {
          const taken = await isSongAlreadyTaken(draftSong);
          if (taken) {
            modalError.textContent = '⚠️ Chanson déjà sélectionnée par quelqu\'un d\'autre, choisis-en une autre.';
            return; // la modale reste ouverte, rien n'est sauvegardé
          }
        }

        const modalSettings = readModalSettings();
        const isInstrumentalOn = gameMode === 'instrumental' ? true : instrumentalCheck.checked;
        if (isInstrumentalOn && modalSettings.instrumentalVariant === 4 && !pickedInstrumentalSource) {
          modalError.textContent = '⚠️ Choisis d\'abord une version instrumentale dans les résultats, ou change de variante.';
          return;
        }

        const cardToRemove = draftCard;
        const songData = {
          title: draftSong.trackName || 'Titre',
          artist: draftSong.artistName || 'Artiste',
          artwork: draftSong.artworkUrl100 || 'https://via.placeholder.com/100',
          previewUrl: (isInstrumentalOn && modalSettings.instrumentalVariant === 4 && pickedInstrumentalSource)
            ? pickedInstrumentalSource.previewUrl
            : (draftSong.previewUrl || null),
          clipStart: parseFloat(positionSlider.value) || 0,
          clipDuration: parseFloat(durationSlider.value) || 10,
          reverse: reverseCheck.checked,
          instrumental: isInstrumentalOn,
          instrumentalVariant: modalSettings.instrumentalVariant,
          instrumentalIntensity: modalSettings.instrumentalIntensity,
          speed: modalSettings.speed,
          pitch: modalSettings.pitch,
          filterValue: modalSettings.filterValue,
          radioMode: modalSettings.radioMode
        };

        closeModal();
        searchInput.value = '';
        showSongAddedPopup(songData);

        if (isHost) {
          if (hostSelected.length >= hostQuota) {
            alert('Tu as déjà choisi toutes tes chansons');
            return;
          }
          hostSelected.push(songData);
          counterSpan.textContent = `${hostSelected.length} / ${hostQuota}`;
          const isDone = hostSelected.length >= hostQuota;
          // Sauvegarde immédiate à CHAQUE chanson choisie (pas seulement à la
          // fin) : si la page recharge ou si tu repars en cours de route,
          // rien n'est perdu.
          try {
            await selectionsRef.child('host').set({ songs: hostSelected, done: isDone });
            errorMsg.innerHTML = `<div style="color:#7fff9f;font-size:0.8rem;">✅ Sauvegardé (${hostSelected.length}/${hostQuota})</div>`;
          } catch (err) {
            hostSelected.pop(); // on annule le compteur local, l'écriture a échoué
            counterSpan.textContent = `${hostSelected.length} / ${hostQuota}`;
            errorMsg.innerHTML = `<div class="error-text">❌ ÉCHEC de sauvegarde Firebase : ${err && err.message ? err.message : err}</div>`;
            return;
          }
          if (isDone) {
            setTimeout(() => { window.location.href = 'waiting.html'; }, 500);
          } else {
            // On retire juste la carte choisie de la liste déjà affichée,
            // au lieu de relancer une recherche (ça évitait de retaper l'API
            // trop vite, ce qui déclenchait le blocage anti-abus d'Apple).
            if (cardToRemove && cardToRemove.parentNode) {
              cardToRemove.remove();
            }
          }
        } else {
          if (playerSelectedList.length >= playerQuota) {
            alert('Tu as déjà choisi toutes tes chansons');
            return;
          }
          // On tague toujours le propriétaire (pas seulement en mode Playlist) :
          // ça sert à exclure ce joueur de la devinette sur sa propre chanson.
          songData.ownerId = clientId;
          songData.ownerName = playerName;
          playerSelectedList.push(songData);
          const isDone = playerSelectedList.length >= playerQuota;
          counterSpan.textContent = `${playerSelectedList.length} / ${playerQuota}`;
          try {
            await selectionsRef.child(clientId).set({ songs: playerSelectedList, done: isDone });
          } catch (err) {
            playerSelectedList.pop();
            counterSpan.textContent = `${playerSelectedList.length} / ${playerQuota}`;
            errorMsg.innerHTML = `<div class="error-text">❌ ÉCHEC de sauvegarde Firebase : ${err && err.message ? err.message : err}</div>`;
            return;
          }
          if (isDone) {
            setTimeout(() => { window.location.href = 'waiting.html'; }, 500);
          } else if (cardToRemove && cardToRemove.parentNode) {
            cardToRemove.remove();
          }
        }
      });
    })();
  </script>
</body>
